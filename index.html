 імовірно міг зберігатися у грунті протягом такого тривалого часу?","o":["Bacillus anthracis","Francisella tularensis","Brucella abortus","Yersinia pestis","Mycobacterium bovis"]},{"id":"1hyfail","t":"М3 · Збудники зооантропонозних інфекцій","q":"Ветеринарний фельдшер, який працює на тваринницькій фермі звернувся до лікаря зі скаргами на болі у суглобах, лихоманку, нездужання, пітливість ночами. Хворіє близько місяця. З огляду на те, що хворий працює на тваринницькій фермі і відповідні скарги, лікар запідозрив у нього бруцельоз. Який матеріал, взятий у цього хворого, підлягає дослідженню у звичайній мікробіологічній лабораторії?","o":["Сироватка крові","Спинномозкова рідина","Блювотні маси","Сеча","Екскременти"]},{"id":"142stao","t":"М3 · Збудники зооантропонозних інфекцій","q":"Під час експертизи шкір тварин була використана реакція преципітації по Асколі. При обліку результатів через декілька хвилин після поєднання імунної сироватки та екстракту шкіри було відмічено утворення білуватого кільця. Про що свідчить даний результат?","o":["Наявність антигенів сибірки","Наявність токсину анаеробної інфекції","Наявність збудника бруцельозу","Поверхневого антигену ешеріхій","Вірулентного антигену сальмонел"]},{"id":"1blm9nt","t":"М3 · Збудники зооантропонозних інфекцій","q":"Доярка у розпал епідемії грипу звернулась до лікаря зі скаргами на високу температуру, загальну слабкість, відсутність апетиту, біль в суглобах. Протягом 10 діб вона лікувалась з діагнозом “грип”. Але інфекціоніст запідозрив в неї бруцельоз. Якою реакцією можна поставити остаточний діагноз бруцельоз?","o":["Райта","Хедльсона","Імунофлюорестенції","Відаля","Оухтерлоні"]},{"id":"5avpuw","t":"М3 · Збудники зооантропонозних інфекцій","q":"В селищі К. у декількох господарствах було виявлено масову загибель щурів. Виникла підозра, що причиною може бути чума. Які постмортальні дослідження тварин слід провести з метою екстренного встановлення збудника інфекції?","o":["Реакція кільцепреципітації","Реакція аглютинації","Реакція пасивної аглютинації","Реакція зв’язування комплементу","Реакція нейтралізації"]},{"id":"hj25t8","t":"М3 · Збудники зооантропонозних інфекцій","q":"З метою підтвердження діагнозу “Туляремія” мисливцю, госпіталізованому на 5 – й день, хвороби, варто провести для ранньої діагностики:","o":["Алергічну пробу","РА","РНГА","РЗК","РІФ"]},{"id":"1rhmq8o","t":"М3 · Збудники зооантропонозних інфекцій","q":"Група стоматологів України повинна поїхати у відрядження в Африку. Однак відомо, що в цій країні щороку хворіють на чуму в середньому кілька сотень людей. Яку з перерахованих вакцин потрібно використовувати для профілактики чуми?","o":["Живу вакцину ЕV","СТІ","Чумний анатоксин","Комбіновану вакцину","Хімічну вакцину"]},{"id":"1fycd19","t":"М3 · Збудники зооантропонозних інфекцій","q":"У чоловіка 44 років, мисливця на ондатр, підвищилася температура тіла до 38°С, з’явилися головний біль, набряк повік, гіперемія кон’юнктив, на шкірі в ділянці шиї утворилася неглибока виразка. Вкажіть імовірного збудника захворювання Frаnсіsеllа tulаrеnsіs Lерtоsріrа іntеrrоgаns Вrusеllа suіs Васіllus аnthrасіs Yеrsіnіа psеudоtubеrсulоsіs У лабораторії особливо небезпечних інфекцій проводиться мікроскопічне дослідження патологічного матеріалу від хворого з підозрою на чуму, забарвленого за Гінсом-Буррі. Яку","o":["властивість збудника дозволяє визначити даний метод?","Капсулоутворення","Спороутворення","Лугостійкість","Кислотостійкість"]},{"id":"1ym0aqd","t":"М3 · Збудники зооантропонозних інфекцій","q":"Наявність зерен волютину У міську інфекційну лікарню надійшов пацієнт з симптомами, що дозволили лікарю поставити попередній діагноз: туляремія. Який з нижче перерахованих методів є найбільш раннім методом діагностики і є найбільш вживаним у звичайних клінічних умовах?","o":["Алергологічний","Біологічний","Серологічний","РІФ (експрес-метод)","Бактеріологічний"]},{"id":"1tpym3m","t":"М3 · Збудники зооантропонозних інфекцій","q":"В одному з гірських селищ мала місце масова загибель гризунiв. Одночасно хворіло населення цієї мiсцевостi. Хвороба супроводжувалася швидким підвищенням температури до 40o С, вираженою інтоксикацією, збільшенням пахових лiмфовузлiв. У препаратах-мазках з трупного матеріалу виявлені грамнегативні палички овоїдної форми з біполярним забарвленням. Якi мікроорганізми є збудниками цього інфекційного захворювання?","o":["Паличка чуми","Стафілокок","Збудник туляремії","Збудник сибірки","Клостридії"]},{"id":"1atje4y","t":"М3 · Збудники зооантропонозних інфекцій","q":"При мікроскопії харкотиння хворого з попереднім діагнозом \"гостра пневмонія\" виявлено хаотично розташовані мікроорганізми овоїдної форми довжиною до 2 мкм, інтенсивніше забарвлені на полюсах. Який найбільш імовірний діагноз можна встановити на підставі отриманих даних?","o":["Легенева форма чуми","Пневмококова пневмонія","Стафілококова пневмонія","Клебсієльозна пневмонія","Дифтерія"]},{"id":"10fz9bw","t":"М3 · Збудники зооантропонозних інфекцій","q":"У хворого спостерігаються біль голови, висока температура, озноб, кашель. З харкотиння виділили палички овоїдної форми з біполярним забарвленням, грамнегативні, у мазку з бульйонної культури розташовані ланцюжками, на агарі утворюються колонії R-форми. Це характерне для збудника такого захворювання:","o":["Чума","Дифтерія","Менінгококовий назофарингіт","Стрептококова ангіна","Туберкульоз"]},{"id":"jdire9","t":"М3 · Рикетсії, хламідії, мікоплазми","q":"До інфекційної лікарні доставлено літнього чоловіка, безпритульного. Скарги на високу температуру, запаморочення, висип на шкірі. Враховуючи, що хворий страждає також на педикульоз, лікар запідозрив висипний тиф. Який метод діагностики найдоцільніше використати для підтвердження діагнозу?","o":["Серологічний","Мікроскопічний","Бактеріологічний","Алергологічний","Вірусологічний"]},{"id":"1cewzti","t":"М3 · Рикетсії, хламідії, мікоплазми","q":"У хворого діагностована пневмонія мікоплазменної етіології. Які антибіотики за механізмом дії не слід використовувати для лікування?","o":["Антибіотики, які пригнічують синтез компонентів клітинної стінки","Антибіотики, які порушують проникність цитоплазматичної мембрани","Антибіотики, які порушують синтез білка","Антибіотики, які порушують синтез нуклеїнових кислот","Антибіотики, які порушують процеси окислювального фосфорилювання"]},{"id":"q21pu2","t":"М3 · Рикетсії, хламідії, мікоплазми","q":"Мiкоплазми є своєрiдною групою мiкроорганiзмiв, що вiдносяться до родини Mycoplasmataceaе, що мають властивостi як бактерiй, так i вiрусiв. Назвiть одну особливiсть мiкоплазм, яка вiдрiзняє їх вiд бактерiй i вiрусiв:","o":["Вiдсутнiсть клiтинної стiнки","Внутрiшньоклiтинний паразитизм","Висока ферментативна активнiсть","Вiдсутнiсть клiтинної будови","Спосiб розмноження"]},{"id":"4szhq3","t":"М3 · Спірохети","q":"Чоловік помер від гострого інфекційного захворювання, яке супроводжувалось гарячкою, жовтяницею, геморагічною висипкою на шкірі та слизових оболонках, а також гострою нирковою недостатністю. При гістологічному дослідженні тканини нирки (забарвлення за Романовським-Гімзою) виявлені звивисті бактерії, які мають вигляд букв С та S. Які бактерії були виявлені?","o":["Лептоспіри","Спірили","Борелії","Кампілобактерії","Трепонеми"]},{"id":"wt26oi","t":"М3 · Спірохети","q":"При обстеженні хворого встановлено діагноз - кліщовий поворотний тиф. Яким шляхом міг заразитися хворий?","o":["Через укус селищного кліща","Через укус москіта","Через укус собачого кліща","Через укус малярійного комаря","Через укус тайгового кліща"]},{"id":"crve8c","t":"М3 · Спірохети","q":"В інфекційну клініку доставлено хворого із проявами лихоманки, що повторюється вдруге з інтервалом 2 дні. В краплі крові, зафарбованій за Романовським-Гімзою, виявлено звивисті клітини синьо-фіолетового кольору. Який мікроорганізм викликав захворювання?","o":["Borrelia recurentis","Treponema pallidum","Leptospira interrogans","Plasmodium vivax","Rickettsia typhi"]},{"id":"10i76li","t":"М3 · Спірохети","q":"До інфекційної лікарні надійшов хворий із гарячкою, що періодично повторюється . У препараті крові (товста крапля), забарвленому за методом Романовського-Гімза, виявлені спіралеподібні мікроорганізми з гострими кінцями синьо-фіолетового кольору. Який збудник виявлено?","o":["Поворотного тифу","Лептоспірозу","Висипного тифу","Черевного тифу","Малярії"]},{"id":"161d8oe","t":"М3 · Спірохети","q":"Хворий чоловік госпіталізований на 5-й день хвороби з проявами жовтяниці, болем у м’язах, ознобом, носовими кровотечами. Під час проведення лабораторної діагностики бактеріолог виконав темнопольну мікроскопію краплини крові хворого. Назвіть збудника хвороби:","o":["Leptospira interrogans","Саlymmatobacterium granulomatis","Rickettsia mooseri","Ваrtonella bacilloformis","Воrrelia dutlonii"]},{"id":"icxoti","t":"М3 · Спірохети","q":"До інфекційного відділення госпіталізували хворого з ознаками загальної слабкості, сильними головними і м’язовими болями, високою температурою, гіперемією обличчя. Встановлено, що тиждень тому хворий відпочивав біля озера. Лікар запідозрив лептоспіроз. Яким чином лептоспіри могли потрапити до організму хворого?","o":["З водою","Через предмети вжитку","З ґрунтом","З повітрям","З їжею"]},{"id":"rxa44g","t":"М3 · Спірохети","q":"У хворого з ознаками інтоксикації та ниркової недостатності виявлені у сечі рухливі мікроорганізми з численними дрібними завитками, які забарвилися за Романовським-Гімзою у рожевий колір. З анамнезу відомо, що хворий кілька днів тому купався у відкритій водоймі. Яке захворювання можна припустити?","o":["Лептоспіроз","Псевдотуберкульоз","Сифіліс","Бруцельоз","Туберкульоз"]},{"id":"rtdxvw","t":"М3 · Спірохети","q":"У пацієнта, померлого від гострого інфекційного захворювання, яке супроводжувалося гарячкою, жовтяницею, геморагічним висипом на шкірі та слизових оболонках, гострою нирковою недостатністю, під час гістологічного дослідження тканини нирки (забарвлення за Романовським-Гімзою) виявлені звивисті бактерії, які мають вигляд букв С та S. Укажіть, які бактерії були виявлені?","o":["Лептоспіри","Трепонеми","Спірили","Кампілобактерії","Борелії"]},{"id":"wz194o","t":"М3 · Патогенні гриби","q":"В лабораторію направлено матеріал білуватого нашарування із слизових оболонок ротової порожнини. Висів матеріалу зроблено на середовище Сабуро, відмічено ріст сметаноподібних колоній, бактеріоскопія виявила короткі бруньковані нитки, до збудників якої інфекції відносять ізольовані мікроорганізми ?","o":["Мікози","Спірохетози","Рікетсіози","Мікоплазмози","Хламідіози"]},{"id":"1m2mi6z","t":"М3 · Патогенні гриби","q":"У дитини на слизовiй оболонцi щiк та на язицi виявленi бiлуватi плями, якi нагадують молоко, що скипілося. У виготовлених препаратах-мазках знайденi Грам+ овальнi дрiжджоподiбнi клiтини. Якi це збудники?","o":["Гриби роду Кандiда","Стафiлококи","Дифтерiйна паличка","Актиноміцети","Фузобактерії"]},{"id":"ki2gpr","t":"М3 · Патогенні гриби","q":"До лабораторії направлено матеріал білуватого нашарування із слизових оболонок ротової порожнини. Висів матеріалу зроблено на середовище Сабуро, відмічено ріст сметаноподібних колоній. Бактеріоскопія виявила короткі бруньковані нитки. До збудників якої інфекції відносять ізольовані мікроорганізми?","o":["Мікоз","Хламідіоз","Мікоплазмоз","Рикетсіоз","Спірохетоз"]},{"id":"pjeeii","t":"М3 · Патогенні гриби","q":"У чоловіка 40 років ушкоджені міжпальцеві проміжки на ногах: шкіра мокне, відшаровується, з‘явилися тріщини. При посіві зішкрябу шкіри на середовище Сабуро виросли пухнасті колонії, білі зверху та зеленувато-жовті внизу. У мазках з верхньої частини колоній видно конідії у вигляді “дубинок” з 1-5 клітинами. Які ще органи найбільш імовірно може уразити цей збудник?","o":["Нігті","Волосся","Підшкірна клітковина","Лімфатичні судини","Слизова статевих шляхів"]},{"id":"16hqbfv","t":"М3 · Патогенні гриби","q":"Лікар - педіатр при огляді тримісячної дитини відмітив, що слизова оболонка порожнини рота, а також язик вкриті щільним білим нальотом. В матеріалі, взятому з місця ураження, бактеріолог виявив наявність грибів дріжжеподібної форми, у зв’язку з цим запідозрили мікоз:","o":["Кандидоз","Фавус","Епідермофітія","Актиномікоз","Трихофітія"]},{"id":"qiu6iw","t":"М3 · Патогенні гриби","q":"Зі слизових оболонок і харкотиння хворого, якій тривалий час приймав імунодепресанти, були виділені грампозитивні великі овальні клітини з брунькуванням, що розташовані хаотично та подовжені клітини, розташовані ланцюжками. Який збудник виділений?","o":["Кандіди","Стрептобактерії","Актиноміцети","Стрептококи","Ієрсінії"]},{"id":"vy9wz3","t":"М3 · Патогенні гриби","q":"У дитини на слизовій оболонці щік та язика виявлені білуваті плями, які нагадують молоко, що скипілося. У виготовлених препаратах-мазках знайдені грампозитивні овальні дріжджоподібні клітини. Які це збудники?","o":["Гриби роду Кандида","Фузобактерії","Актиноміцети","Дифтерійна паличка","Стафілококи"]},{"id":"536yoe","t":"М3 · Патогенні гриби","q":"При мікроскопії мікропрепарату з виділень хворої хронічним кольпо-вагінітом лікар виявив округлої форми та еліпсоподібні клітини, що брунькуються, розміром 3-6 мкм. Про збудника якої грибкової хвороби може йти мова в даному випадку?","o":["Кандидоз","Кокцидіоз","Мікроспорія","Криптококоз","Епідермофітія"]},{"id":"1ungk8s","t":"М3 · Патогенні гриби","q":"При мікроскопії зіскрібку з язика, забарвленого за Грамом, знайдені овальні, округлі, темно- фіолетового кольору, видовжені ланцюжки клітин, що брунькуються. Про збудника якого захворювання може йти мова?","o":["Кандидоз","Стрептококова інфекція","Стафілококова інфекція","Дифтерія","Актиномікоз"]},{"id":"vz9png","t":"М3 · Нормальна мікробіота тіла людини","q":"При дисбактеріозах, що супроводжуються процесом гниття (протей, псевдомонада) і підвищенням рН фекалій, необхідно призначати біологічні препарати, що закисляють середовище і проявляють антагоністичну дію. Які мікроорганізми до цього придатні?","o":["Біфідумбактерїї","Клебсієли","Азотобактерії","Серація","Ентеробактер"]},{"id":"umh8gw","t":"М3 · Клінічна мікробіологія","q":"ЦНС. Хворого 55-ти років госпіталізовано до хірургічної клініки з підозрою на сепсис. Який матеріал для дослідження необхідно взяти від хворого і на яке середовище його слід засіяти?","o":["Кров, цукровий бульйон","Сеча, м’ясо-пептонний бульйон","Пунктат лімфовузла, цистеїновий агар","Ліквор, сироватковий агар","Гній, жовточно-сольовий агар"]},{"id":"126vwo6","t":"М3 · Клінічна мікробіологія","q":"До лікарні надійшла дитина з діагнозом “стафілококовий сепсис”. На яке живильне середовище потрібно посіяти кров хворого з метою виділення збудника?","o":["Цукрово-пептонний бульйон","М’ясо-пептонний агар","Середовище Плоскірьова","Середовище Бучіна","Жовчно-сольовий агар"]},{"id":"1hzesd4","t":"М3 · Клінічна мікробіологія","q":"Хворого 55-ти років госпіталізовано у хірургічну клініку з підозрою на сепсис. Який матеріал для дослідження необхідно взяти від хворого і на яке середовище його слід засіяти?","o":["Кров, цукровий бульон","Ліквор, сироватковий агар","Сечу, м’ясо-пептонний бульон","Гній, жовточно-сольовий агар","Пунктат лімфовузла, цистеїновий агар."]},{"id":"1dykh22","t":"М3 · Клінічна мікробіологія","q":"У хворого з попереднім діагнозом ”озена” з носоглотки були виділені грамнегативні палички, які утворювали капсулу на поживному середовищі. Які мікроорганізми спричинили хворобу?","o":["Клебсієли","Мікоплазми","Сальмонели","Хламідїї","Шигели"]},{"id":"2fsiq3","t":"М3 · Клінічна мікробіологія","q":"Під час бактеріологічного дослідження сечі пацієнта з гострим циститом виділено грамнегативні рухомі палички, які на м’ясо-пептонному агарі утворюють великі слизові колонії зелено-блакитного кольору із запахом карамелі або жасмину. Який мікроорганізм, найімовірніше, спричинив захворювання?","o":["Pseudomonas aeruginosa","Proteus vulgaris","Escherichia coli","Klebsiella osaenae","Staphylococcus aureus"]},{"id":"s8c6yu","t":"М3 · Внутрішньолікарняні інфекції","q":"В хірургічному відділенні лікарні виник спалах госпітальної інфекції, що проявлялась в частому нагноєнні післяопераційних ран. При бактеріологічному дослідженні гною був виділений золотистий стафілокок. Яке дослідження треба використати для виявлення джерела цього збудника серед персоналу відділення.","o":["Фаготипування","Мікроскопічний","Серологічна ідентифікація","Визначення чутливості до антибіотиків","Біохімічна ідентифікація"]},{"id":"1gee5o8","t":"М3 · Внутрішньолікарняні інфекції","q":"При розслідуванні спалаху внутрішньолікарняної інфекції виділені чисті культури золотистого стафілокока від хворих, мед.персонала і деяких об'єктів навколишнього середовища. Яке дослідження необхідно провести, щоб встановити ідентичність виділених стафілококів і встановити джерело госпітальної інфекції?","o":["Фаготипування","Визначення биовара","Серотипування","Визначення патогенності","Зараження тварин"]},{"id":"nvtyag","t":"М3 · Внутрішньолікарняні інфекції","q":"У зв’язку з підозрою на внутрішньолікарняну інфекцію, проведено обстеження у відділенні новонароджених пологового будинку. У кількох дітей, а також на деяких предметах догляду виявлено золотистий стафілокок. Які властивості виділених культур дають можливість встановити їхнє походження з одного джерела?","o":["Фаготип","Пігментоутворення","Антигенна структура","Біохімічна активність","Антибіотикограма"]},{"id":"82put3","t":"М3 · Внутрішньолікарняні інфекції","q":"У хірургічному відділенні зареєстровано спалах госпітальної інфекції, який спричинив S. аureus. У зв'язку з цим, завідувач відділення замовив значну кількість рідкого полівалентного стафілококового бактеріофагу. Як буде використаний цей препарат?","o":["Для специфічної профілактики","Для фаготипування","Для індикації стафілококів у реакції наростання титру фага","Для виявлення бактеріоносіїв серед медичного персоналу","Для лікування хворих із хронічними формами стафілококових інфекцій"]},{"id":"5vxicg","t":"М3 · Внутрішньолікарняні інфекції","q":"При перевірці стану повітря в операційній перед операцією седиментаційним методом виявлено 5 дрібних округлих колоній, навколо яких чітко було видно зону гемолізу. На яке середовище були зроблені посіви?","o":["Кров’яний МПА","МПА","Ендо","ЖСА","Левіна"]},{"id":"13syuam","t":"М3 · Внутрішньолікарняні інфекції","q":"При визначенні мікробного числа повітря у лікарняній палаті виявилося, що воно становить 1500 клітин/м 3 . Які групи мікроорганізмів враховувалися при цьому?","o":["Всі бактерії, що виросли на живильному середовищі","Всі патогенні та умовно-патогенні бактерії","Збудники госпітальних інфекцій","Бактерії та віруси - збудники респіраторних інфекцій","Стафілококи та гемолітичні стрептококи"]},{"id":"zesa6k","t":"М3 · Внутрішньолікарняні інфекції","q":"У бактеріологічній лабораторії проводиться дослідження якості питної води. Її мікробне число виявилося близько 100. Які мікроорганізми враховувалися при цьому?","o":["Всі бактерії, що виросли на живильному середовищі","Бактерії групи кишкової палички","Умовно-патогенні мікроорганізми","Ентеропатогенні бактерії та віруси","Бактерії, патогенні для людей та тварин"]},{"id":"1c3f7hy","t":"М3 · Внутрішньолікарняні інфекції","q":"При санітарно-бактеріологічному дослідженні водопровідної води отримані наступніь результати: загальна кількість бактерій в 1,0 мл – 80, колі-індекс – 3. Як розцінити результат дослідження?","o":["Вода придатна для споживання","Вода є сумнівною","Вода є дуже сумнівною","Вода є забрудненою","Вода є дуже забрудненою"]},{"id":"1202i","t":"М3 · Внутрішньолікарняні інфекції","q":"При поточному контролі санітарно-епідемічного стану аптеки проведено бактеріологічне дослідження повітря. Встановлено наявність у ньому бацил, дріжджеподібних грибів, гемолітичних стрептококів, мікрококів. Які з виявлених мікроорганізмів свідчать про пряму епідемічну небезпеку?","o":["Гемолітичні стрептококи","Мікрококи","Бацили","Дріжджеподібні гриби","-"]},{"id":"dxpgne","t":"М3 · Внутрішньолікарняні інфекції","q":"Для оцінки придатності води для пиття проведено бактеріологічне дослідження. Який показник характеризує кількість бактерій групи кишкових паличок, що знаходяться в 1 л води?","o":["Колі-індекс","Колі-титр","Титр колі-фага","Перфрінгенс-титр","Мікробне число"]},{"id":"iowvw2","t":"М3 · Внутрішньолікарняні інфекції","q":"При санітарно-бактеріологічному дослідженні води методом мембранних фільтрів виявлено дві червоні колонії на мембранному фільтрі (середовище Ендо), через який пропустили 500 мл досліджуваної води. Розрахуйте колі-індекс та колі-титр досліджуваної води:","o":["4 та 250","2 та 500","250 та 4","500 та 2","250 та 2"]},{"id":"7nr5qz","t":"М3 · Внутрішньолікарняні інфекції","q":"У бактеріологічну лабораторію районної СЕС доставили воду із ставка, яка використовується у господарських цілях. При бакпосіві води виділено чисту культуру холерного вібріону. Яке поживне середовище було використано при цьому дослідженні?","o":["Лужний агар","МПБ","МПА","Агар Ендо","Агар Ресселя"]},{"id":"1hvt19t","t":"М3 · Внутрішньолікарняні інфекції","q":"З метою перевірки якості чистоти повітря в операційній проведено висів повітря на ряд живильних середовищ за допомогою апарата Кротова. Після інкубування на деяких із них виросли колонії, оточені чіткою зоною гемолізу. Яке середовище використано для перевірки повітря?","o":["Кров’яний МПА","Сироватковий МПА","Жовтково-сольовий агар","Середовище Ендо","Вісмут-сульфіт агар"]}];
const BUILTIN=[{"q":"У бактерій встановлений процес кон’югації","a":"Забезпечує обмін генетичного","e":"Кон’югація — передача плазмід і фрагментів ДНК від донора до реципієнта через цитоплазматичний місток. Це обмін генетичним матеріалом, а не речовинами."},{"q":"В лабораторії дерматовенерологічного диспансера","a":"Активну рухливість","e":"У темному полі в нативному препараті трепонеми видно як яскраві спіралі, насамперед за характерною рухливістю (обертальна, поступальна, згинальна)."},{"q":"У мікропрепараті, виготовленому з пунктату регіонарного","a":"Сифілісу","e":"Тонкі блідо-рожеві за Романовським–Гімзою спіралі з рівномірними завитками й гострими кінцями — Treponema pallidum, збудник сифілісу."},{"q":"У посіві гною з фурункулу знайдено","a":"Стафілококи","e":"Кулясті клітини «гроном винограду» — стафілококи: вони діляться у різних площинах."},{"q":"Із рото-глотки хлопчика, який хворіє на хронічний тонзиліт","a":"Стрептококи","e":"Коки у вигляді ланцюжків — стрептококи: вони діляться в одній площині."},{"q":"При мікроскопії мікробної культури виявлено спороутворюючі","a":"Клостридії","e":"Грампозитивні веретеноподібні палички зі спорою, ширшою за клітину, — клостридії."},{"q":"В бактеріологічну лабораторію доставлені блювотні маси","a":"Фазово-контрастна","e":"Рухливість вібріонів холери вивчають у препараті «висяча крапля» методом фазово-контрастної (або темнопольної) мікроскопії."},{"q":"Реакція імунофлюоресценції широко використовується","a":"Наявність люмінесцентного","e":"Результат РІФ видно лише в люмінесцентному мікроскопі за світінням комплексу антиген–антитіло, міченого флуорохромом."},{"q":"З харкотиння, взятого від хворої Ю., 41 року","a":"На напрямок ходу променів","e":"Імерсійне масло має показник заломлення, близький до скла, тому промені не розсіюються, а потрапляють в об’єктив, і зображення чіткіше."},{"q":"В бактеріологічній лабораторії за допомогою імерсійного","a":"Підняти конденсор","e":"Для імерсійної системи потрібне максимальне освітлення, тому конденсор піднімають до крайнього верхнього положення."},{"q":"У мазку з нальоту на мигдаликах хворого з підозрою на дифтерію виявлено палички синього","a":"Леффлера","e":"Метиленовий синій за Леффлером забарвлює палички синім, а зерна волютину на полюсах — інтенсивніше; це палички дифтерії."},{"q":"Із гнійного вмісту ураження, локалізованого","a":"Нитчасті","e":"Актиноміцети — гіллясті нитчасті бактерії, що утворюють міцелієподібні переплетення."},{"q":"В бактеріологічну лабораторію направлено харкотиння хворого на туберкульоз","a":"Ціля - Нільсена","e":"Мікобактерії туберкульозу кислотостійкі, тому їх виявляють забарвленням за Цілем–Нільсеном: вони червоні на синьому тлі."},{"q":"У баклабораторії при мікроскопії мазків з мокротиння","a":"Кислотостійкість","e":"Червоні палички після обробки кислотою — кислотостійкі мікобактерії туберкульозу (воскова оболонка з міколовими кислотами)."},{"q":"На практичному занятті з мікробіології студентам запропоновано пофарбувати готові","a":"Циля-Нільсена","e":"Для виявлення збудника туберкульозу в мокротинні застосовують фарбування за Цілем–Нільсеном."},{"q":"В препараті, зафарбованому за методом Ожешки","a":"Спори","e":"Метод Ожешки виявляє спори: вони червоні (термінальні круглі утворення), а вегетативні клітини сині."},{"q":"У пацієнта, який хворіє на правець, виявлено палички","a":"Ожешки","e":"Спори правцевої палички (барабанні палички) виявляють методом Ожешки (також Здродовського, Мюллера)."},{"q":"З центрифугату порції сечі","a":"За Цілем-Нільсеном","e":"Збудник туберкульозу нирок кислотостійкий, тому препарат з осаду сечі фарбують за Цілем–Нільсеном."},{"q":"У лабораторію поступило харкотиння хворого на туберкульоз. Який метод зафарбовування","a":"Циля-Нільсена","e":"Кислотостійкі мікобактерії туберкульозу виявляє метод Циля–Нільсена."},{"q":"Серед дітей школи-інтернату мають місце випадки","a":"Дифтерію","e":"За Нейссером палички дифтерії жовті з темними зернами волютину на кінцях і розташовуються під кутом, як римська цифра V."},{"q":"В мазку з матеріалу взятого від хворого з підозрою на дифтерію виявлені жовті","a":"Нейссера","e":"Жовті палички з синіми зернами на кінцях — характерна картина фарбування за Нейссером."},{"q":"У хворої дитини з підозрою на дифтерію було взято","a":"Зерна волютину","e":"Темно-сині потовщення на полюсах палички — зерна волютину (метахроматину), запас поліфосфатів; важлива діагностична ознака дифтерії."},{"q":"Хворий тривалий час лікується з приводу хронічної пневмонії","a":"Туберкульоз легень","e":"Тонкі червоні палички в мокротинні за Цілем–Нільсеном — кислотостійкі мікобактерії, тобто туберкульоз."},{"q":"На практичному заняттi з мiкробiологiї студентам запропоновано пофарбувати сумiш","a":"Клiтинна стiнка","e":"Грампозитивні й грамнегативні бактерії відрізняються будовою клітинної стінки: товстий пептидоглікан утримує кристалвіолет, тонкий із зовнішньою мембраною — ні."},{"q":"У баклабораторії під час мікроскопії мазків з харкотиння","a":"Кислотостійкість","e":"Червоний колір за Цілем–Нільсеном свідчить про кислотостійкість мікобактерій туберкульозу."},{"q":"Хворому на туберкульоз, в анамнезі якого була відкрита","a":"Метод Ціля-Нільсена","e":"Для виявлення мікобактерій туберкульозу в мокротинні використовують фарбування за Цілем–Нільсеном."},{"q":"У лабораторії особливо небезпечних інфекцій проводиться","a":"Капсулоутворення","e":"Метод Гінса–Бурі — негативне контрастування: клітина темна, а капсула видна як світла зона навколо неї. Збудник чуми утворює капсулу."},{"q":"У чоловіка 40 років, який хворіє на хронічне запалення","a":"Мікоплазми","e":"Колонії «яєчня» зі щільним центром, що вростає в середовище, на сироватковому агарі з холестерином — мікоплазми (немає клітинної стінки, потрібен холестерин)."},{"q":"Під час мікроскопічного дослідження зішкрібку слизової оболонки","a":"Хламідії","e":"Ретикулярні та елементарні тільця в епітеліальних клітинах — стадії внутрішньоклітинного циклу хламідій."},{"q":"В ході копрологічного дослідження у працівників кав’ярні","a":"Дизентерійна амеба","e":"Округлі цисти з чотирма ядрами характерні для Entamoeba histolytica; у кишкової амеби E. coli цисти мають вісім ядер."},{"q":"У дитини на слизовiй оболонцi щiк","a":"Гриби роду Кандiда","e":"Білуваті плівки, що нагадують молоко, що скипілося, і грампозитивні овальні дріжджоподібні клітини — кандидоз (молочниця), збудник Candida."},{"q":"У дитини на слизовій оболонці щік та язика","a":"Гриби роду Кандида","e":"Білуваті нальоти й грампозитивні овальні дріжджоподібні клітини — кандидоз ротової порожнини (молочниця), збудник Candida."},{"q":"При мікроскопічному дослідженні нативного препарату з випорожнень","a":"Entamoeba hystolitica","e":"Кров’яно-слизисті випорожнення, форми з поглинутими еритроцитами та цисти з чотирма ядрами — Entamoeba histolytica, збудник амебної дизентерії."},{"q":"У хворого з клінічними ознаками мікоплазмозу","a":"Холестерин","e":"Мікоплазми не мають клітинної стінки, а їхня мембрана містить стерини, тому середовище мусить містити холестерин (сироватку)."},{"q":"лікар-гінеколог відмітив симптоми запалення статевих","a":"Урогенітальний трихомоноз","e":"Грушоподібні найпростіші зі шипом, джгутиками й ундулюючою мембраною — Trichomonas vaginalis, збудник урогенітального трихомонозу."},{"q":"До лабораторії направлено матеріал білуватого нашарування","a":"Мікоз","e":"Білий наліт, ріст на середовищі Сабуро та брунькуючі нитки (псевдоміцелій) — дріжджоподібні гриби Candida, тобто мікоз (кандидоз)."},{"q":"Пацієнт через 15 діб після повернення з багатомісячного плавання","a":"Мікроскопічний","e":"Збудників малярії (плазмодіїв) виявляють мікроскопією мазка та товстої краплі крові, забарвлених за Романовським–Гімзою."},{"q":"У чоловіка 40 років ушкоджені міжпальцеві проміжки","a":"Нігті","e":"Булавоподібні багатоклітинні конідії та пухнасті колонії на Сабуро — дерматофіти (епідермофітія); вони вражають шкіру й нігті."},{"q":"Лікар - педіатр при огляді тримісячної дитини","a":"Кандидоз","e":"Щільний білий наліт на слизовій рота й дріжджоподібні гриби — кандидоз (молочниця)."},{"q":"У хворого, що повернувся з однєї країн Півдня","a":"Амебна дизентерія","e":"Цисти розміром близько 10 мкм із чотирма ядрами в калі при ураженні товстої кишки — Entamoeba histolytica, амебна дизентерія."},{"q":"Зі слизових оболонок і харкотиння хворого, якій тривалий час приймав","a":"Кандіди","e":"Великі овальні бруньковані клітини й псевдоміцелій у ланцюжках у хворого на імунодепресантах — Candida, оскільки імуносупресія сприяє кандидозу."},{"q":"Встановлено, що в клітинах організмів відсутні мембранні органели","a":"Прокаріоти","e":"Відсутність мембранних органел і нуклеосомної організації ДНК — ознаки прокаріотів (бактерії й археї)."},{"q":"До лікарні потрапили пацієнти зі скаргами: слабкість","a":"Амеба дизентерійна","e":"Кулясті цисти з чотирма ядрами в калі — Entamoeba histolytica (дизентерійна амеба)."},{"q":"У хворої симптоми запального процесу сечостатевих шляхів. У мазку","a":"Trichomonas vaginalis","e":"Велика грушоподібна клітина з шипом на задньому кінці, ядром та ундулюючою мембраною — Trichomonas vaginalis."},{"q":"При мікроскопії мікропрепарату з виділень хворої хронічним кольпо","a":"Кандидоз","e":"Округлі й еліпсоподібні клітини, що брунькуються, розміром 3–6 мкм — дріжджоподібні гриби Candida, кандидозний кольпіт."},{"q":"У людини після укусу москітом виникли виразки шкіри","a":"Лейшманіоз дерматотропний","e":"Безджгутикові одноклітинні (амастиготи) всередині клітин у виразці після укусу москіта — Leishmania, шкірний лейшманіоз."},{"q":"При мікроскопії зіскрібку з язика, забарвленого за Грамом","a":"Кандидоз","e":"Грампозитивні овальні клітини, що брунькуються, з ланцюжками (псевдоміцелій) — гриби роду Candida."},{"q":"підозрою на сепсис, посіяли на цукровий","a":"Стрептококи","e":"Придонний осад у цукровому бульйоні, гемоліз на кров’яному агарі й грампозитивні коки в довгих ланцюжках — стрептококи."},{"q":"Хворому поставлено діагноз газова гангрена. Після ідентифікації","a":"Стерилізація парою під тиском","e":"Матеріал зі спорами анаеробів (клостридії) знищують автоклавуванням: пара під тиском при 121 °C вбиває спори."},{"q":"розвинувся правець","a":"тта","e":"Правцевий збудник — суворий анаероб, тому первинний посів роблять на середовище Кітта–Тароцці з шматочками печінки та вазеліновим маслом."},{"q":"На спеціальному живильному середовищі, після посіву виділення гною","a":"Гонореї","e":"Грамнегативні бобоподібні диплококи — гонококи (Neisseria gonorrhoeae), збудник гонореї."},{"q":"великі грампозитивні мікроорганізми овальної подовженої форми","a":"Сабуро","e":"Грампозитивні овальні клітини з псевдоміцелієм — гриби Candida; їх висівають на середовище Сабуро."},{"q":"У лікарні вирішено проводити контроль якості стерилізації","a":"Спорові","e":"Спори — найстійкіші форми, тому як тест-культури для контролю автоклава використовують спорові бактерії (наприклад, Bacillus stearothermophilus)."},{"q":"У хворого з гострим циститом під час дослідження сечі","a":"","e":"Слизові колонії із зеленим розчинним пігментом (піоціанін) і запахом — Pseudomonas aeruginosa (синьогнійна паличка), грамнегативна оксидазопозитивна паличка."},{"q":"У хворого з нагноєнням рани при бактеріологічному дослідженні","a":"","e":"Синьо-зелений пігмент, слизові колонії та запах фіалок чи жасмину — Pseudomonas aeruginosa."},{"q":"пієлонефритом видiленi мiкроорганiзми","a":"","e":"Жовто-зелений пігмент на м’ясо-пептонному агарі й характерний запах — псевдомонади (Pseudomonas aeruginosa)."},{"q":"У пацієнтки хірургічного відділення з'явилися скарги на болі в попереку","a":"","e":"Грамнегативні оксидазопозитивні палички, слизові зеленуваті колонії зі специфічним запахом — Pseudomonas aeruginosa."},{"q":"необхідно простерилізувати живильні середовища, що містять","a":"Текучою парою, дрібно","e":"Середовища з термолабільними речовинами (сечовина, вуглеводи) стерилізують текучою парою 100 °C дробово, по 30 хв три дні поспіль (метод Тіндаля)."},{"q":"При посіві випорожнень хворого на черевний тиф на середовище Ендо","a":"Диференційно-діагностичних","e":"Середовище Ендо розрізняє бактерії за здатністю ферментувати лактозу: кишкова паличка дає червоні колонії, сальмонели — безбарвні. Тому воно диференційно-діагностичне."},{"q":"підготували до стерилізації м’ясо-пептонний бульйон","a":"Автоклавування","e":"М’ясо-пептонний бульйон стерилізують автоклавуванням при 121 °C 20–30 хв."},{"q":"При перевірці стану повітря в операційній перед операцією","a":"Кров’яний МПА","e":"Зона гемолізу навколо колоній видна на кров’яному агарі — таким чином виявляють гемолітичні стафілококи й стрептококи."},{"q":"У приймальному відділенні лікарні відбирають матеріал","a":"Для встановлення етіології гнійного","e":"Матеріал із гнійного осередку досліджують, щоб визначити збудника та його чутливість до антибіотиків для вибору лікування."},{"q":"В інфекційне відділення надійшов хворий з підозрою на дизентерію","a":"Бактеріологічний","e":"Основний метод діагностики дизентерії — бактеріологічний: виділення шигел із випорожнень і їхня ідентифікація."},{"q":"При ідентифікації збудника харчової токсикоінфекції","a":"Антигенна структура","e":"Вид і серотип сальмонел визначають за антигенною структурою (O-, H-, Vi-антигени) у реакції аглютинації з типовими сироватками."},{"q":"Бактеріологічне дослідження гнійних виділень з уретри","a":"Гонореї","e":"Грамнегативні бобоподібні диплококи («кавові зерна») всередині лейкоцитів — гонококи, збудники гонореї."},{"q":"При первинному посіві води на 1% пептону воду","a":"Збудника холери","e":"Вібріони холери швидко ростуть у лужній пептонній воді: через 6 годин на поверхні видно ніжну плівку."},{"q":"На 1% лужний пептонній воді після посіву","a":"Холери","e":"Ніжна блакитна плівка через 6–8 год на 1% лужній пептонній воді — типовий ріст Vibrio cholerae."},{"q":"З випорожнень хворого на гострий гастроентерит виділена чиста культура рухливих","a":"Вібріонам","e":"Рухливі зігнуті грамнегативні палички з ростом на лужній пептонній воді у вигляді ніжної плівки — вібріони."},{"q":"До інфекційної лікарні надійшов пацієнт з діареєю","a":"Холера","e":"Грамнегативні зігнуті палички (коми) у фекаліях при діареї — вібріони холери."},{"q":"При посіві матеріалу із зіва від хворого ангіною на кров’яно-телуритовий","a":"Коринебактерії дифтерії","e":"Сірі радіально покреслені колонії на кров’яно-телуритовому агарі та булавоподібні палички, що розташовані як розчепірені пальці, — Corynebacterium diphtheriae."},{"q":"До лабораторії надійшов матеріал із рани хворого. Попередній діагноз","a":"Бактеріологічним","e":"Видову належність збудника газової гангрени встановлюють бактеріологічним методом — виділенням чистої культури та її ідентифікацією."},{"q":"У хворого лікар діагностував гостру гонорею","a":"Реінфекція","e":"Повторне зараження тим самим збудником після повного одужання — реінфекція."},{"q":"Після довготривалого вживання антибіотиків у хворого на слизовій","a":"Гриби роду Сandida","e":"Антибіотики пригнічують нормальну мікробіоту, і розмножуються Candida: білі плями й наліт на слизовій рота — кандидоз."},{"q":"Хворий Т., 68 років піддавався тривалій антибіотикотерапії","a":"Посів матеріалу на середовище Сабуро","e":"Великі грампозитивні округлі клітини — гриби Candida; їх культивують на середовищі Сабуро."},{"q":"В лабораторiї була визначена чутливість стафiлокока","a":"Метод паперових дисків","e":"Діаметри зон затримки росту навколо дисків з антибіотиками визначають у диско-дифузійному методі (паперових дисків)."},{"q":"Для лікування бактеріальної пневмонії було призначено бензилпеніциліну","a":"Пригнічення синтезу клітинної стінки","e":"Пеніциліни блокують транспептидази й синтез пептидоглікану, тому клітинна стінка руйнується, і бактерія гине."},{"q":"У дитини, що одужує після кору, развинулася пневмонія","a":"Вторинна інфекція","e":"Вторинна інфекція приєднується на тлі основної хвороби й ослабленого імунітету — тут умовно-патогенні бактерії після кору."},{"q":"З гнійної рани хворого виділений патогенний стафілокок","a":"Гентаміцин","e":"Чим більша зона затримки росту, тим чутливіший мікроб. Найбільша зона (22 мм) — у гентаміцину, його й обирають."},{"q":"Пацієнт одужав після перенесеної дизентерії Зонне","a":"Реінфекція","e":"Повторне зараження тим самим збудником після одужання — реінфекція."},{"q":"Людина, яка проживала в ендемічному вогнищі перехворіла 3-денною малярією","a":"Рецидив","e":"Через 1,5 року після виїзду з ендемічної зони новий напад пов’язаний із збудниками, що залишилися в організмі (гіпнозоїти печінки), тобто це рецидив, а не нове зараження."},{"q":"У хворого 37 років в результаті тривалої антибіотикотерапії","a":"Еубіотики","e":"Еубіотики (пробіотики з біфідо- та лактобактеріями) відновлюють нормальну мікрофлору кишечника при дисбактеріозі."},{"q":"Поворотний тиф, що викликається B.caucasica","a":"Ендемічною","e":"Інфекція, що трапляється лише на певній території, де є переносник, — ендемічна."},{"q":"Лікар-бактеріолог виділив у хворої дитини збудника дизентерії","a":"Змішана інфекція","e":"Одночасне зараження кількома збудниками (шигели Флекснера, Зонне і кишкова паличка) — змішана (мікст-)інфекція."},{"q":"Молода людина, у якого в анамнезі була гонорея","a":"Реінфекцію","e":"Нове захворювання тим самим збудником після повного видужання — реінфекція."},{"q":"Прикладом специфічних паразитів людини є малярійний плазмодій","a":"Антропонозні","e":"Хвороби, збудники яких паразитують тільки в людини й джерело — людина, називають антропонозними."},{"q":"Лікар-педіатр, проводячи з батьками бесіду про профілактику кору","a":"Новонароджені","e":"Новонароджені мають природний пасивний імунітет: материнські IgG проходять через плаценту й захищають перші місяці життя."},{"q":"Хлопчик 1,5 років, який не отримував планові щеплення","a":"Пасивний","e":"Донорський гамаглобулін містить готові антитіла, тому створює штучний пасивний імунітет (швидкий, але короткий)."},{"q":"У сироватцi кровi новонародженого виявлено антитiла","a":"Природний пасивний","e":"Антитіла, що перейшли від матері через плаценту, дають природний пасивний імунітет."},{"q":"Для прискорення заживлення рани слизової оболонки","a":"Лізоцим","e":"Лізоцим — термостабільний білок слини, сліз, молока й яєчного білка, що руйнує пептидоглікан стінки бактерій; фактор неспецифічного захисту."},{"q":"У кабінет до лікаря-дерматолога звернувся хворий. З гнійних","a":"Фагоцитозу","e":"Гонококи всередині цитоплазми лейкоцитів — картина незавершеного фагоцитозу."},{"q":"У інфекційну лікарню потрапив пацієнт з вірусним гепатитом А","a":"IgM","e":"IgM — антитіла першої відповіді, вони з’являються першими на початку інфекції."},{"q":"У лабораторію надійшов матеріал /витяжка тваринницької","a":"Реакцію термопреципітації","e":"Антигени збудника сибірки в шкірах і сировині виявляють реакцією термопреципітації Асколі."},{"q":"Для визначення токсигенності дифтерійних паличок на щільне","a":"Лінії преципітації","e":"Токсин, що виділяє токсигенний штам, і антитоксин із паперу зустрічаються в агарі, утворюючи лінії преципітації (метод Оухтерлоні)."},{"q":"У бактеріологічній лабораторії проводиться дослідження м’ясних","a":"Нейтралізації","e":"Антитоксична сироватка нейтралізує ботулінічний токсин, тому миші, що її отримали, виживають. Це реакція нейтралізації."},{"q":"З метою індикації вірусів в культурі клітин","a":"Кольорова проба","e":"Віруси, що розмножуються в клітинах, змінюють їхній метаболізм і рН середовища, а індикатор (фенолрот) змінює колір. Це кольорова проба; ЦПД, навпаки, оцінюють під мікроскопом."},{"q":"Основним методом вірусологічної діагностики","a":"ЦПД","e":"Цитопатична дія (ЦПД) — видимі зміни клітин моношару під впливом вірусу: округлення, синцитії, деструкція. За нею судять про наявність вірусу в культурі."},{"q":"В лабораторії запланована робота по культивуванню","a":"Середовище Ігла","e":"Середовище Ігла (як і 199) — поживне синтетичне середовище для росту клітинних культур у вигляді моношару. Ендо, жовтково-сольовий та кров’яний агар — бактеріологічні середовища."},{"q":"Матеріал від хворого з попереднім діагнозом","a":"Вірусів, що мають гемаглютиніни","e":"Гемадсорбція — прилипання еритроцитів до заражених клітин, що несуть вірусні гемаглютиніни на поверхні (віруси грипу, парагрипу, паротиту). Тому реакція придатна лише для вірусів із гемаглютинінами."},{"q":"У дитини 8 міс. спостерігається дисфункція","a":"Викликає лізис умовно-патогенних","e":"Бактеріофаг специфічно інфікує й лізує бактерії. Коліпротейний фаг руйнує кишкову паличку та протей — умовно-патогенні ентеробактерії, що спричиняють дисбактеріоз."},{"q":"Пацієнт госпіталізований з попереднім діагнозом","a":"Імуноферментний аналіз","e":"Антитіло, хімічно з’єднане з ферментом (пероксидазою чи лужною фосфатазою), — основа ІФА: фермент розкладає субстрат із появою кольору, який показує зв’язування антигену з антитілом."},{"q":"В інфекційну лікарню надійшов пацієнт з клінічними ознаками енцефаліту","a":"Повторити дослідження із сироваткою","e":"Титр 1:20 недіагностичний: потрібна динаміка. Парну сироватку беруть через 10–14 днів, а діагностичним вважають наростання титру антитіл у 4 і більше разів."},{"q":"При спалаху гострої респіраторної інфекції","a":"Реакція імунофлюоресценції","e":"РІФ виявляє вірусний антиген у клітинах змиву з носоглотки за свіченням мічених флуоресцентних антитіл. Це експрес-метод: результат через 2–3 години."},{"q":"У вірусологічну лабораторію доставлено патологічний матеріал","a":"Пряма і непряма РІФ","e":"Експрес-виявлення антигену у виділеннях носових ходів виконують імунофлюоресценцією: прямою (мічені антитіла проти вірусу) або непрямою (додаткова мічена антиглобулінова сироватка)."},{"q":"В інфекційну лікарню надійшов хворий з ознаками пневмонії","a":"Виявлення антигенів вірусу грипу у харкотинні","e":"Пряме виявлення вірусних антигенів у харкотинні методом ІФА безпосередньо показує, що пневмонію спричинив вірус грипу. Серологія в парних сироватках дає відповідь лише пізніше."},{"q":"У місті епідемія грипу.","a":"Лейкоцитарний інтерферон","e":"Інтерферон — фактор неспецифічного противірусного захисту: він індукує в клітинах стан противірусної резистентності. Вакцина й імуноглобулін діють специфічно, а пеніцилін на віруси не діє."},{"q":"Вірус грипу містить внутрішні антигени","a":"Гемаглютинін та нейрамінідаза","e":"Проти поверхневих H і N утворюються віруснейтралізуючі антитіла, що й забезпечують захист. Через мінливість H і N щороку змінюють вакцину; внутрішні NP і M типоспецифічні, але стійкого імунітету не створюють."},{"q":"У хворого діагностовано ГРВІ. У сироватці крові знайдено","a":"Гострий період","e":"IgM утворюються першими, на початку інфекції, тому їхня поява свідчить про гострий період. У період реконвалесценції переважають IgG."},{"q":"При вірусоскопії клітинного моношару","a":"Утворення багатоядерних клітин","e":"РС-вірус зливає мембрани заражених клітин і утворює синцитій — багатоядерні гігантські клітини; звідси назва «респіраторно-синцитіальний»."},{"q":"У хлопчика 6 років помірне підвищення температури","a":"Статеві залози","e":"Це вірус епідемічного паротиту (свинки): він має гемаглютиніни й утворює синцитії в культурі. Крім слинних залоз, вражає статеві залози (орхіт), підшлункову залозу та нервову систему."},{"q":"У чоловіка 47 років, якого покусала лисиця","a":"Rhabdoviridae","e":"Укус лисиці, енцефаліт із розладами дихання й ковтання та тільця Бабеша–Негрі — типова картина сказу. Вірус сказу належить до родини Rhabdoviridae (кулеподібні віріони)."},{"q":"У клітинах мозку лисиці, відловленої","a":"Сказ","e":"Тільця Бабеша–Негрі — цитоплазматичні включення в нейронах (аммонів ріг, мозочок), патогномонічні для сказу."},{"q":"До хірургічного кабінету звернулася людина, яку покусала","a":"Розпочати імунізацію антирабічною","e":"Сказ після появи симптомів невиліковний, тому профілактику починають негайно, не чекаючи підтвердження. Рану обмивають милом і вводять антирабічну вакцину; при тяжких укусах обличчя додають антирабічний імуноглобулін."},{"q":"В лікарню надійшов хворий з рваною раною гомілки","a":"Антирабічну вакцину","e":"Після укусу хворої тварини проводять специфічну профілактику сказу антирабічною вакциною (курс щеплень). АКДП, АДП, БЦЖ і ТАВte захищають від інших інфекцій."},{"q":"Мисливець звернувся за медичною допомогою","a":"Введення антирабічної вакцини","e":"Специфічна профілактика сказу — це вакцинація. Хірургічна обробка й промивання рани мильним розчином важливі, але належать до неспецифічних заходів."},{"q":"Випорожнення хворого з підозрою на кишкову вірусну","a":"За допомогою реакції нейтралізації цитопатичної","e":"Типоспецифічна сироватка нейтралізує свій серотип вірусу й блокує ЦПД у культурі клітин. За відсутністю ЦПД з певною сироваткою визначають тип ентеровіруса."},{"q":"Матеріалом від дитини з попереднім діагнозом","a":"Коксакі А","e":"Віруси Коксакі А не викликають ЦПД у більшості культур клітин, але вбивають мишат-сисунків (млявий параліч). Поліовіруси, ЕСНО та Коксакі В дають ЦПД у культурі клітин."},{"q":"Для серологічної діагностики поліомієліту","a":"Живі віруси трьох типів","e":"У реакції нейтралізації ЦПД сироватку хворого змішують із живим вірусом (поліовіруси 1, 2 і 3 типів). Якщо антитіла є, вони нейтралізують вірус і ЦПД не розвивається."},{"q":"Дитина, 5 років, госпіталізована на 2-й день","a":"Випорожнення. Вірусологічний","e":"Поліовірус розмножується в кишечнику й виділяється з фекаліями, тому їх досліджують, виділяючи вірус у культурі клітин. Кров малоінформативна, ліквор беруть рідше."},{"q":"У хворого хлопчика 5 років на п'ятий день","a":"Реакція вірусної нейтралізації цитопатичної","e":"Серотип виділеного поліовіруса встановлюють реакцією нейтралізації ЦПД зі стандартними типоспецифічними сироватками: нейтралізація ЦПД вказує на тип вірусу."},{"q":"Від хворого на гостру кишкову інфекцію виділений вірус","a":"Проти білків капсиду","e":"Ентеровіруси «голі» (без суперкапсиду), а їхні типоспецифічні антигени містяться в білках капсиду. Тому діагностичні сироватки містять антитіла саме проти них."},{"q":"При перевірці крові донорів на станції","a":"Вестернблоту","e":"ІФА — скринінговий метод, і він може давати хибнопозитивні результати. Тому позитивний результат підтверджують імуноблотингом (вестерн-блотом), який виявляє антитіла до окремих білків ВІЛ (gp41, gp120, p24)."},{"q":"Після лабораторного обстеження хворого з часто","a":"Імуноферментний аналіз","e":"Діагностику ВІЛ-інфекції починають із ІФА — виявлення антитіл до ВІЛ у сироватці; позитивний результат підтверджують імуноблотингом."},{"q":"З метою діагностики ВІЛ-інфекції досліджують сироватку","a":"Проти імуноглобулінів людини","e":"У непрямому ІФА на планшеті адсорбований антиген ВІЛ, до нього зв’язуються антитіла хворого, а виявляють їх ферментмічені антитіла проти людських імуноглобулінів."},{"q":"Відомо, що вірус імунодефіциту людини належить","a":"Наявність ферменту зворотної транскриптази","e":"Ретровіруси мають РНК-геном і фермент зворотну транскриптазу (ревертазу), що синтезує ДНК за матрицею вірусної РНК; ця ДНК інтегрується в геном клітини."},{"q":"ВІЛ-інфікований пацієнт періодично обстежується","a":"Саркома Капоші","e":"Перехід у СНІД визначають за кількістю CD4⁺ Т-хелперів нижче 200 кл/мкл та появою індикаторних хвороб, як-от саркома Капоші чи пневмоцистна пневмонія."},{"q":"У хворого 25 років з численних шкірних пустул","a":"СН","e":"Одночасне зростання кількох умовно-патогенних збудників (стафілококи, пневмоцисти, криптоспоридії, кандіди, протей) — ознака глибокого імунодефіциту. Таку картину дає СНІД."},{"q":"При обстеженні молодого чоловіка у центрі профілактики","a":"Про інфікування ВІЛ","e":"Позитивний ІФА з антигенами ВІЛ без скарг означає інфікування ВІЛ (а не СНІД), яке слід підтвердити імуноблотингом. СНІД — пізня стадія з вираженим імунодефіцитом."},{"q":"Вірус імунодефіциту людини, маючи на своїй поверхні","a":"CD 4","e":"Білок gp120 оболонки ВІЛ зв’язується з рецептором CD4 на Т-хелперах, моноцитах і макрофагах; gp41 забезпечує злиття мембран."},{"q":"При дослідженні сироватки крові у пацієнта з ознаками імунодефіциту","a":"ВІЛ-інфекція","e":"Антитіла до білків gp120 і gp41 — специфічні маркери ВІЛ-інфекції, бо це оболонкові білки саме ВІЛ."},{"q":"У пацієнтки 20 років встановлено діагноз - СНІД","a":"Т-хелпери","e":"ВІЛ уражає клітини з рецептором CD4, насамперед Т-хелпери (CD4⁺), що й спричиняє імунодефіцит."},{"q":"Встановлено ураження ВІЛ Т-лімфоцитів","a":"ДНК на матриці вірусної","e":"Зворотна транскриптаза (РНК-залежна ДНК-полімераза) синтезує ДНК за матрицею вірусної РНК — це зворотний до звичайної транскрипції напрям."},{"q":"До приймального відділення інфекційної лікарні надійшов чоловік 25-ти","a":"Т-хелпери","e":"Імунодефіцит при СНІДі зумовлений загибеллю CD4⁺ Т-хелперів, які координують клітинний і гуморальний імунітет."},{"q":"Лімфоцит уражений ретровірусом ВІЛ","a":"РНК —> ДНК","e":"У ретровірусів інформація тече так: РНК → ДНК (зворотна транскрипція) → іРНК → білок, а ДНК інтегрується в геном клітини як провірус."},{"q":"У хворих із синдромом набутого імунодефіциту","a":"Т4-хелпери","e":"ВІЛ вражає Т4-хелпери (CD4⁺). Їхня загибель знижує імунний захист, що проявляється опортуністичними інфекціями й пухлинами."},{"q":"При аутопсії померлого на шкірі дистальних","a":"СН","e":"Саркома Капоші та пневмоцистна пневмонія — індикаторні хвороби СНІДу, що виникають на тлі глибокого дефіциту CD4⁺ клітин."},{"q":"У дитячому дошкільному закладі напередодні новорічних","a":"Rotavirus","e":"Під електронним мікроскопом ротавіруси нагадують колесо з маточиною й спицями (лат. rota). Вони спричиняють спалахи гастроентериту в дітей за відсутності бактеріальних збудників."},{"q":"Вагітній жінці, при постановці на облік","a":"Про первинне зараження жінки","e":"IgM — маркер свіжої, первинної інфекції. Краснуха на ранніх термінах вагітності небезпечна для плода, тому такий результат потребує негайної оцінки."},{"q":"У фекаліях трирічної дитини","a":"Ротавіруси","e":"Двошаровий капсид із виступами (спицями) та «колісна» форма — візитівка ротавірусів родини Reoviridae."},{"q":"У дитяче інфекційне відділення міської лікарні","a":"Виявлення вірусного антигену","e":"Ротавіруси погано ростуть у культурах клітин, тому діагностика ґрунтується на виявленні вірусного антигену у випорожненнях (ІФА, латекс-аглютинація, електронна мікроскопія)."},{"q":"У новонародженого виявлені такі аномалії","a":"Вірус краснухи","e":"Катаракта, вада серця (а також глухота, мікро- чи гідроцефалія) та висип у матері на ранньому терміні вагітності — класичний синдром вродженої краснухи. Вірус проходить крізь плаценту."},{"q":"При проведенні лабораторної діагностики гепатиту В","a":"Ланцюгової полімеразної","e":"ПЛР багаторазово ампліфікує невелику ділянку вірусної ДНК і виявляє її в крові навіть у малій кількості."},{"q":"З метою профілактики гепатиту В групі стоматологів","a":"Вірус дельта","e":"Вірус гепатиту D дефектний і використовує оболонку з HBsAg вірусу В. Вакцина проти гепатиту В, що створює імунітет до HBsAg, захищає й від дельта-інфекції."},{"q":"У населеному пункті зареєстровано спалах гепатиту","a":"Вірус гепатиту Е","e":"Гепатит Е передається фекально-оральним шляхом, зокрема через забруднену воду, і дає водні спалахи. Вірус гепатиту А теж передається водою, але за ключем цього питання правильна відповідь — Е."},{"q":"У хворого з жовтяницею одержано такі дані","a":"Гепатит С, в анамнезі","e":"HBsAg і HBeAg негативні, а anti-HBs IgG позитивні — це минула (або щеплена) інфекція В. Позитивний HCAg вказує на активний гепатит С."},{"q":"У зв'язку з важким перебігом гепатиту","a":"Дельта-вірус","e":"Дельта-вірус заражає лише разом із вірусом В або на його тлі (суперінфекція) і обтяжує перебіг гепатиту."},{"q":"Збудник гепатиту Д (дельта-агент)","a":"Вірусом гепатиту В","e":"HDV — дефектний вірус: його РНК вкрита оболонкою з HBsAg, тому реплікується лише в клітинах, інфікованих вірусом гепатиту В."},{"q":"У сироватці хворого виявлений імуноферментним методом","a":"Вірусний гепатит В","e":"HBsAg — поверхневий антиген вірусу гепатиту В; його поява в крові є основним маркером інфекції HBV."},{"q":"З метою перевірки крові донорів на наявність антигенів","a":"Твердофазний імуноферментний","e":"Для скринінгу донорів потрібен високочутливий метод: ІФА виявляє дуже малі кількості HBsAg, чутливіше за РЗК, РНГА чи імуноелектрофорез."},{"q":"Під час хірургічної операції пацієнту проведено переливання","a":"Віруса гепатиту В","e":"Вірус гепатиту В передається через кров, тому донорську кров обов’язково перевіряють на HBsAg (а також на ВІЛ, HCV і сифіліс)."},{"q":"Під час обстеження донора, який тривалий час","a":"Про перенесений гепатит В","e":"Anti-HBs — захисні антитіла, що з’являються після одужання (або вакцинації) і зберігаються роками. Вони свідчать про минулу інфекцію й імунітет."},{"q":"У населеному пункті зареєстрований спалах","a":"Гепатиту А","e":"Гепатит А (пікорнавірус) передається фекально-оральним шляхом, зокрема забрудненою водою, і дає водні спалахи. Гепатит Е теж має водний шлях, а В, С і D передаються парентерально."},{"q":"У лікарню доставлений хворий після автомобільної","a":"Імуноферментний аналіз","e":"HBsAg у донорській крові виявляють ІФА — чутливим методом, придатним для масового скринінгу."},{"q":"В інфекційне відділення поступила хвора з ознаками ураження","a":"Виявлення","e":"Основний специфічний маркер гепатиту В — HBsAg у сироватці. Біохімічні проби печінки показують ураження органа, але не доводять його вірусну етіологію."},{"q":"В геном вірусу вісповакцини був інтегрований","a":"Генно-інженерна","e":"Вакцину, створену вбудовуванням гена HBsAg у вектор (вірус вісповакцини), відносять до генно-інженерних (рекомбінантних)."},{"q":"Через місяць після повернення з літнього табору","a":"Фекально-оральний","e":"Вірус гепатиту А виділяється з калом і потрапляє через забруднені руки, їжу, воду; інкубація 2–6 тижнів відповідає терміну."},{"q":"У хворого по ходу міжреберних нервів","a":"РІФ з моноклональними","e":"Оперізувальний герпес спричиняє вірус Varicella-zoster. Для експрес-діагностики у зіскрібках із висипки застосовують РІФ з моноклональними антитілами."},{"q":"У 3-річної дитини тривале підвищення температури","a":"Інфекційний мононуклеоз","e":"Лихоманка, збільшення лімфовузлів і лімфоцитоз у дитини з антигеном вірусу Епштейна–Барр — типова картина інфекційного мононуклеозу."},{"q":"У трирічної дитини спостерігається підвищення","a":"Інфекційний мононуклеоз","e":"Вірус Епштейна–Барр уражає В-лімфоцити; клінічно це лихоманка, лімфаденопатія, лімфоцитоз і атипові мононуклеари."},{"q":"У жінки встановлено діагноз рак шийки матки","a":"Вірус простого герпеса тип 2","e":"⚠️ За ключем документа відповідь — ВПГ-2 (його колись пов’язували з раком шийки матки). Проте нині основною причиною вважають вірус папіломи людини (ВПЛ 16 та 18 типів). Уточніть у викладача, яку відповідь очікують."},{"q":"У пацієнтки, яка одержала імуносупресивну терапію","a":"РЗК, РН з парними","e":"Реактивацію ЦМВ підтверджують серологічно: наростання титру антитіл у парних сироватках (РЗК, РН). Нині також застосовують ПЛР."},{"q":"До пологового будинку поступила жінка 23 років","a":"Вірус герпеса","e":"Пухирці у новонародженого, ураження ЦНС і ЦПД із симпластами та внутрішньоядерними включеннями типові для вірусу простого герпесу (передається від матері під час пологів)."},{"q":"У дитячому садку спостерігалося кілька випадків","a":"Вміст везикул","e":"При вітряній віспі вірус міститься у вмісті пухирців, тому його беруть для експрес-діагностики (РІФ, ПЛР, мікроскопія)."},{"q":"У студента медінституту, госпіталізованого","a":"Виявлення Ig M-антитіл до вірусу Епштейна","e":"На 2-гу добу хвороби ще немає наростання титру в парних сироватках, тому діагноз підтверджують за IgM до антигенів вірусу Епштейна–Барр — маркером гострої інфекції."},{"q":"До неврологічного відділення поступила немолода жінка","a":"Альфа-герпесвіруси","e":"Оперізувальний лишай викликає вірус Varicella-zoster (ВПГ-3), що належить до альфа-герпесвірусів, як і ВПГ-1 та ВПГ-2."},{"q":"До лікарні поступила дитина з підвищеною температурою","a":"Вірус Епштейна-Барр","e":"Лихоманка, лімфаденопатія та атипові мононуклеари в крові — інфекційний мононуклеоз, збудник якого вірус Епштейна–Барр (гамма-герпесвірус)."},{"q":"У хворого підвищена температура, слизова оболонка щік","a":"Ацикловір","e":"Ацикловір — аналог нуклеозиду, що після фосфорилювання вірусною тимідинкіназою блокує ДНК-полімеразу вірусів герпесу."},{"q":"за допомогою ПЛР було виявлено вірус папіломи","a":"Провірус","e":"Вірус, ДНК якого вбудована в геном клітини-хазяїна, називають провірусом."},{"q":"Досить часто причиною набутих імунодефіцитів","a":"Інфекційний мононуклеоз, СНІД","e":"ВІЛ руйнує CD4⁺ Т-лімфоцити, а вірус Епштейна–Барр розмножується у В-лімфоцитах: обидва інфікують клітини імунної системи."},{"q":"У дитини 1,5 років з ОРЗ лікар запідозрив","a":"Збільшення титру антитіл","e":"Діагностичним вважають наростання титру антитіл не менш ніж у 4 рази в парних сироватках (на початку хвороби та через 2 тижні)."},{"q":"Вміст везикул із слизової оболонки хворого на натуральну","a":"Тільця Пашена","e":"При натуральній віспі в цитоплазмі уражених клітин утворюються елементарні тільця Пашена (скупчення віріонів); їх видно в мазках зі срібленням за Морозовим."},{"q":"З рогівки кролика зараженої вмістом везикул","a":"Гварнієрі","e":"У цитоплазмі клітин рогівки кролика (проба Пауля) утворюються тільця Гварнієрі — скупчення вірусу віспи, які забарвлюються за Романовським."},{"q":"У дитини 8 років лікар виявив симптоми кліщового","a":"Молоко кіз","e":"Вірус кліщового енцефаліту передається не лише кліщами, а й аліментарним шляхом — із сирим молоком інфікованих кіз чи корів."},{"q":"У клініку надійшов пацієнт з лихоманкою","a":"РН вірусів","e":"Біопроба (параліч і загибель мишей-сисунків) лише вказує на вірус; остаточну ідентифікацію виконують реакцією нейтралізації зі специфічною сироваткою."},{"q":"До інфекціоніста звернулася жінка з клінічними симптомами","a":"Зараження мишей-сисунків","e":"Вірус кліщового енцефаліту виділяють, заражаючи мишей-сисунків, а ідентифікують у РН, РЗК і РТГА (реакції затримки гемаглютинації)."}];
function loadBaked(){
  if(store('mq:bv')===BV)return;
  const m=new Map(BAKED.map(q=>[nk(q),q]));
  for(const q of bank){const b=m.get(nk(q));if(b){q.t=b.t;m.delete(nk(q))}}
  for(const q of m.values())bank.push(q);
  store('mq:bank',bank);store('mq:bv',BV);
}
function applyBuiltin(){
  loadBaked();
  const nz=s=>s.toLowerCase().replace(/[^а-яіїєґa-z0-9]/g,'');let n=0;
  const idx=BUILTIN.map(x=>({q:nz(x.q),a:nz(x.a),e:x.e}));
  for(const q of bank){if(exc[q.id])continue;const qs=nz(q.q),as=nz(q.o[0]);if(as.length<2)continue;
    const m=idx.find(x=>qs.includes(x.q)&&(as.includes(x.a)||x.a.includes(as)));if(m){exc[q.id]=m.e;n++}}
  if(n)store('mq:ex',exc);
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
applyUI();gate().then(()=>home());
