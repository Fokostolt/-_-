<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Тренажер тестів з мікробіології: кольорова вікторина з поясненнями">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тест-тренажер">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🧠%3C/text%3E%3C/svg%3E">
<title>Тест-тренажер</title>
<style>
:root{--bg:#f4f1ff;--card:#fff;--ink:#1d1a3b;--mut:#625f8a;--line:#e2ddf8;--ok:#15a34a;--bad:#e11d48;--c0:#7c5cff;--c1:#ff5c93;--c2:#ff9a1f;--c3:#0fb8a3;--c4:#2f8fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13112a;--card:#1f1c3f;--ink:#f1efff;--mut:#aaa6d6;--line:#34305f}}
:root[data-theme="dark"]{--bg:#13112a;--card:#1f1c3f;--ink:#f1efff;--mut:#aaa6d6;--line:#34305f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1;margin:8px 0 6px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--c0),var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{color:var(--mut);margin:0 0 20px}
.drop{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:28px 16px;border:2px dashed var(--c0);border-radius:20px;background:var(--card);cursor:pointer}
.drop.over{background:color-mix(in srgb,var(--c0) 12%,var(--card))}
.drop span{color:var(--mut);font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px}
.panel h3{margin:0 0 10px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--h);border-color:var(--h);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:12px}
select{font:inherit;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
label.ck{display:flex;gap:8px;align-items:center;cursor:pointer}
.btn{border:0;border-radius:14px;padding:13px 22px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--c0),var(--c1));cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
#msg{margin-top:10px;font-size:14px;color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--mut)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c3),var(--c4),var(--c0));transition:width .3s}
.q{background:var(--card);border-radius:22px;padding:22px 20px;border:1px solid var(--line);border-top:8px solid var(--h);box-shadow:0 10px 30px color-mix(in srgb,var(--h) 20%,transparent)}
.tag{display:inline-block;font-size:12px;color:#fff;background:var(--h);border-radius:999px;padding:2px 10px;margin-bottom:10px}
.q h2{font-size:clamp(18px,3.6vw,22px);line-height:1.35;margin:0}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;transition:transform .12s,border-color .12s}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--a)}
.opt b{flex:none;width:34px;height:34px;border-radius:10px;background:var(--a);color:#fff;display:grid;place-items:center}
.opt:disabled{cursor:default;opacity:.55}
.opt.ok{opacity:1;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card));animation:pop .35s}
.opt.ok b{background:var(--ok)}
.opt.bad{opacity:1;border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card));animation:shake .35s}
.opt.bad b{background:var(--bad)}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--ok) 14%,var(--card));border-left:6px solid var(--ok)}
.note.no{background:color-mix(in srgb,var(--bad) 12%,var(--card));border-color:var(--bad)}
.nav{display:flex;justify-content:flex-end;margin-top:16px}
.big{font-size:64px;font-weight:800;margin:0;color:var(--c0)}
.miss{padding:12px 0;border-top:1px solid var(--line)}
.miss small{display:block;color:var(--ok);font-weight:700;margin-top:4px}
.hi{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--h);border-radius:16px;padding:14px;margin-top:12px}.hi small{display:block;margin-top:6px}.wx{color:var(--bad)}.rx{color:var(--ok);font-weight:700}.sb{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}.sb i{display:block;height:100%;background:linear-gradient(90deg,var(--c3),var(--c4))}input[type=search],input[type=password]{flex:1;min-width:180px;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}.chips+.row{margin-bottom:6px}.ft{text-align:center;color:var(--mut);font-size:13px;padding:8px 16px 28px}summary{cursor:pointer;font-weight:700}textarea{width:100%;font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}.wk{display:flex;gap:6px;align-items:flex-end;height:44px;margin-top:8px}.wk i{flex:1;background:linear-gradient(var(--c1),var(--c0));border-radius:6px}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px;margin-top:14px}
.mod{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;transition:transform .12s,border-color .12s}
.mod:hover{transform:translateY(-2px);border-color:var(--h)}
.mod b{font-size:18px}.btn.sm{padding:9px 11px;font-size:13px}.mod small{color:var(--mut);font-size:12px;line-height:1.3}
.mod .sb{height:6px;margin-top:6px}
.mod.on{border-color:var(--h);background:color-mix(in srgb,var(--h) 15%,var(--card));box-shadow:0 6px 18px color-mix(in srgb,var(--h) 25%,transparent)}
.mod:focus-visible,.trow:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.kpis div{background:var(--bg);border-radius:12px;padding:8px 4px;text-align:center}
.kpis b{display:block;font-size:20px;line-height:1.2}.kpis small{display:block;color:var(--mut);font-size:11px}
.trow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;padding:8px 12px;margin-top:6px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.trow small{color:var(--mut);white-space:nowrap}.trow .sb{grid-column:1/-1;height:5px;margin-top:3px}
.trow.on{border-color:var(--c0);background:color-mix(in srgb,var(--c0) 14%,var(--card))}
.panel>summary,details.panel>summary{cursor:pointer}
.drop{padding:14px 12px}
@media (max-width:420px){.kpis b{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<footer class="ft">made by loveKarine228(хуй ломбаде)</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const hash=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
let bank=store('mq:bank')||[],mastered=new Set(store('mq:ok')||[]);
let cfg={mod:'',topics:new Set(),n:20,weak:false,study:false},S=null,msg='';
let stats=store('mq:st')||{},sess=store('mq:ss')||[],hv={tab:'m',q:''};
const nWrong=()=>bank.filter(q=>stats[q.id]&&stats[q.id].w).length;
const modOf=t=>(t.match(/^М(\d+)/)||[])[1]||'0',modName=m=>m==='0'?'Інше':'Модуль '+m,topicName=t=>t.replace(/^М\d+\s*·\s*/,'');
function mstat(L){let c=0,w=0,seen=0,m=0,wr=0;for(const q of L){const s=stats[q.id];if(s){c+=s.c;w+=s.w;if(s.c+s.w)seen++;if(s.w&&!mastered.has(q.id))wr++}if(mastered.has(q.id))m++}return{n:L.length,c,w,seen,m,wrong:wr,acc:c+w?Math.round(c/(c+w)*100):null,pm:L.length?Math.round(m/L.length*100):0}}
let sr=store('mq:sr')||{},fav=store('mq:fav')||{},nt=store('mq:nt')||{},day=store('mq:day')||{},fs=store('mq:fs')||1,th=store('mq:th')||'auto',ev={p:0,sus:1};
const DAY=864e5,IV=[0,1,3,7,14,30],dk=o=>new Date(Date.now()-o*DAY).toISOString().slice(0,10);
const applyUI=()=>{app.style.zoom=fs;th==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.dataset.theme=th};
const nk=q=>(q.q+'|'+q.o[0]).toLowerCase().replace(/[^а-яіїєґa-z0-9]/g,'').slice(0,90);
function srUp(id,ok){const s=sr[id]||{b:0};s.b=ok?Math.min(5,s.b+1):0;s.n=Date.now()+IV[s.b]*DAY;sr[id]=s;store('mq:sr',sr);day[dk(0)]=(day[dk(0)]||0)+1;store('mq:day',day)}
const dueList=()=>bank.filter(q=>sr[q.id]&&sr[q.id].n<=Date.now()),dueN=()=>dueList().length;
function dayBlock(){const d=[...Array(7)].map((_,i)=>day[dk(6-i)]||0),mx=Math.max(20,...d);let sk=0,i=day[dk(0)]?0:1;while(day[dk(i)]){sk++;i++}return `<div class='panel'><b>Сьогодні: ${day[dk(0)]||0} з 20</b> · серія днів: ${sk} 🔥<div class='wk'>${d.map(v=>`<i style='height:${Math.max(4,v/mx*40)}px'></i>`).join('')}</div></div>`}
function merge(txt){const have=new Set(bank.map(nk));let a=0;for(const q of parse(txt))if(!have.has(nk(q))){bank.push(q);have.add(nk(q));a++}store('mq:bank',bank);return a}
function exportCode(){return btoa(unescape(encodeURIComponent(JSON.stringify({st:stats,ss:sess,ok:[...mastered],sr,fav,nt,day}))))}
function importCode(c){try{const o=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));stats=o.st||{};sess=o.ss||[];mastered=new Set(o.ok||[]);sr=o.sr||{};fav=o.fav||{};nt=o.nt||{};day=o.day||{};store('mq:st',stats);store('mq:ss',sess);store('mq:ok',[...mastered]);store('mq:sr',sr);store('mq:fav',fav);store('mq:nt',nt);store('mq:day',day);return 1}catch(e){return 0}}
function tick(){const e=document.getElementById('tm');if(!e||!S){clearInterval(S&&S.iv);return}const l=S.lim-Math.floor((Date.now()-S.t0)/1000);if(l<=0){S.i=S.q.length;show();return}e.textContent='⏱ '+Math.floor(l/60)+':'+String(l%60).padStart(2,'0')}

/* ---------- читання файлів ---------- */
async function readPdf(file){
  if(!window.pdfjsLib)throw new Error('Не вдалося завантажити модуль читання PDF');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let out='';
  for(let p=1;p<=pdf.numPages;p++){
    const c=await(await pdf.getPage(p)).getTextContent();let last=null;
    for(const it of c.items){const y=it.transform[5];if(last!==null&&Math.abs(y-last)>2)out+='\n';out+=it.str;last=y}
    out+='\n';
  }
  return out;
}

/* ---------- розбір тестів: перша відповідь правильна ---------- */
function parse(txt){
  const L=txt.split('\n').map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);
  const isEnd=l=>/[?:]$/.test(l);
  const isHead=l=>/^Змістовий модуль/i.test(l)||(/^\d{1,2}\.\s*[А-ЯІЇЄҐ]/.test(l)&&l.length>25&&!isEnd(l));
  const out=[],seen=new Set();let topic='Загальне',mod='',i=0;
  while(i<L.length){
    const l=L[i];
    if(/^Змістовий модуль/i.test(l)){mod=(l.match(/\d+/)||[''])[0];i++;while(i<L.length&&!/\.$/.test(L[i]))i++;i++;continue}
    if(/^Тестовий комп/i.test(l)){i++;continue}
    if(isHead(l)){
      let t=l;while(i+1<L.length&&/^[а-яіїєґ(]/.test(L[i+1]))t+=' '+L[++i];
      topic=('М'+mod+' · '+t.replace(/^\d+\.\s*/,'').replace(/\*$/,'').split(/\.\s/)[0]).slice(0,80);i++;continue;
    }
    let stem=l,j=i;
    while(true){
      const cur=L[j],nx=L[j+1];
      if(isEnd(cur)||nx===undefined||j-i>8)break;
      if(/\.$/.test(cur)&&stem.length>45&&nx.length<50&&!isEnd(nx))break;
      stem+=' '+L[++j];
    }
    let k=j+1;const o=[];
    while(k<L.length&&o.length<5){
      const x=L[k];if(isHead(x))break;
      if(o.length===4&&x.length>=65&&[0,1,2].some(d=>L[k+d]&&isEnd(L[k+d])))break;
      o.push(x);k++;
    }
    if(o.length>=3){
      const key=stem.toLowerCase().slice(0,90)+'|'+o[0].toLowerCase();
      if(!seen.has(key)){seen.add(key);out.push({id:hash(key),t:topic,q:stem,o})}
      i=k;
    }else i=j+1;
  }
  return out;
}

async function addFiles(files){
  msg='Читаю файли…';home();
  let added=0;
  try{
    for(const f of files){
      const txt=/\.pdf$/i.test(f.name)?await readPdf(f):await f.text();
      const have=new Set(bank.map(nk));
      for(const q of parse(txt))if(!have.has(nk(q))){bank.push(q);have.add(nk(q));added++}
    }
    store('mq:bank',bank);
    msg=added?`Додано питань: ${added}. Усього в базі: ${bank.length}.`:'Нових питань не знайдено. Перевірте, що у файлі є питання з варіантами відповідей, а перший варіант правильний.';
  }catch(e){msg='Помилка читання файлу: '+e.message}
  home();
}

/* ---------- головний екран ---------- */
function home(){applyBuiltin();
  const inMod=q=>!cfg.mod||modOf(q.t)===cfg.mod;
  const MS=[...new Set(bank.map(q=>modOf(q.t)))].sort((a,b)=>(a==='0')-(b==='0')||a-b);
  if(cfg.mod&&!MS.includes(cfg.mod))cfg.mod='';
  const L=bank.filter(inMod),s=mstat(L),T=[...new Set(L.map(q=>q.t))],due=L.filter(q=>sr[q.id]&&sr[q.id].n<=Date.now()).length;
  const mh=m=>m===''?'var(--c0)':COL[(+m+4)%5];
  const card=(m,l)=>{const x=mstat(m===''?bank:bank.filter(q=>modOf(q.t)===m));return `<button class="mod ${cfg.mod===m?'on':''}" style="--h:${mh(m)}" data-m="${m}" aria-pressed="${cfg.mod===m}"><b>${l}</b><small>${x.n} пит.<br>${x.acc===null?'нове':x.acc+'% вірно'}</small><div class="sb"><i style="width:${x.pm}%"></i></div></button>`};
  const kp=(v,l,c='')=>`<div><b class="${c}">${v}</b><small>${l}</small></div>`;
  const rows=cfg.mod?T.map(t=>{const x=mstat(L.filter(q=>q.t===t));return `<button class="trow ${cfg.topics.has(t)?'on':''}" data-t="${esc(t)}"><span>${esc(topicName(t))}</span><small class="${x.acc!==null&&x.acc<60?'wx':''}">${x.acc===null?'нове':x.acc+'%'} · ${x.m}/${x.n}</small><div class="sb"><i style="width:${x.pm}%"></i></div></button>`}).join(''):'';
  const detail=bank.length?`<div class="panel" style="--h:${mh(cfg.mod)};border-top:6px solid ${mh(cfg.mod)}"><h3 style="display:flex;justify-content:space-between;gap:8px"><span>${cfg.mod?modName(cfg.mod):'Усі модулі'}</span><small style="color:var(--mut);font-weight:400">${T.length} тем · вивчено ${s.m}/${s.n}</small></h3>
  <div class="kpis">${kp(s.pm+'%','вивчено')}${kp(s.acc===null?'—':s.acc+'%','точність',s.acc!==null&&s.acc<60?'wx':'')}${kp(s.wrong,'проблемних',s.wrong?'wx':'')}${kp(s.n-s.seen,'нових')}</div>
  <div class="row" style="margin:0"><button class="btn" id="go">▶ ${cfg.topics.size?'Тренувати вибране':cfg.mod?'Почати модуль':'Почати'}</button>${due?`<button class="btn sm" id="due" style="padding:13px 18px;background:linear-gradient(90deg,var(--c3),var(--c4))">🔁 Повторити (${due})</button>`:''}${s.wrong?`<button class="btn ghost sm" id="mw">Помилки (${s.wrong})</button>`:''}<button class="btn ghost sm" id="hist">📒 Історія</button><button class="btn ghost sm" id="edt">✎ Питання</button></div>
  ${cfg.mod?`<p class="sub" style="margin:14px 0 0;font-size:13px">Теми модуля. Торкніться, щоб тренувати лише потрібні:</p>${rows}`:`<p class="sub" style="margin:12px 0 0;font-size:13px">Оберіть модуль вище, щоб побачити його теми та окрему статистику.</p>`}
  <details style="margin-top:14px"><summary><b>Налаштування тренування</b></summary><div class="row"><label>Питань за раз: <select id="n">${[10,20,40,0].map(n=>`<option value="${n}" ${cfg.n===n?'selected':''}>${n||'усі'}</option>`).join('')}</select></label>
  <label class="ck"><input type="checkbox" id="weak" ${cfg.weak?'checked':''}>Лише нові та помилкові</label>
  <label class="ck"><input type="checkbox" id="study" ${cfg.study?'checked':''}>Режим вивчення: одразу показувати відповідь</label><label class='ck'><input type='checkbox' id='exam' ${cfg.exam?'checked':''}>Режим іспиту (таймер, без підказок)</label><label class='ck'><input type='checkbox' id='cards' ${cfg.cards?'checked':''}>Картки (знаю / не знаю)</label><label class='ck'><input type='checkbox' id='fav' ${cfg.fav?'checked':''}>Лише закладки ★</label><label class='ck'><input type='checkbox' id='auto' ${cfg.auto!==false?'checked':''}>💡 Автопояснення після відповіді</label></div></details></div>`:'';
  const data=`<details class='panel' ${bank.length?'':'open'}><summary><b>⚙️ Файли, копія, вигляд</b></summary><div style='height:12px'></div><label class="drop" id="drop"><input type="file" id="f" accept=".pdf,.txt" multiple hidden><b>Перетягніть файли сюди</b><span>або натисніть, щоб вибрати PDF чи TXT (перший варіант правильний)</span></label><textarea id='pt' rows='3' placeholder='Або вставте тести сюди…' style='width:100%;margin-top:10px'></textarea><div class='row'><button class='btn ghost' id='pb'>Додати з тексту</button><button class='btn ghost' id='ex'>Код прогресу</button><button class='btn ghost' id='im'>Ввести код</button><button class='btn ghost' id='fs'>Aa</button><button class='btn ghost' id='th'>Тема: ${th}</button></div>

чити даний метод?","o":["Капсулоутворення","Спороутворення","Лугостійкість","Кислотостійкість","Наявність зерен волютину"]},{"id":"nte1ux","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"У чоловіка 40 років, який хворіє на хронічне запалення сечостатевих шляхів, було проведено бактеріологічне дослідження виділень з уретри. При посіві патологічного матеріалу на сироватковий агар з холестерином виросли дрібні колонії з щільним центром, що вростає в живильнесередовище, і напівпрозорою периферією. Про якого збудника вартодумати в першу чергу?","o":["Мікоплазми","Гонококи","Мікобактерії","Гарднерели","Хламідії"]},{"id":"1l1mos5","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"Під час мікроскопічного дослідження зішкрібку слизової оболонки від хворої на урогенітальну інфекцію, зафарбованого за Романовським-Гімзе, виявлено епітеліальні клітини, що містять ретикулярні та елементарні тільця. Про які патогенні мікроорганізми йдеться?","o":["Хламідії","Мікоплазми","Рикетсії","Віруси","Гриби"]},{"id":"1xigyei","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"В ході копрологічного дослідження у працівників кав’ярні лікарями санітарно- епідеміологічної станції були виявлені округлі цисти, характерною ознакою яких є наявність чотирьох ядер. Імовірніше за все у цих працівників безсимптомно паразитує:","o":["Дизентерійна амеба","Лямблія","Балантидій","Кишкова трихомонада","Амеба кишкова"]},{"id":"rt8c8t","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"У мікропрепараті виготовленому з пунктату регіонарного лімфовузла хворого, що зафарбований за Романовським-Гімза, лікар виявив тонкі мікроорганізми з 12-14 рівномірними завитками з гострими кінцями довжиною 10-13 мкм блідо-рожевого кольору. Про збудника якої інфекційної хвороби може йти мова в даному випадку?","o":["Сифілісу","Трипаносомозу","Лептоспірозу","Поворотного тифу","Лейшманіозу"]},{"id":"1m2mi6z","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"У дитини на слизовiй оболонцi щiк та на язицi виявленi бiлуватi плями, якi нагадують молоко, що скипілося. У виготовлених препаратах-мазках знайденi Грам+ овальнi дрiжджоподiбнi клiтини. Якi це збудники?","o":["Гриби роду Кандiда","Стафiлококи","Дифтерiйна паличка","Актиноміцети","Фузобактерії"]},{"id":"1aqkh43","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"При мікроскопічному дослідженні нативного препарату з випорожнень хворого, які мають кров'яно-слизистий характер, виявлені мікроорганізми округлої форми, в цитоплазмі яких містяться еритроцити, а також цисти дрібних розмірів з 4 ядрами. Про який збудник йде мова?","o":["Entamoeba hystolitica","Entamoeba coli","Lamblia intestinalis","Trichomonas intestinalis","Leichmania donovani"]},{"id":"g2dbof","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"У хворого з клінічними ознаками мікоплазмозу клінічний діагноз підтвердився даними бактеріологічного дослідження, проте, при повторному посіві патологічного матеріалу на живильне середовище мікоплазми не виділені, хоча клінічні ознаки захворювання збереглися. Можлива причина негативного результату - невірно приготовлене живильне середовище Відсутність якої речовини у середовищі буде найбільш ймовірною причиною негативного результату дослідження?","o":["Холестерин","Вітамін А","Гліцерин","Глюкоза","Агар-агар"]},{"id":"67bgef","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"При огляді хворої лікар-гінеколог відмітив симптоми запалення статевих шляхів. У мазку, взятому із піхви виявлено овально-грушоподібні найпростіші з шипом, з передньої частини яких відходять джгутики; наявна ундулююча мембрана. Яке захворювання підозрює лікар у хворої?","o":["Урогенітальний трихомоноз","Токсоплазмоз","Лямбліоз","Кишковий трихомоноз","Балантидіоз"]},{"id":"ki2gpr","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"До лабораторії направлено матеріал білуватого нашарування із слизових оболонок ротової порожнини. Висів матеріалу зроблено на середовище Сабуро, відмічено ріст сметаноподібних колоній. Бактеріоскопія виявила короткі бруньковані нитки. До збудників якої інфекції відносять ізольовані мікроорганізми?","o":["Мікоз","Хламідіоз","Мікоплазмоз","Рикетсіоз","Спірохетоз"]},{"id":"1taz1hs","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"Пацієнт через 15 діб після поверненняз багатомісячного плаванняв районахСередземномор’я та Західної Африки відчув слабкість, головний біль, періодичні підвищення температури. Лікар запідозрив у хворого малярію. Який із перерахованих методів є найбільш адекватним в діагностиці даного захворювання?","o":["Мікроскопічний","Біологічний","Алергічний","Мікробіологічний","Серологічний"]},{"id":"pjeeii","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"У чоловіка 40 років ушкоджені міжпальцеві проміжки на ногах: шкіра мокне, відшаровується, з‘явилися тріщини. При посіві зішкрябу шкіри на середовище Сабуро виросли пухнасті колонії, білі зверху та зеленувато-жовті внизу. У мазках з верхньої частини колоній видно конідії у вигляді “дубинок” з 1-5 клітинами. Які ще органи найбільш імовірно може уразити цей збудник?","o":["Нігті","Волосся","Підшкірна клітковина","Лімфатичні судини","Слизова статевих шляхів"]},{"id":"16hqbfv","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"Лікар - педіатр при огляді тримісячної дитини відмітив, що слизова оболонка порожнини рота, а також язик вкриті щільним білим нальотом. В матеріалі, взятому з місця ураження, бактеріолог виявив наявність грибів дріжжеподібної форми, у зв’язку з цимзапідозрили мікоз:","o":["Кандидоз","Фавус","Епідермофітія","Актиномікоз","Трихофітія"]},{"id":"11srutg","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"У хворого, що повернувся з однєї країн Півдня виявлено клінічні сиптоми паразитарного ураження товстої кишки. При мікроскопічному дослідженні фекалій виявлено округлої форми утворення розміром біля 10 мкм з 4 ядрами, ідентифікований як цисти збудника. Який діагноз можна поставити на основі даних лабораторного обстеження?","o":["Амебна дизентерія","Балантидіаз","Ентеробіоз","Ентероколіт","Теніоз"]},{"id":"qiu6iw","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"Зі слизових оболонок і харкотиння хворого, якій тривалий час приймав імунодепресанти, були виділені грампозитивні великі овальні клітини з брунькуванням, що розташовані хаотично та подовженіклітини, розташовані ланцюжками. Який збудник виділений?","o":["Кандіди","Стрептобактерії","Актиноміцети","Стрептококи","Ієрсінії"]},{"id":"8i51o","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"Встановлено, що в клітинах організмів відсутні мембранні органели та їх спадковий матеріал не має нуклеосомної організації. Що це за організми?","o":["Прокаріоти","Найпростіші","Віруси","Аскоміцети","Еукаріоти"]},{"id":"feihsw","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"До лікарні потрапили пацієнти зі скаргами: слабкість, болі в кишечнику, розлади травлення. Після дослідження фекалій були виявлені кулясті цисти з чотирма ядрами. Для якого найпростішого характерні такі цисти?","o":["Амеба дизентерійна","Балантидій","Амеба ротова","Амеба кишкова","Кишкова трихомонада"]},{"id":"c8a0cu","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"У хворої симптоми запального процесу сечостатевих шляхів. У мазку із слизової оболонки піхви виявлено великі одноклітинні організми грушоподібної форми з загостреним шипом на задньому кінці тіла, великим ядром та ундулюючою мембраною. Які найпростіші знайдені в мазку?","o":["Trichomonas vaginalis","Trichomonas buccalis","Lamblia intestinalis","Trichomonas hominis","Trypanosoma gambiense"]},{"id":"7wmyh2","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"При огляді хворої лікар-гінеколог відмітив симптоми запалення статевих шляхів, у мазку взятому із піхви, виявлено грушоподібні найпростіші з шипом, з передньої частини відходять джгутики, наявна ундулююча мембрана. Яке захворювання підозрює лікар у хворої?","o":["Урогенітальний трихомоноз","Балантидіоз","Лямбліоз","Токсоплазмоз","Кишковий трихоманоз"]},{"id":"vy9wz3","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"У дитини на слизовій оболонці щік та язика виявлені білуваті плями, які нагадують молоко, що скипілося. У виготовлених препаратах-мазках знайдені грампозитивні овальні дріжджоподібні клітини. Які це збудники?","o":["Гриби роду Кандида","Фузобактерії","Актиноміцети","Дифтерійна паличка","Стафілококи"]},{"id":"536yoe","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"При мікроскопії мікропрепарату з виділень хворої хронічним кольпо-вагінітом лікар виявив округлої форми та еліпсоподібні клітини, що брунькуються, розміром 3-6 мкм. Про збудника якої грибкової хвороби може йти мова в даному випадку?","o":["Кандидоз","Кокцидіоз","Мікроспорія","Криптококоз","Епідермофітія"]},{"id":"qa7zbq","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"У людини після укусу москітом виникли виразки шкіри. Аналіз вмісту виразки виявив всередині клітин людини безджгутикові одноклітинні організми. Який попередній діагноз?","o":["Лейшманіоз дерматотропний","Токсоплазмоз","Лейшманіоз вісцеральний","Трипаносомоз","Балантидіоз"]},{"id":"1ungk8s","t":"М1 · Морфологія спірохет, актиноміцетів, грибів, найпростіших, рикетсій, хламіді","q":"При мікроскопії зіскрібку з язика, забарвленого за Грамом, знайдені овальні, округлі, темно- фіолетового кольору, видовжені ланцюжки клітин, що брунькуються. Про збудника якого захворювання може йти мова?","o":["Кандидоз","Стрептококова інфекція","Стафілококова інфекція","Дифтерія","Актиномікоз"]},{"id":"4aovyb","t":"М1 · Поживні середовища для культивування мікроорганізмів","q":"Кров, яку взяли у хворого з підозрою на сепсис, посіяли на цукровий бульйон. У цукровому бульйоні утворився придонний осад. При пересіві на кров’яний агар виросли дрібні, прозорі, кулясті колонії, оточені зоною гемолізу. У мазку, приготованому з осаду, визначалися грампозитивні коки, що розташовувалися у вигляді довгих ланцюжків. Які мікроорганізми присутні у крові цього хворого?","o":["Стрептококи","Стафілококи","Сарцини","Тетракоки","Мікрококи"]},{"id":"18abp3u","t":"М1 · Поживні середовища для культивування мікроорганізмів","q":"Хворому поставлено діагноз газова гангрена. Після ідентифікації збудника досліджуваний матеріал необхідно знищити. Який метод слід використати?","o":["Стерилізація парою під тиском","Стерилізація текучою парою","Пастеризація","Кип’ятіння","Тиндалізація"]},{"id":"cx08r2","t":"М1 · Поживні середовища для культивування мікроорганізмів","q":"Через 8 днів після хірургічної операції у пацієнта розвинувся правець. Лікар запідозрив, що причиною став контамінований збудником правця шовний матеріал, який був доставлений в бактеріологічну лабораторію. Яке живильне середовище необхідно використовувати для первинного посіву шовного матеріалу?","o":["Кіттa-Тароцці","Сабуро","Ендо","Гіса","ЖСА"]},{"id":"1wdso2m","t":"М1 · Поживні середовища для культивування мікроорганізмів","q":"На спеціальному живильному середовищі, після посіву виділення гною з уретри, виросли ніжні голубуваті колонії. При мікроскопії препаратів з них виявленні грамнегативні бобовидні диплококи. Збудником якої хвороби вони є?","o":["Гонореї","Хламідіозу","Сифілісу","Туляремії","Меліоїдозу"]},{"id":"1a8y1ok","t":"М1 · Поживні середовища для культивування мікроорганізмів","q":"Під час мікроскопічного дослідження мазку слизової оболонки піхви виявлено: великі грампозитивні мікроорганізми овальної подовженоїформи, які утворювали псевдоміцелій. На яке середовище необхідно зробити посів, щоб виділити ймовірного збудника?","o":["Сабуро","Левіна","Олькеницького","Вільсона-Блера","Ендо"]},{"id":"5h9qwd","t":"М1 · Поживні середовища для культивування мікроорганізмів","q":"У лікарні вирішено проводити контроль якості стерилізації інструменту в автоклаві за допомогою біологічного методу. Які мікроорганізми найбільш доцільно використати як тест - культури?","o":["Спорові","Капсульні","Кислотостійкі","Патогенні","Термофільні"]},{"id":"1sa09lo","t":"М1 · Поживні середовища для культивування мікроорганізмів","q":"У хворого з гострим циститом під час дослідження сечі виявили лейкоцити та багато грамнегативних паличок. При посіві виросли колонії слизового характеру, які утворювали зелений розчинний пігмент. Який мікроорганізм, найбільш вірогідно, є причиною захворювання?","o":["Рsеudоmоnаs аеrugіnоsа","KІеbsіеllа рnеumоnіае","Еsсhеrіhіа соlі","Рrоtеus mіrаbіІіs","Sаlmоnеllа еntеritidis"]},{"id":"1ctas91","t":"М1 · Поживні середовища для культивування мікроорганізмів","q":"У хворого з нагноєнням рани при бактеріологічному дослідженні ранового вмісту виявлено грамнегативну паличку, яка на МПА утворює напівпрозорі слизові колонії синьо-зеленого кольору з перламутровим відтінком. Культура має специфічний запах фіалок або жасмину. Який вид збудника виділений з рани хворого?","o":["Р.аеruginosa","S. fаесаlіs","Р. vulgаris","S. рyоgеnеs","S. aureus"]},{"id":"1xsu2ij","t":"М1 · Поживні середовища для культивування мікроорганізмів","q":"При бактерiологiчному дослiдженнi сечi хворого пiєлонефритом видiленi мiкроорганiзми, що утворюють на м’ясо-пептонному агарi жовто-зелений пiгмент і характерний запах. Як вони називаються?","o":["Псевдомонади","Ешерiхiї","Протеї","Клебсiєли","Азотобактерiї"]},{"id":"9hnief","t":"М1 · Поживні середовища для культивування мікроорганізмів","q":"У пацієнтки хірургічного відділення з'явилися скарги на болі в попереку і внизу живота, хворобливе і часте сечовипускання. Після батеріологічного дослідження сечі виявлено грамнегативні оксидазопозитивні паличкоподібні бактерії, що утворюють мукоїдні колонії зеленуватого кольору зі специфічним запахом. Про який збудника можна думати?","o":["Pseudomonas aeruginosa","Proteus mirabilis","E. coli","Str. pyogenes","Mycoplasma pneumonie"]},{"id":"oazopj","t":"М1 · Поживні середовища для культивування мікроорганізмів","q":"В бактеріологічній лабораторії необхідно простерилізувати живильні середовища, що містять речовини, що змінюються при температурі вище 100оС (сечовина, вуглеводи). Який спосіб стерилізації повинен обрати лаборант?","o":["Текучою парою, дрібно","Паром під тиском в автоклаві","Кип'ятінням","Тиндалізація","Пастеризація"]},{"id":"zfnfuf","t":"М1 · Поживні середовища для культивування мікроорганізмів","q":"При посіві випорожнень хворого на черевний тиф на середовище Ендо вирослі колонії мають різне забарвлення і розміри: одні - червоні великі, інші – безбарвні, середніх розмірів. До яких за призначенням середовищ відноситься зазначене в умові живильне середовище?","o":["Диференційно-діагностичних","Елективних","Спеціальних","Селективних","Збагачення"]},{"id":"18mh5be","t":"М1 · Поживні середовища для культивування мікроорганізмів","q":"У бактеріологічній лабораторії підготували до стерилізації м’ясо-пептонний бульйон. Який із способів стерилізації слід застосувати?","o":["Автоклавування при 121oС 30 хв.","Сухим жаром 160oС 2 год.","Кип’ятіння 1 год.","Фільтрування","-"]},{"id":"5vxicg","t":"М1 · Поживні середовища для культивування мікроорганізмів","q":"При перевірці стану повітря в операційній перед операцією седиментаційним методом виявлено 5 дрібних округлих, навколо яких чітко було видно зону гемолізу. На яке середовище були зроблені посіви?","o":["Кров’яний МПА","МПА","Ендо","ЖСА","Левіна"]},{"id":"tq0yn5","t":"М1 · Ріст і розмноження мікроорганізмів","q":"У приймальномувідділенні лікарні відбирають матеріал для бактеріологічного дослідження. З якою метою слід взяти матеріал у хворого з гнійним ураженням глибоких тканин нижньої кінцівки?","o":["Для встановлення етіології гнійного процесу і визначення чутливості до антибіотиків","Для виявлення патогенного стафілокока і визначення антибіотикограми","Для виявлення збудника, щоб попередити внутрішньолікарняне інфікування","Для підтвердження анаеробної інфекції","Для виявлення токсичності збудника"]},{"id":"1p496k9","t":"М1 · Ріст і розмноження мікроорганізмів","q":"Кров, отриману від хворого з підозрою на сепсис, посіяли на цукровий бульйон. В цукровому бульйоні утворився придонний осад. При пересівання на кров'яний агар виросли дрібні, прозорі, круглі колонії, оточені зоною гемолізу. У мазку, виготовленому з осаду, визначалися грампозитивні коки, що розташовуються у вигляді довгих ланцюжків. Які мікроорганізми присутні у крові цього хворого?","o":["Стрептококи","Мікрококи","Стафілококи","Тетракоки","Сарцини"]},{"id":"1lvit4f","t":"М1 · Ріст і розмноження мікроорганізмів","q":"В інфекційне відділення надійшов хворий з підозрою на дизентерію. Який основний із наведенихметодів лабораторної діагностики необхідно назначити?","o":["Бактеріологічний.","Серологічний.","Алергічний.","Біологічний.","Мікроскопічний."]},{"id":"539an2","t":"М1 · Ріст і розмноження мікроорганізмів","q":"При ідентифікації збудника харчової токсикоінфекції з'ясувалося, що за своїми біохімічними властивостями він відноситься до роду Sаlmonеllа. Які ознаки збудника дозволять найбільш точно встановити його видову належність?","o":["Антигенна структура","Антибіотикограма","Патогенність для різних видів лабораторних тварин","Серологічний тип токсину, який виділяється збудником","Фаготип"]},{"id":"1ry9fnq","t":"М1 · Ріст і розмноження мікроорганізмів","q":"Бактеріологічне дослідження гнійних виділень з уретри з’ясувало присутність бактерій, які за Грамом фарбувалися негативно, нагадували кавові зернини, розкладали глюкозу і мальтозу до кислоти. Розташовувалися в лейкоцитах. До збудників якої хвороби їх віднести?","o":["Гонореї","Сифілісу","Венеричного лімфогранулематозу","Мякого шанкру","Меліоідозу"]},{"id":"aigvp5","t":"М1 · Ріст і розмноження мікроорганізмів","q":"При первинному посіві води на 1% пептону воду, через 6 годин на поверхні середовища виявлено ріст - ніжна плівка. Для збудника якого захворювання характерні такі культуральні властивості?","o":["Збудника холери","Збудника чуми","Збудника туберкульозу","Збудника дизентерії","Збудника псевдотуберкульозу"]},{"id":"12lpdzu","t":"М1 · Ріст і розмноження мікроорганізмів","q":"На 1% лужний пептонній воді після посіву в неї досліджуваного матеріалу (випорожнень) і 8 годинної інкубації в термостаті при 37°С виявлено ріст у вигляді ніжної блакитної плівки. Для збудника якого захворювання характерні такі культуральні властивості?","o":["Холери","Чуми","Черевного тифу","Паратифів А","Дизентерії"]},{"id":"15tyrwi","t":"М1 · Ріст і розмноження мікроорганізмів","q":"З випорожнень хворого на гострий гастроентерит виділена чиста культура рухливих дрібних, дещо зігнутих грам негативних паличок, які впродовж 6 годин дають ріст на лужній 1% пептонній воді у вигляді ніжної голубуватої плівки. Яким мікроорганізмам притаманні такі властивості?","o":["Вібріонам","Спірохетам","Клостридіям","Бацилам","Спірилам"]},{"id":"99kxkh","t":"М1 · Ріст і розмноження мікроорганізмів","q":"До інфекційної лікарні надійшов пацієнт з діареєю. Під час бактеріоскопічного дослідження фекальних мас виявили грамнегативні зігнуті палички. Яке захворювання можна припустити у хворого?","o":["Холера","Сальмонельозний гастроентерит","Дифтерія","Кишкова форма чуми","Черевний тиф"]},{"id":"14hgq2k","t":"М1 · Ріст і розмноження мікроорганізмів","q":"При посіві матеріалу із зіва від хворого ангіною на кров’яно-телуритовий агар виросли колонії діаметром 4-5мм, сірого кольору, радіально покреслені (у вигляді розеток). Під мікроскопом грампозитивні палички із булавовидними потовщеннями на кінцях, розміщені у вигляді розтопирених пальців. Які це мікроорганізми?","o":["Коринебактерії дифтерії","Клостридії ботулізму","Дифтероїди","Стрептококи","Стрептобацили"]},{"id":"1lyl2zw","t":"М1 · Виділення чистих культур бактерій та їх ідентифікація (3 заняття)","q":"До лабораторії надійшов матеріал із рани хворого. Попередній діагноз – газова гангрена. Яким мікробіологічним методом можна встановити видовуналежність збудника?","o":["Бактеріологічним","Алергічним","Бактеріоскопічним","Серологічним","РІА"]},{"id":"qgiwwv","t":"М1 · Виділення чистих культур бактерій та їх ідентифікація (3 заняття)","q":"Через 8 днiв пiсля хiрургiчної операцiї у пацiєнта розвинувся правець. Лiкар запiдозрив, що причиною став контамiнований збудником правця шовний матерiал, який був доставлений в бактерiологiчну лабораторiю. Яке живильне середовище необхiдно використовувати для первинного посiву шовного матерiалу?","o":["Кiтта-Тароццi","Ендо","Сабуро","ЖСА","Гiса"]},{"id":"10f77ww","t":"М1 · Хіміотерапевтичні препарати","q":"У хворого лікар діагностував гостру гонорею. З анамнезу відомо, що раніше він переніс гонорею та вилікування було повним. До якої категорії інфекцій можна віднести це нове захворювання?","o":["Реінфекція","Суперінфекція","Вторинна інфекція","Рецидив","Аутоінфекція"]},{"id":"1i7yk18","t":"М1 · Хіміотерапевтичні препарати","q":"Після довготривалого вживання антибіотиків у хворого на слизовій ротової порожнини з’явилися округлі білі плями, на язику білий наліт. Який мікроорганізм імовірно спричинив дані симптоми?","o":["Гриби роду Сandida","Ентерокок","Кишкова паличка","Лактобацили","Стрептокок"]},{"id":"18r915h","t":"М1 · Хіміотерапевтичні препарати","q":"Хворий Т., 68 років піддавався тривалій антибіотикотерапії. Після такого лікування у хворого з'явився білуватий наліт на слизовій порожнини рота. Мікроскопічне вивчення мазків, виготовлених з нальотів, виявило великі, округлої форми, різної величини, грампозитивні мікроорганізми. Що необхідно зробити для продовження мікробіологічної діагностики?","o":["Посів матеріалу на середовище Сабуро","Посів на середовище Плоскірєва","Посів матеріалу на середу Кітта - Тароцці","Посів матеріалу на середовище Ендо","Посів на жовточно-сольовий агар"]},{"id":"1y7w7zk","t":"М1 · Хіміотерапевтичні препарати","q":"В лабораторiї була визначена чутливість стафiлокока до антибіотиків i отримані наступні результати дослідження - діаметр зон затримки росту дорівнює: пенiцилiн - 8 мм, оксацилiн - 8 мм, ампiцилiн - 25 мм, гентамiцин - 22 мм. Який метод дослідження був використаний?","o":["Метод паперовихдисків","Метод серійних розведень","Біохімічний","Бактерiоскопiчний","Біометричний"]},{"id":"szyt3m","t":"М1 · Хіміотерапевтичні препарати","q":"Для лікування бактеріальної пневмонії було призначено бензилпеніциліну натрієву сіль. Який механізм антимікробної дії препарату?","o":["Пригнічення синтезу клітинної стінки мікроорганізмів","Пригнічення внутрішньоклітинного синтезу білка","Пригнічення активності холінестерази","Пригнічення SH-груп ферментів мікроорганізмів","Антагонізм з параамінобензойною кислотою"]},{"id":"d24qht","t":"М1 · Хіміотерапевтичні препарати","q":"У дитини, що одужує після кору, развинулася пневмонія, викликана умовно-патогенними бактеріями. Яка найбільш імовірна форма цієї інфекції?","o":["Вторинна інфекція","Реінфекція","Суперінфекція","Персистуюча інфекція","Госпітальна інфекція"]},{"id":"1jh80cg","t":"М1 · Хіміотерапевтичні препарати","q":"З гнійної рани хворого виділений патогенний стафілокок і визначена чутливість його до антибіотиків: пеніцилін - зона затримки росту 8 мм; оксацилін - 9 мм; ампіцилін - 10 мм; гентаміцин - 22 мм; линкомицин - 11 мм. Який антибіотик необхідно вибрати для лікування хворого?","o":["Гентаміцин","Оксацилін","Ампіцилін","Пеніцилін","Лінкоміцин"]},{"id":"1iafd1c","t":"М1 · Хіміотерапевтичні препарати","q":"Пацієнт одужав після перенесеної дизентерії Зоннеі повторнозаразився цим же збудником. Як називається така форма інфекції?","o":["Реінфекція","Рецидив","Суперінфекція","Персистуюча інфекція","Хронічна інфекція"]},{"id":"3xbycy","t":"М1 · Хіміотерапевтичні препарати","q":"Людина, яка проживала в ендемічному вогнищі перехворіла 3-денною малярією. Після переїзду в іншу місцевість, через 1,5 року після переїзду захворіла на малярію знову. Яка найбільш вірогідна форма цього захворювання?","o":["Рецидив","Реінфекція","Суперінфекція","Персистуюча інфекція","Вторинна інфекція"]},{"id":"1nhbbuw","t":"М1 · Хіміотерапевтичні препарати","q":"У хворого 37 років в результаті тривалої антибіотикотерапії розвинувся дисбактеріоз кишечника. Який вид препаратів необхідно використати для нормалізації кишкової мікрофлори?","o":["Еубіотики","Сульфаніламіди","Бактеріофаги","Аутовакцини","Вітаміни"]},{"id":"3swfu3","t":"М1 · Хіміотерапевтичні препарати","q":"Поворотний тиф, що викликається B.caucasica зустрічається лише на певних територіях, де є переносник кліщ роду Alectorobius. Як можна назвати таку інфекцію?","o":["Ендемічною","Екзотичною","Спорадичною","Пандемічною","Епідемічною"]},{"id":"1vkxys0","t":"М1 · Хіміотерапевтичні препарати","q":"Лікар-бактеріолог виділив у хворої дитини збудника дизентерії Флекснера -тип 2, Зонне - тип I та ентеропатогенну кишкову паличку - 055 / В5. Як називається такий тип інфекції у даної дитини?","o":["Змішана інфекція","Вторинна інфекція","Носійство патогеннихбактерій","Суперінфекція","Реінфекція"]},{"id":"1o8li90","t":"М1 · Хіміотерапевтичні препарати","q":"Молода людина, у якого в анамнезі була гонорея і від якої він повністю вилікувався, знову занедужав на гонорею. В даному випадку можна говорити про:","o":["Реінфекцію","Мікст-інфекцію","Рецидив","Суперинфекцію","Вторинної інфекцію"]},{"id":"x27ia1","t":"М1 · Хіміотерапевтичні препарати","q":"Прикладом специфічних паразитів людини є малярійний плазмодій, гострик дитячий і деякі інші. Джерелом інвазії таких паразитів завжди є людина. Такі специфічні паразити людини викликають захворювання, які називаються:","o":["Антропонозні","Мультифакторіальні","Інфекційні","Зоонозні","Антропозоонозні"]},{"id":"5oty1b","t":"М1 · Фактори природженого імунітету","q":"Лікар-педіатр, проводячи з батьками бесіду про профілактику кору, зауважив, що певна категорія дітей має природний пасивний імунітет до цього захворювання. Яких саме дітей мав на увазі лікар?","o":["Новонароджені","Старші 14 років","Ті, що перенесли кір на першому році життя","Ті, що отримали планові щеплення","Ті, чиї батьки не хворіли на кір"]},{"id":"16y5vl8","t":"М1 · Фактори природженого імунітету","q":"Хлопчик 1,5 років, який не отримував плановіщеплення, контактував з хворим на кір. З метою екстреної специфічної профілактики дитині було введено донорський гамаглобулін. Який вид імунітету було створено при цьому?","o":["Пасивний","Природний","Антитоксичний","Поствакцинальний","Місцевий"]},{"id":"xeacy4","t":"М1 · Фактори природженого імунітету","q":"У сироватцi кровi новонародженого виявлено антитiла до вiрусу кору. Про наявнiсть якого iмунiтету це може свiдчити?","o":["Природний пасивний","Природний активний","Штучний пасивний","Штучний активний","Спадковий, видовий"]},{"id":"1y5piv6","t":"М1 · Фактори природженого імунітету","q":"Для прискорення заживлення рани слизової оболонки в ротовій порожнині хворому призначено препарат, який являє собою термостабільний білок, що міститься у людини в сльозах, слині, грудному молоці матері, а також його можна виявити в свіжознесеному курячому яйці. Відомо, що він являє собою фактор природної резистентності організму і має назву:","o":["Лізоцим","Комплемент","Інтерферон","Інтерлейкін","Іманін"]},{"id":"1s5p972","t":"М1 · Фактори природженого імунітету","q":"У кабінет до лікаря-дерматолога звернувся хворий. З гнійних виділень уретри цього пацієнта лікар приготував мазок, пофарбував за Грамом. При мікроскопії в препараті виявлена маса лейкоцитів, в цитоплазмі яких знаходилася велика кількість грамнегативних бобоподібної форми диплококів. Результати якого процесу спостерігаються в препараті?","o":["Фагоцитозу","Метаболізму","Капсулоутворення","Спороутворення","Малігнізації"]},{"id":"i18ogt","t":"М1 · Фактори природженого імунітету","q":"У місті епідемія грипу. Який препарат доцільно використати для неспецифічної профілактики захворювання?","o":["Лейкоцитарний інтерферон","Пеніцилін","Протигрипозний імуноглобулін","Протигрипозна сироватка","Протигрипозна вакцина"]},{"id":"1je0w9k","t":"М1 · Серологічні реакції","q":"У інфекційну лікарню потрапив пацієнт з вірусним гепатитом А. Які антитіла будуть синтезуватися першими у відповідь на збудника?","o":["IgM","IgG","IgA","IgD","IgE"]},{"id":"1sfw2ky","t":"М1 · Серологічні реакції","q":"У лабораторію надійшов матеріал /витяжка тваринницької сировини/ з району, де відмічені випадки сибірки серед тварин. Яку серологічну реакцію необхідно застосувати для виявлення антигенів збудника у досліджуваному матеріалі?","o":["Реакцію термопреципітації","Реакцію зв’язування комплементу","Реакцію непрямої гемаглютинації","Радіоімунний аналіз","Реакцію преципітації в агарі"]},{"id":"1o4dsli","t":"М1 · Серологічні реакції","q":"Для визначення токсигенності дифтерійних паличок на щільне живильне середовище поклали смужку фільтрувального паперу просочену антитоксичною протидифтерійною сироваткою, а поруч з нею підсіяли у вигляді бляшок досліджувану культуру мікробів і токсигенний штам. Якщо досліджувана культура мікробів продукує екзотоксин то утворюються:","o":["Лінії преципітації","Зони гемолізу","Зони дифузного помутніння","Зони лецитовітелазної активності","Кільце преципітації"]},{"id":"17ad3y5","t":"М1 · Серологічні реакції","q":"У бактеріологічній лабораторії проводиться дослідження м’ясних консервів на вміст ботулінічного токсину. Для цього дослідній групі мишей ввели екстракт із досліджуваного матеріалу та антитоксичнупротиботулінічну сироваткутипів А, B, Е; контрольній групі мишей ввели екстракт без протиботулінічної сироватки. Яку серологічну реакцію було використано?","o":["Нейтралізації","Преципітації","Опсонофагоцитарна","Зв’язування комплементу","Подвійної імунної дифузії"]},{"id":"3j8fu3","t":"М1 · Серологічні реакції","q":"Держсанінспекцією вилучена на базарі партія ковбаси з назвою \"свиняча домашня\" в зв'язку з підозрою щодо її фальсифікації. За допомогою якої серологічної реакції імунітету можна ідентифікувати харчовий продукт?","o":["Преципітації","РЗК","Аглютинації","Імунофлюоресценції","РНГА"]},{"id":"142stao","t":"М1 · Серологічні реакції","q":"Під час експертизи шкір тварин була використана реакція преципітації по Асколі. При обліку результатів через декілька хвилин після поєднання імунної сироватки та екстракту шкіри було відмічено утворення білуватого кільця. Про що свідчить даний результат?","o":["Наявність антигенів сибірки","Наявність токсину анаеробної інфекції","Наявність збудника бруцельозу","Поверхневого антигену ешерихій","Вірулентного антигену сальмонел"]},{"id":"19y78qw","t":"М1 · Серологічні реакції","q":"З метою встановлення токсигенності виділених від пацієнтів збудників дифтерії культури висіяли на чашку Петрі з поживним агаром по обидва боки від розташованої у центрі смужки фільтрувального паперу, змоченого протидифтерійною антитоксичною сироваткою. Після інкубації посівів в агарі між окремими культурами і смужкою фільтрувального паперу виявлено смужкоподібні ділянки помутніння середовища. Яку імунологічну реакцію було виконано?","o":["Реакцію преципітації в гелі","Реакцію Кумбса","Реакцію аглютинації","Реакцію кільцепреципітації","Реакцію опсонізації"]},{"id":"v4ttec","t":"М1 · Серологічні реакції","q":"Вагітній жінці, при постановці на облік в жіночу поліклініку, було проведено комплексне дослідження на ряд інфекцій. У сироватці крові були виявлені IgM до вірусу краснухи. Про що свідчить дане обстеження?","o":["Про первинне зараженні жінки","Про хронічний процес","Жінка здорова","Загострення хронічного процесу","Повторне інфікування вірусом краснухи"]},{"id":"75354y","t":"М1 · Серологічні реакції","q":"У пацієнта з бронхіальною астмою за допомогою шкірних алергічних проб встановлено сенсибілізацію алергеном тополиного пуху. Який фактор імунної системи відіграє вирішальну роль в розвитку цього імунопатологічного стану?","o":["IgE","IgD","IgM","Сенсибілізовані Т-лімфоцити","IgG"]},{"id":"zjltq3","t":"М1 · Серологічні реакції","q":"Жінка Д., 54 років звернулася до лікаря зі скаргами на непереносимість курячих яєць, що з’явилася нещодавно. Антигістамінні препарати, що їх призначив лікар призводили до деякого покращення стану хворої. Які антитіла могли сприяти розвитку цієї реакції?","o":["Ig E","Ig А","Ig D","Ig G","Ig M"]},{"id":"118de7q","t":"М1 · Серологічні реакції","q":"У хворого 34-х років після перенесеної кишкової інфекції, викликаної сальмонелами, стали згасати симптоми захворювання. Імуноглобуліни якого класу будуть виявлені в крові хворого в період реконвалесценції?","o":["IgG","IgE","IgM","IgA","IgD"]},{"id":"1oyulok","t":"М1 · Серологічні реакції","q":"З метою встановлення токсигенності виділених від пацієнтів збудників дифтерії, культури висіяли на чашку Петрі з поживним агаром по обидва боки від розташованої в центрі смужки фільтрувального паперу, змоченого протидифтерійною антитоксичною сироваткою. Після інкубації посівів в агарі між окремими культурами і смужкою фільтрувального паперу виявлено смужкоподібні ділянки помутніння середовища. Яку імунологічну реакцію було виконано?","o":["Реакція преципітації в гелі","Реакція опсонізації","Реакція кільцепреципітації","Реакція аглютинації","Реакція Кумбса"]},{"id":"tdco9x","t":"М1 · Серологічні реакції","q":"Пацієнт звернувся до лікаря на другому тижні хвороби, яка за клініко-епідеміологічними даними нагадувала тифо-паратифозне захворювання. Лікар вирішив підтвердити діагноз шляхом виявлення специфічних антитіл. Які препарати слід використовувати для цієї мети?","o":["Діагностикуми","Діагностичні сироватки","Мічені сироватки","Моноклональні антитіла","Адсорбовані монорецепторні сироватки"]},{"id":"2mcd4j","t":"М1 · Серологічні реакції","q":"У хворого діагностовано ГРВІ. У сироватці крові знайдено імуноглобуліни класу М. Який період інфекційного процесу в даному випадку Гострий період Продромальний період Інкубаційний період Реконвалесценція Мікробоносійство 10. Серологічні реакції. Реакція аглютинації. У хворого з типовою клінічною картиною дизентерії, внаслідок раннього застосування антибіотиків під час бактеріологічного дослідження випорожнення шигелли не виявлені. Титр","o":["антишигелльозних антитіл в РПГА у парних сироватках у даного хворого виріс в 4 рази. Про","що це свідчить?","Підтверджує діагноз дизентерії","Виключає діагноз дизентерії","Переніс дизентерію раніше"]},{"id":"deol8b","t":"М1 · Серологічні реакції","q":"Неспецифічна реакція Вакцинальна реакція Серологічна діагностика грипу передбачає виявлення наростання титру антитіл до збудника в сироватці крові хворого. У скільки разів повинен зрости титр антитіл з парною сироваткою, щоб результат вважався достовірним?","o":["В 4 рази і більше","В 2 рази","В один раз","В 3 рази","В пів-титру"]},{"id":"sb7ea5","t":"М1 · Серологічні реакції","q":"Серологічна діагностика інфекційних захворювань заснованана специфічній взаємодії антитіл з антигенами. Як називається серологічна реакція, яка полягає у склеюванні мікроорганізмів при дії на них специфічних антитіл при наявності електроліту?","o":["Реакція аглютинації","Реакція преципітації","Реакція зв'язування комплементу","Реакція гемадсорбції","Реакція нейтралізації"]},{"id":"1bg5jbq","t":"М1 · Серологічні реакції","q":"Хворому із значними опіками зробили пересадку донорської шкіри. Але на 8-му добу трансплантат набряк, змінився його колір і на 11-у добу почав відторгатися. Які клітини беруть у цьому участь?","o":["Т-лімфоцити","Еритроцити","В-лімфоцити","Базофіли","Еозинофіли"]},{"id":"15a84lz","t":"М1 · Серологічні реакції","q":"У хворої з клінічними ознаками імунодефіциту, з незміненою кількістю та функціональною активністю Т- і В-лімфоцитів, при обстеженні виявлений дефект на молекулярному рівні, при якому порушена функція антигенпрезентації імунокомпетентним клітинам. Дефект структур яких клітин є можливим?","o":["Макрофаги, моноцити","Т-лімфоцити, В-лімфоцити","NK-клітини","Фібробласти, Т-лімфоцити, В-лімфоцити","0-лімфоцити"]},{"id":"iwlvag","t":"М1 · Серологічні реакції","q":"Для серологічної діагностики черевнотифозного бактеріоносійства було використано діагностикум, що являє собою оброблені таніном еритроцити барана, на яких адсорбований Vi-антиген Salmonella typhi. В якій реакції буде застосовано цей діагностикум?","o":["РПГА","РГГА","РГА","РП","РЗК"]},{"id":"242skf","t":"М1 · Серологічні реакції","q":"В інфекційну лікарню надійшов пацієнт з клінічними ознаками енцефаліту. В анамнезі - укус кліща. В реакції затримки гемаглютинації виявлено антитіла проти збудника кліщового енцефаліту в розведенні 1 : 20, що не є діагностичним. Вкажіть наступні дії лікаря після одержання вказаного результату:","o":["Повторити дослідження із сироваткою, взятою через 10 днів","Дослідити цю ж сироватку повторно","Використати чутливішу реакцію","Повторити дослідження з іншим діагностикумом","Відхилити діагноз кліщового енцефаліту"]},{"id":"19rjdk1","t":"М1 · Серологічні реакції","q":"В анотації до препарату вказано, що він містить антигени збудника черевного тифу, адсорбовані на стабілізованих еритроцитах барана. З якою метою використовують цей препарат?","o":["Для виявлення антитіл в реакції непрямої гемаглютинації","Для виявлення антитіл в реакції зв’язування комплементу","Для виявлення антитіл в реакції Відаля","Для виявлення антитіл в реакції затримки гемаглютинації","Для серологічної ідентифікації збудника черевного тифу"]},{"id":"10zvuxt","t":"М1 · Серологічні реакції","q":"У хворої після трансплантації печінки через 1,5 місяці погіршився стан внаслідок початку реакції відторгнення трансплантату. Який фактор імунної системи відіграє вирішальну роль в цій реакції?","o":["Т-кілери","Інтерлейкін-1","Природні кілери","В-лімфоцити","Т-хелпери"]},{"id":"13bcqxw","t":"М1 · Серологічні реакції","q":"У дитини 4 років спостерігаються клінічні ознаки коклюшу. З метою серологічної діагностики була поставлена розгорнута реакція з коклюшним та паракоклюшним діагностикумами. На дні пробірок, до яких було внесено діагностикум з Bordetella parapertussis, утворився зернистий осад. Які антитіла виявила ця реакція?","o":["Аглютиніни","Преципітини","Опсоніни","Бактеріолізіни","-"]},{"id":"1r05u6o","t":"М1 · Серологічні реакції","q":"При повторній постановці реакції аглютинації Відаля виявлено наростання титрів антитіл до О-антигенів S.typhi в сироватці хворого з 1: 100 до 1: 400. Як можна трактувати отримані результати?","o":["Хворіє на черевний тиф","Є гострим носієм черевнотифозних мікробів","Є хронічним носієм черевнотифозних мікробів","Раніше перехворів на черевний тиф","Раніше отримав щеплення проти черевного тифу"]},{"id":"187ng9n","t":"М1 · Серологічні реакції","q":"Ефективна діагностика носійства збудників кишкових інфекцій ґрунтується на виявленні антитіл до певних антигенів бактерій в реакції непрямої гемаглютинації. Який стандартний препарат слід застосувати у цій реакції?","o":["Еритроцитарні діагностикуми з адсорбованими антигенами бактерій","Монорецепторні діагностичні сироватки","Антитіла проти імуноглобулінів основних класів","Еритроцити барана й гемолітичну сироватку","Моноклональні антитіла"]},{"id":"1r3mfhq","t":"М1 · Серологічні реакції","q":"У дітей молодшої групи дитбудинку зареєстрований спалах кишкової інфекції з ознаками коліентериту. Які дослідження слід провести для остаточної ідентифікації виділеного збудника?","o":["Вивчити антигенні властивості збудника","Визначити чутливість до антибіотиків","Вивчити чутливість до бактеріофагів","Вивчити біохімічні властивості збудника","Вивчити вірулентність збудника"]},{"id":"1j3dip0","t":"М1 · Серологічні реакції","q":"Ефективна дiагностика носiйства збудникiв кишкових iнфекцiй ґрунтується на виявленнi антитiл до певних антигенiв бактерiй в реакцiї непрямої гемаглютинацiї. Який стандартний препарат слiд застосувати у цiй реакцiї?","o":["Еритроцитарнi дiагностикуми з адсорбованими антигенами бактерiй","Еритроцити барана й гемолiтичну сироватку","Антитiла проти iмуноглобулiнiв основних класiв","Моноклональнi антитiла","Монорецепторнi дiагностичнi сироватки"]},{"id":"gne5vm","t":"М1 · Серологічні реакції","q":"Для серологічної діагностики сифілісу в реакції Вассермана лікар-лаборант підготував такі реактиви: кардіоліпіновий антиген, спиртовий екстракт ліпідів із серцевого м‘яза бика з холестерином, антиген з трепонем, зруйнованих ультразвуком, гемолітична система, фізіологічний розчин, досліджувані сироватки. Який ще компонент необхідний для постановки реакції?","o":["Комплемент","Живі трепонеми","Еритроцити барана","Діагностична преципітуюча сироватка","Антиглобулінова сироватка"]},{"id":"1gr9nak","t":"М1 · Серологічні реакції","q":"З метою серологічної діагностики орнітозу лабораторія досліджує сироватку крові хворого у реакції зв’язування комплементу. Проте внаслідок несправності апарату досліджувана сироватка не була достатньо прогріта і її власний комплемент не інактивувався. Результат реакції - негативний (гемоліз еритроцитів). Чому не можна брати до уваги результат цієї реакції?","o":["Надлишок комплементу із власної сироватки спричиняє гемоліз","Відбувається зниження титру антитіл внаслідок дії комплементу","Власний комплемент блокує антиген","Власний комплемент блокує реакцію","Зв’язування комплементу не настає"]},{"id":"g9bxgq","t":"М1 · Серологічні реакції","q":"Гемолітична сироватка проти еритроцитів барана є необхідною для роботи в лабораторії, де проводиться серологічна діагностика інфекційних захворювань. З якою метою вона використовується?","o":["Як компонент гемолітичної системи в реакції зв'язування комплементу","Для реакції непрямої гемаглютинації","Для діагностики гемолітичної хвороби немовлят при резус-конфлікті","Для реакції затримки гемаглютинації","Для встановлення видової належності еритроцитів у судово-медичній експертизі"]},{"id":"3l98oz","t":"М1 · Серологічні реакції","q":"З метою серологічної діагностики інфекційного захворювання лікарю необхідно здійснити реакцію зв’язування комплементу. Що потрібно використати для постановки цієї реакції, крім сироватки хворого?","o":["Діагностикум, комплемент, гемолітичну систему","Діагностичну сироватку","Інтерферон","Еритроцитарний діагностикум","Анатоксин"]},{"id":"159wt6k","t":"М1 · Серологічні реакції з мітками","q":"Мікробіологічна лабораторія одержала завдання підготуватись до дослідження матеріалу з підозрою на інфікування спорами збудника сибірки. Який з перерахованих нижче діагностичних препаратів дозволить провести швидке виявлення спор?","o":["Люмінісцентна протисибіркова сироватка","Протисибірковий імуноглобулін","Стандартний сибірковий антиген","Ензиммічений імуноглобулін","Моноклональні антитіла проти збудника сибірки"]},{"id":"1y70nb","t":"М1 · Серологічні реакції з мітками","q":"У приймальний покій інфекційної лікарні звернувся чоловік, який, за його словами, одержав поштою конверт з підозрілим порошком. Чоловіка госпіталізували в ізолятор, а порошок з конверта скерували в лабораторію з метою дослідити на наявність спор збудника сибірки. Який метод дослідження дає можливість якнайшвидше виявити можливого збудника?","o":["Імунолюмінесцентний метод","Реакція зв’язування комплементу","Реакція преципітації в гелі","Виділення чистої культури","Біопроба на мишах"]},{"id":"45jmjp","t":"М1 · Серологічні реакції з мітками","q":"Істотним недоліком мікроскопічного методу діагностики інфекцій є його недостатня інформативність у зв’язку з морфологічною подібністю багатьох видів мікроорганізмів. Яка імунологічна реакція дозволяє значно підвищити інформативність цього методу?","o":["Реакція імунофлюоресценції","Реакція Кумбса","Імуноферментний аналіз","Реакція опсонізації","Радіофмунний аналіз"]},{"id":"1eqbh2e","t":"М1 · Серологічні реакції з мітками","q":"З метою діагностики ВІЛ-інфекції досліджують сироватку крові для виявлення специфічних антитіл методом твердофазного імуноферментного аналізу. Які ензиммічені антитіла при цьому використовують?","o":["Проти імуноглобулінів людини","Проти антигенів ВІЛ","Проти білка gp 120","Проти білка gp 17","Проти білка gp 41"]},{"id":"w0gpsh","t":"М1 · Серологічні реакції з мітками","q":"Пацієнт госпіталізований з попереднім діагнозом “гепатит В”. Для діагностики захворювання здійснено постановку серологічної реакції, яка базується на взаємодії антигену з антитілом, хімічно зв’язаним з пероксидазою або лужною фосфатазою. Яку назву має використана серологічна реакція?","o":["Імуноферментний аналіз","Радіоімунологічний метод","Реакція імунофлюоресценції","Реакція зв’язування комплементу","Реакція імобілізації"]},{"id":"9uxv0x","t":"М1 · Серологічні реакції з мітками","q":"В останні роки знайшов застосування метод генної індикації збудників, що дозволяє виявити в досліджуваних зразках фрагменти нуклеїнових кислот патогенів. Виберіть із наведених реакцій ту, яка підходить для цієї мети.","o":["Полімеразна ланцюгова реакція","Реакція наростання титру фага","Радіоімунний аналіз","Реакція преципітації","Імуноферментний аналіз"]},{"id":"urk2n0","t":"М1 · Серологічні реакції з мітками","q":"В закритому колективі виникла необхідність перевірити стан імунітету проти дифтерії, щоб обгрунтувати необхідність вакцинації. Які дослідження слід провести з такою метою?","o":["Встановити титр антитоксинів в РНГА","Перевірити членів колективу на носійство палички дифтерії","Встановити рівень антитіл проти дифтерійної палички","Перевірити медичну документацію щодо вакцинації","Перевірити стан імунітету щодо дифтерійної палички"]},{"id":"136vrtt","t":"М1 · Вакцини та імунні сироватки","q":"Пацієнтові, що звернувся до травмпункту у зв’язку з травмою, отриманою під час роботи на присадибній ділянці, лікар призначив введення правцевого анатоксину. Який імунітет сформується у даного пацієнта після введення препарату?","o":["Антитоксичний активний","Антитоксичний пасивний","Антимікробний пасивний","Антимікробний активний","Нестерильний"]},{"id":"1f976j9","t":"М1 · Вакцини та імунні сироватки","q":"В дитячому садку проведені планові щеплення вакциною проти кору. Яким методом можна перевірити формування післявакцинального імунітету?","o":["Серологічний","Вірусологічний","Бактеріологічний","Алергічний","Бактеріоскопічний"]},{"id":"1nbv2o4","t":"М1 · Вакцини та імунні сироватки","q":"Після введення вакцини БЦЖ немовлятам імунітет до туберкульозу триває доти, доки в організмі є живі бактерії вакцинного штаму. Як найбільш правильно назвати такий вид імунітету?","o":["Нестерильний","Гуморальний","Типоспецифічний","Природжений","Перехресний"]},{"id":"5h7nof","t":"М1 · Вакцини та імунні сироватки","q":"У зв‘язку з тим, що наближається епідемія грипу, районний епідеміолог складає заявку на профілактичні препарати. Який з них сприятиме формуванню активного специфічного імунітету та є найменш реактогенним?","o":["Субодинична вакцина","Жива вакцина","Вбита вакцина","Донорський гамаглобулін","Лейкоцитарний інтерферон"]},{"id":"1h11lyl","t":"М1 · Вакцини та імунні сироватки","q":"У дитячому колективі проведено планову вакцинацію проти кору. Яким методом можна перевірити ефективність проведеної вакцинації?","o":["Серологічний","Біологічний","Алергопроба","Вірусоскопічний","Вірусологічний"]},{"id":"kgbyjp","t":"М1 · Вакцини та імунні сироватки","q":"У людини під дією мутагенного фактору з’явилась велика кількість мутантних клітин. Але більшість з них були розпізнані і знищені клітинами:","o":["Т-лімфоцитами кілерами","Плазмобластами","В-лімфоцитами","Стовбуровими","Т-лімфоцитами супресорами"]},{"id":"sgv39t","t":"М1 · Вакцини та імунні сироватки","q":"Хлопчик на другому році життя став часто хворіти на респіраторні захворювання, стоматити, гнійничкові ураження шкіри. Навіть невеликі пошкодження ясен і слизової оболонки ускладнюються запаленням, що перебігає тривало.Встановлено, що у крові дитини практично відсутні імуноглобуліни всіх класів. Зниження функціональної активності якої клітинної популяції лежить в основі описаного синдрому?","o":["В-лімфоцити","Т-лімфоцити","NK-лімфоцити","Макрофаги","Нейтрофіли"]},{"id":"lfa20u","t":"М1 · Вакцини та імунні сироватки","q":"У жінки 37-ми років протягом року періодично виникали інфекційні захворювання бактеріального генезу, їх перебіг був вкрай тривалим, ремісії - короткочасними. При обстеженні виявленагіпогамаглобулінемія. Порушення функції яких клітин може бути прямою її причиною?","o":["Плазматичні клітини","Макрофаги","Лімфоцити","Нейтрофіли","Фагоцити"]},{"id":"1el72z4","t":"М1 · Вакцини та імунні сироватки","q":"У хворого на дифтерію дитини через 10 днів після введення антитоксичної протидифтерійної сироватки, з'явилися висипання на шкірі, які супроводжувалися сильним свербінням, підвищилася температура тіла до 38оС, з'явилися болі у суглобах. Яку причину цих явищ Ви припускаєте?","o":["Сироваткова хвороба","Анафілактична реакція","Атопія","Гіперчутливість сповільненого типу","Контактна алергія"]},{"id":"15q3tzl","t":"М1 · Вакцини та імунні сироватки","q":"Через декілька хвилин після введення препарату хворому правцем з'явилася задишка, частий пульс, впав артеріальний тиск. Який препарат міг бути найбільш імовірною причиною виниклого ускладнення?","o":["Антитоксична сироватка","Сульфаніламід","Антибіотик","Анатоксин","Донорський гамма- глобулін"]},{"id":"mwieh5","t":"М1 · Вакцини та імунні сироватки","q":"Значну роль у профілактиці туберкульозу відіграє планова масова вакцинація проти туберкульозу новонародженихдітей віком 5-7 днів життя. При цьому застосовують вакцину:","o":["БЦЖ","АКДП","АДП","АД","АКП"]},{"id":"1owq31o","t":"М1 · Вакцини та імунні сироватки","q":"У зв’язку з випадком дифтерії виникла необхідність провести запобіжні щеплення в студентській групі. Який препарат слід використати для створення штучного активного імунітету?","o":["Дифтерійний анатоксин","Антидифтерійну сироватку","Специфічний імуноглобулін","Вакцина АКДП","Вакцина з вбитихбактерій"]},{"id":"47y076","t":"М1 · Вакцини та імунні сироватки","q":"У хворого, який отримав травму в автомобільній катастрофі, через 7 днів з'явилися перші симптоми правця. Йому призначили курс лікування протиправцевоїсироватки і хворий почав видужувати. Через два тижні у хворого підвищилася температура, збільшилися лімфовузли, з'явилася набряклість суглобів, висип, свербіж, порушення з боку серцево-судинної системи. Як називається стан, який винику хворого?","o":["Сироваткова хвороба","Кропив'янка","Анафілактичний шок","Дисбактеріоз","Набряк Квінке"]},{"id":"12xrtfm","t":"М1 · Вакцини та імунні сироватки","q":"Вам запропоновані для роботи наступні препарати: 1.Бруцельозна нашкірна вакцина. 2.Лептоспірозна вакцина. 3.Вакцина БЦЖ. 4.Адсорбована коклюшно-дифтерійно-правцева вакцина АКДП. 5.Адсорбований правцевий анатоксин. Який імунітет створюють ці препарати?","o":["Штучний активний","Нестерильний (інфекційний)","Антибактеріальний","Штучний пасивний","Антитоксичний"]},{"id":"n3e1gu","t":"М1 · Вакцини та імунні сироватки","q":"Для лікування піодермії лікар призначив вакцину, яка виготовлена зі штаму бактерій, виділених від хворого. До якого типу вакцин належить даний препарат?","o":["Аутовакцина","Атенуйована вакцина","Генноінженерна вакцина","Асоційована вакцина","Хімічна вакцина"]},{"id":"pxw2ky","t":"М1 · Вакцини та імунні сироватки","q":"У хворої на дифтерію дитини через 10 днів після введення антитоксичної протидифтерійної сироватки, з'явилися висипання на шкірі, які супроводжувалися сильним свербежем, підвищилася температура тіла до 38оС, з'явилася біль у суглобах. Яку причину цих явищ Ви припускаєте?","o":["Сироваткова хвороба","Анафілактична реакція","Атопія","Гіперчутливість сповільненого типу","Контактна алергія"]},{"id":"1ovq616","t":"М1 · Вакцини та імунні сироватки","q":"Під час проведення хірургічних маніпуляцій було використано новокаїн з метою знеболення. Через 10 хвилин у хворого з’явилися блідість шкірних покривів, задишка, гіпотензія. Яку алергічну реакцію можна припустити?","o":["Анафілактична","Імунокомплексна","Цитотоксична","Клітинно-опосередкована","Стимулююча"]},{"id":"y4m4o6","t":"М1 · Вакцини та імунні сироватки","q":"У хворого діагностовано набутий дефект імунної системи – порушення активації системи комплементу за класичним шляхом на фоні достатнього вмісту компонентів системи. Запідозрено наявність дефекту антитілоутворення. Зменшення вмісту в організмі яких антитіл можна очікувати в першу чергу?","o":["Ig M, IgG","Ig A, IgG","Ig D, IgG","Ig E, IgG","Ig M, Ig А"]},{"id":"rpyje8","t":"М1 · Вакцини та імунні сироватки","q":"У хворого з клінічними ознаками первинного імунодефіциту виявлено порушення функції антигенпрезентації імунокомпетентним клітинам. Дефект структур яких клітин є можливим?","o":["Макрофаги, моноцити","Т-лімфоцити","В-лімфоцити","Фібробласти","0-лімфоцити"]},{"id":"1crimbe","t":"М1 · Вакцини та імунні сироватки","q":"У дитини 10-ти років поставлено пробу Манту (з туберкуліном). Через 48 годин на місці введення туберкуліну з'явилаcя папула розміром до 8 мм у діаметрі. Який тип реакції гіперчутливості розвинувся після введення туберкуліну?","o":["Реакція гіперчутливості IV типу","Реакція типу феномен Артюса","Реакція типу сироваткової хвороби","Атопічна реакція","Реакція гіперчутливості ІІ типу"]},{"id":"1sez0qc","t":"М1 · Вакцини та імунні сироватки","q":"У хворого з періодичними нападами ядухи, які виникають при вдиханні різних ароматичних речовин, діагностована атопічна бронхіальна астма. Діагностовано збільшення IgE. Для якого типу реакцій це характерно:","o":["Анафілактичні реакції","Цитотоксичні реакції","Імунокомплексні реакції","ГУТ","Аутоімунні реакції"]},{"id":"1kwjery","t":"М1 · Вакцини та імунні сироватки","q":"У хворої М. спостерігається локальна реакція на укус бджоли, що виникла в перші хвилини після укусу. За яким типом реакції гіперчутливості вона проходить?","o":["Анафілактичний","Цитотоксичний","Імунокомплексний","Уповільненого типу","Ідіотип-антиідіотип"]},{"id":"1ln5cwu","t":"М1 · Вакцини та імунні сироватки","q":"Хворому з великими опіками зробили пересадку донорської шкіри. Через 4-5 днів шкірний трансплантат прижився. Але на 8-му добу трансплантат набряк, змінився його колір і на 11 добу почав відторгатися. Які клітини приймають у цьому участь?","o":["Т-лімфоцити","Еритроцити","Базофіли","Еозинофіли","В-лімфоцити"]},{"id":"17mpzq5","t":"М1 · Вакцини та імунні сироватки","q":"В основі розвитку імунних і алергічних реакцій організмом застосовуються однакові механізми відповіді імунної системи на антиген. Визначте основну відмінність алергічних реакцій від імунних:","o":["Розвиток пошкодження тканин","Шляхи потрапляння антигенів до організму","Кількість антигену, що потрапляє","Спадкова схильність","Особливість будови антигенів"]},{"id":"1gmg506","t":"М1 · Вакцини та імунні сироватки","q":"При дослідженні імунного статусу людини обов’язково визначають кількість імуноглобулін ів різних класів. Яка з перерахованих реакцій використовується для цього?","o":["Радіальної імунодифузії","Оберненої непрямої гемаглютинації","Ланцюгово-полімеразна","Подвійної імунодифузії","Бласттрансформації"]},{"id":"1n9gqz0","t":"М1 · Вакцини та імунні сироватки","q":"Який стан може розвинутися через 15-30 хвилин після повторного введення антигену внаслідок підвищеного рівня антитіл, переважно ІgЕ, які адсорбуються на поверхні клітин- мішеней тканинних базофілів (тучних клітин) та базофілів крові?","o":["Анафілаксія","Сироваткова хвороба","Гіперчутливість уповільненого типу","Імунокомплексна гіперчутливість","Антитілозалежна цитотоксичність"]},{"id":"5yc6um","t":"М1 · Вакцини та імунні сироватки","q":"У жінки 22-хроків через 5 годин після вживанняморепродуктів на шкірі тулуба та дистальних відділів кінцівок з’явились маленькі сверблячі папули, які частиною зливаються між собою. Через добу висипка самовільно зникла. Назвіть механізм гіперчутливості, що полягає в основі даних змін:","o":["Атопія (місцева анафілаксія)","Клітинна цитотоксичність","Системна анафілаксія","Імунокомплексна гіперчутливість","Антитілоопосередкований клітинний цитоліз"]},{"id":"gf18nc","t":"М1 · Вакцини та імунні сироватки","q":"У дитини 5-ти років діагностовано хворобу Брутона, яка проявляється у важкому перебігу бактеріальних інфекцій, відсутності В-лімфоцитів та плазматичних клітин. Які зміни вмісту імуноглобулінів будуть спостерігатися в сироватці крові цієї дитини?","o":["Зменшення ІgА, ІgМ","Збільшення Іg D, ІgЕ","Змін не буде","Збільшення ІgА, ІgМ","Зменшення ІgD, ІgЕ"]},{"id":"1wlhsf5","t":"М1 · Вакцини та імунні сироватки","q":"У чоловiка 25-ти рокiв дiагностований гострий дифузний гломерулонефрит. З анамнезу: за 18 днiв до прояву хвороби перенiс ангiну. Який механiзм ураження ниркових клубочкiв буде спостерiгатися у цьому випадку?","o":["Iмунний","Медикаментозний","Нефротоксичний","Iшемiчний","–"]},{"id":"1jhn6by","t":"М1 · Вакцини та імунні сироватки","q":"Хлопчик на другому роцi життя став часто хворiти на респiраторнi захворювання, стоматити, гнiйничковi ураження шкiри. Навiть невеликi пошкодження ясен i слизової оболонки ускладнюються запаленням, що протiкає тривало. Встановлено, що у кровi дитини практично вiдсутнi iмуноглобулiни всiх класiв. Зниження функцiональної активностi якої клiтинної популяцiї лежить в основi описаного синдрому?","o":["В-лiмфоцити","Т-лiмфоцити","Нейтрофiли","Макрофаги","NK-лiмфоцити"]},{"id":"14rsz83","t":"М1 · Вакцини та імунні сироватки","q":"До хірургічного відділення ЦРЛ надійшов хворий з колотою раною стопи, яку він отримав під час косовиці. Який специфічний препарат необхідно застосувати з метою екстреної пасивної імунопрофілактики правця?","o":["Антитоксична сироватка","Протиправцева вакцина","Вакцина АКДП","Антибіотики","Анатоксин"]},{"id":"1jsqah0","t":"М1 · Вакцини та імунні сироватки","q":"Дитячий стоматолог мав контакт з хворим на дифтерію підлітком. Час останньої імунізації лікаря проти дифтерії - 12 років. Який препарат необхідно ввести стоматологу?","o":["Антитоксична протидифтерійна сироватка","Жива вакцина","Інтерферон","Хімічна вакцина","Рекомбінантна вакцина"]},{"id":"j1twxz","t":"М1 · Вакцини та імунні сироватки","q":"У дитячому садку планується проведення вакцинації проти коклюшу. Який з наведенихнижче препаратів необхідно використати з цією метою?","o":["Вакцина АКДП","Вакцина БЦЖ","Типоспецифічна сироватка","Нормальний гама-глобулін","АДП анатоксин"]},{"id":"xl264d","t":"М1 · Вакцини та імунні сироватки","q":"У хворого з клінічними ознаками імунодефіциту проведено імунологічні дослідження. Виявлено значне зниження кількості клітин, що утворюють розетки з еритроцитами барана. Який висновокслід зробити на основі даних аналізу?","o":["Зниження рівня Т-лімфоцитів","Зниження рівня В-лімфоцитів","Зниження рівня натуральних кілерів (NK-клітин)","Зниження рівня системи комлементу","Недостатність клітин-ефекторів гуморального імунітету"]},{"id":"bcfrel","t":"М1 · Вакцини та імунні сироватки","q":"Під час обстеження хворого була виявлена недостатня кількість імуноглобулінів. Які з клітин імунної системи їх продукують?","o":["Плазматичні","Т-хелпери","Т-супресори","Т-кілери","Плазмобласти"]},{"id":"1v9xrsr","t":"М2 · Морфологія і ультраструктура вірусів","q":"З метою індикації вірусів в культурі клітин застосовують метод, який ґрунтується на зміні рН культурального живильного середовища в процесі культивування вірусів in vitro. Як називається даний метод індикації вірусів?","o":["Кольорова проба","Цитопатична дія","Реакція гемаглютинації","Реакція гемадсорбції","Реакція бляшкоутворення"]},{"id":"1i6876l","t":"М2 · Морфологія і ультраструктура вірусів","q":"Основним методом вірусологічної діагностики є виділення вірусу в культурах тканин. Про наявність вірусу судять на основі його специфічної дії на клітину. Як вона називається?","o":["ЦПД","РН","РА","РІА","ІФА"]},{"id":"h9yq37","t":"М2 · Морфологія і ультраструктура вірусів","q":"В лабораторії запланована робота по культивуванню вірусів. Які середовища необхідні для вирощування клітинн
