их культур у вигляді моношару?","o":["Середовище Ігла","Середовище Ендо","Жовтково-сольовий агар","Кров’яний м’ясопептонний агар","Жовчний бульйон"]},{"id":"14atnfh","t":"М2 · Морфологія і ультраструктура вірусів","q":"Матеріал від хворого з попереднім діагнозом “грип” направлено до лабораторії. При проведенні вірусологічного дослідження було застосовано реакцію гемадсорбції. Для виявлення яких вірусів може бути використана ця реакція?","o":["Вірусів, що мають гемаглютиніни","Всіх простих вірусів","Всіх складних вірусів","ДНК-геномних вірусів","Будь-яких вірусів"]},{"id":"1yz4x1d","t":"М2 · Бактеріофаги, морфологія і структура","q":"У дитини 8 міс. спостерігається дисфункція кишечника. Якісний і кількісний аналіз кишкової мікрофлори дозволив діагностувати дисбактеріоз. Для лікування дитини призначили колі- протейний бактеріофаг. Який механізм дії цього препарату?","o":["Викликає лізис умовно-патогенних ентеробактерій","Сприяє розмноженню біфідобактерій","Посилює антагоністичну активність лактобацил","Стимулює синтез секреторного IgА","Підвищує бар'єрні властивості слизової оболонки кишечника"]},{"id":"w0gpsh","t":"М2 · Серологічні реакції у вірусології","q":"Пацієнт госпіталізований з попереднім діагнозом “гепатит В”. Для діагностики захворювання здійснено постановку серологічної реакції, яка базується на взаємодії антигену з антитілом, хімічно зв’язаним з пероксидазою або лужною фосфатазою. Яку назву має використана серологічна реакція?","o":["Імуноферментний аналіз","Радіоімунний метод","Реакція імунофлюоресценції","Реакція зв’язування комплементу","Реакція іммобілізації"]},{"id":"242skf","t":"М2 · Серологічні реакції у вірусології","q":"В інфекційну лікарню надійшов пацієнт з клінічними ознаками енцефаліту. В анамнезі - укус кліща. В реакції затримки гемаглютинації виявлено антитіла проти збудника кліщового енцефаліту в розведенні 1:20, що не є діагностичним. Вкажіть наступні дії лікаря після одержання вказаного результату:","o":["Повторити дослідження із сироваткою, взятою через 10 днів","Дослідити цю ж сироватку повторно","Використати чутливішу реакцію","Повторити дослідження з іншим діагностикумом","Відхилити діагноз кліщового енцефаліту"]},{"id":"c1a28","t":"М2 · Ортоміксовіруси","q":"При спалаху гострої респіраторної інфекції з метою встановлення діагнозу “грип” проводиться експрес-діагностика, яка ґрунтується на виявленні специфічного вірусного антигену в досліджуваному матеріалі (змив носоглотки). Яку серологічну реакцію використовують для цього?","o":["Реакція імунофлюоресценції","Реакція зв’язування комплементу","Реакція аглютинації","Реакція преципітації","Реакція опсонізації"]},{"id":"13tlj2t","t":"М2 · Ортоміксовіруси","q":"У вірусологічну лабораторію доставлено патологічний матеріал (виділення слизової оболонки носових ходів), який взяли від хворого з попереднім діагнозом “грип”. Який експрес-метод дасть змогу виявити специфічний вірусний антиген в досліджуваному матеріалі?","o":["Пряма і непряма РІФ","Прямий і непрямий ІФА","РГГА","РНГА","РІА"]},{"id":"o7ut0o","t":"М2 · Ортоміксовіруси","q":"В інфекційну лікарню надійшов хворий з ознаками пневмонії, яка розвинулась на 6-й день захворювання грипом. Який метод найдостовірніше підтверджує грипозну етіологію пневмонії?","o":["Виявлення антигенів вірусу грипу у харкотинні методом ІФА","Дослідження парних сироваток","Зараження курячих ембріонів","Імунолюмінісцентне дослідження мазків-відбитків з носових ходів","Виявлення антитіл проти гемаглютинінів вірусу грипу"]},{"id":"175ikg8","t":"М2 · Ортоміксовіруси","q":"У місті епідемія грипу. Який препарат із перерахованих нижче можна порекомендувати людям для неспецифічної профілактики захворювання?","o":["Лейкоцитарний інтерферон","Протигрипозну вакцину","Пеніцилін","Протигрипозний імуноглобулін","Протигрипозну сироватку"]},{"id":"d3dr39","t":"М2 · Ортоміксовіруси","q":"Вірус грипу містить внутрішні антигени - нуклеопротеїдні (NP), полімеразні (P1, P2, P3), матриксний білок (М) та зовнішні антигени - гемаглютинін (Н) і нейрамінізазу (N). Яким з них належить основна роль у створені імунітету до грипозної інфекції?","o":["Гемаглютинін та нейрамінідаза","Нуклеопротеїдні антигени","Матриксний білок","Полімеразні білки","Нейрамінідаза"]},{"id":"1qdwfms","t":"М2 · Ортоміксовіруси","q":"У хворого діагностовано ГРВІ. У сироватці крові знайдено імуноглобуліни класу М. Який період інфекційного процесу в даному випадку.","o":["Гострий період","Продромальний період","Інкубаційний період","Реконвалесценція","Мікробоносійство"]},{"id":"1ufdgao","t":"М2 · Параміксовіруси – віруси парагрипу, кору, епідемічного паротиту, респіратор","q":"При вірусоскопії клітинного моношару, зараженого інфекційним матеріалом, лікар-лаборант поставив діагноз - респіраторно-синцитіальна вірусна інфекція. Які зміни викликає цей вірус у культурі клітин?","o":["Утворення багатоядерних клітин","Круглоклітинна дегенерація","Тотальна деструкція клітинного моношару","Наявність тілець Бабеша-Негрі","Відшарування моношару"]},{"id":"ut4928","t":"М2 · Параміксовіруси – віруси парагрипу, кору, епідемічного паротиту, респіратор","q":"У хлопчика 6 років помірне підвищення температури, привушні залози збільшені. Зі слини хворого було виділено вірус, який розмножується у курячих ембріонах та тканинних культурах, має гемаглютинуючі властивості та викликає утворення симпластів у культурі клітин. Які ще органи найбільш імовірно можуть бути уражені внаслідок інфекції, викликаної цим вірусом?","o":["Статеві залози","Печінка","Легені","Глоткові мигдалики","Головний мозок"]},{"id":"vf5s8r","t":"М2 · Рабдовіруси, властивості вірусів","q":"У чоловіка 47 років, якого покусала лисиця, через 4 тижні підвищилася температура, розвинулася депресія, апатія, розлади дихання і ковтання. Через 6 днів хворий помер від паралічу серця. У мазках-відбитках з мозку загиблого виявлені тільця Бабеша-Негрі. До якої родини найбільш імовірно належить вірус, якій був причиною смерті людини?","o":["Rhabdoviridae","Аdenoviridae","Herpesviridae","Retroviridae","Orthomyxoviridae"]},{"id":"63jucn","t":"М2 · Рабдовіруси, властивості вірусів","q":"У клітинах мозку лисиці, відловленої у межах міста, виявлені включення у вигляді тілець Бабеша-Негрі. Джерелом якого захворювання була тварина?","o":["Сказ","Інфекційний мононуклеоз","Грип","Кліщовий енцефаліт","Вітряна віспа"]},{"id":"4d337p","t":"М2 · Рабдовіруси, властивості вірусів","q":"До хірургічного кабінету звернулася людина, яку покусала невідома собака. Широкі рвані рани локалізовані на обличчі. Яку лікувально-профілактичну допомогу потрібно надати для профілактики сказу?","o":["Розпочати імунізацію антирабічною вакциною","Призначити комбіновану антибіотикотерапію","Терміново ввести вакцину АКДП","Госпіталізувати хворого і тримати під наглядом лікаря","Терміново ввести нормальний гама-глобулін"]},{"id":"wxy6kq","t":"М2 · Рабдовіруси, властивості вірусів","q":"В лікарню надійшов хворий з рваною раною гомілки, внаслідок укусу хворої на сказ тварини. Яку вакцину необхідно ввести для попередження сказу?","o":["Антирабічну вакцину","АКДП","АДП","БЦЖ","ТАВte"]},{"id":"a46gro","t":"М2 · Рабдовіруси, властивості вірусів","q":"Мисливець звернувся за медичною допомогою з приводу укусів рук пораненою лисицею. Яку допомогу слід надати йому з метою специфічної профілактики сказу?","o":["Введення антирабічної вакцини","Хірургічна обробка рани","Введення антибіотиків","Промивання рани мильним розчином","Обробка рани спиртовим розчином йоду"]},{"id":"1yynuae","t":"М2 · Пікорнавіруси","q":"Випорожнення хворого з підозрою на кишкову вірусну інфекцію обробили антибіотиками протягом доби при 40о С. Потім суспензією заразили первинні та перещеплювані клітинні культури. Через 2-3 дні у заражених клітинах культур виявлено цитопатичну дію. Як проводиться ідентифікація ентеровірусів?","o":["За допомогою реакції нейтралізації цитопатичної дії типоспецифічними ентеровірусними","сироватками","За реакцією імунофлюоресценції","За допомогою реакції гальмування гемаглютинації","За допомогою реакції аглютинації"]},{"id":"v882ax","t":"М2 · Пікорнавіруси","q":"За допомогою реакції преципітації Матеріалом від дитини з попереднім діагнозом \"ентеровірусна інфекція\" заразили культуру клітин мавпи (Vего) і мишат-сисунків, в результаті не виявлено цитопатичного ефекту на культурі клітин, але зареєстрована загибель мишат-сисунків. Які ентеровіруси могли викликати захворювання у цієї дитини?","o":["Коксакі А","Некласифіковані ентеровіруси 68-71","Поліовіруси","Коксакі В","ЕСНО"]},{"id":"1ehqfbe","t":"М2 · Пікорнавіруси","q":"Для серологічної діагностики поліомієліту досліджують парні сироватки хворого. Що варто використовувати як антиген у реакції нейтралізації цитопатогенної дії?","o":["Живі віруси трьох типів","Комплементзв'язуючі антигени вірусу","Антигени, інактивовані формаліном","Антигени-гемаглютиніни","Антигени з капсидних білків вірусу"]},{"id":"1dgtppe","t":"М2 · Пікорнавіруси","q":"Дитина, 5 років, госпіталізована на 2-й день хвороби зі скаргами на підвищення температури, слабкість, розлад ШКТ. В анамнезі: контакт із хворим на поліомієліт. Попередній діагноз:","o":["поліомієліт. Який патологічний матеріал беруть для лабораторного дослідження та який","метод використовують для вірусологічного діагнозу?","Випорожнення. Вірусологічний","Ліквор. Вірусологічний","Кров. Біологічний"]},{"id":"151cr2s","t":"М2 · Пікорнавіруси","q":"Випорожнення. Вірусоскопічний Кров. Вірусологічний У хворого хлопчика 5 років на п'ятий день після початку захворювання зі слизової оболонки носоглотки і мигдаликів виділений збудник поліомієліту. Яку реакцію варто використовувати для встановлення серотипу збудника?","o":["Реакція вірусної нейтралізації цитопатичної дії","Реакція гальмування гемаглютинації","Реакція гальмування гемадсорбції","Реакція непрямої гемаглютинації","Реакція зв'язування комплементу"]},{"id":"zm3ctx","t":"М2 · Пікорнавіруси","q":"Від хворого на гостру кишкову інфекцію виділений вірус, що віднесений до роду ентеровірусів. Для встановлення серотипу вірусу застосовують діагностичні сироватки. Вкажіть, які антитіла повинні містити ці сироватки?","o":["Проти білків капсиду","Проти білків суперкапсидної оболонки","Проти неструктурних білків вірусу","Проти вірусних ферментів","Проти вірусних гемаглютининів"]},{"id":"1adm9wi","t":"М2 · Ретровіруси","q":"При перевірці крові донорів на станції переливання крові, в сироватці одного з них виявлені антитіла до вірусу імунодефіциту людини. Який метод рекомендується для підтвердження діагнозу ВІЛ-інфекції?","o":["Вестернблоту (імуноблотингу)","Електронної мікроскопії","Імуноферментного аналізу","Імунофлюоресценції","Радіоімунного аналізу"]},{"id":"1jl28xi","t":"М2 · Ретровіруси","q":"Після лабораторного обстеження хворого з часто рецидивуючими вірусними, бактеріальними і грибковими опортуністичними інфекціями поставлений діагноз \"ВІЛ інфекція\". Результати якого дослідження дозволили поставити такий діагноз?","o":["Імуноферментний аналіз","Реакція зв'язування комплементу","Реакція преципітації в гелі","Реакція гальмування гемаглютинації","Реакція пасивної гемаглютинації"]},{"id":"1eqbh2e","t":"М2 · Ретровіруси","q":"З метою діагностики ВІЛ-інфекції досліджують сироватку крові для виявлення специфічних антитіл методом твердофазного імуноферментного аналізу. Які ензиммічені антитіла при цьому використовують?","o":["Проти імуноглобулінів людини","Проти антигенів ВІЛ","Проти білка gp 120","Проти білка gp 17","Проти білка gp 41"]},{"id":"ppa9vt","t":"М2 · Ретровіруси","q":"Відомо, що вірус імунодефіциту людини належить до родини Ретровірусів. Вкажіть основну ознаку, що характеризує дану родину Наявність ферменту зворотної транскриптази Містять мінус-РНК Прості віруси, що вражають тільки людину Нуклеїнова кислота не інтегрує в геном хазяїна Реакція імуноферментного аналізу для виявлення антигенів ВІЛ-інфікований пацієнт періодично обстежується з метою виявлення ознак активізації процесу. Назвіть найбільш суттєву ознаку, що вказує на перехід ВІЛ-інфекції в СНІД:","o":["Саркома Капоші, кількість Т-хелперів нижче 200 кл/мкл","Зниження кількості нейтрофілів","Зниження кількості Т-хелперів","Кількість Т-хелперів нижче критичного рівня","Виявлення антитіл до gp 41"]},{"id":"ji16ev","t":"М2 · Ретровіруси","q":"У хворого 25 років з численних шкірних пустул висівається золотистий стафілокок в асоціації з епідермальним стафілококом, в аналізі харкотиння виявлена пневмоциста карінії, у випорожненнях - криптоспоридії, вульгарний протей та гриби роду кандіда. При якому захворюванні зустрічається таке множинне інфікування умовно-патогенними мікроорганізмами?","o":["СНIД","Цукровий діабет","Сепсис","Дисбактеріоз","Медикаментозний агранулоцитоз"]},{"id":"1bhp3ze","t":"М2 · Ретровіруси","q":"При обстеженні молодого чоловіка у центрі профілактики і боротьби зі СНІДом отримано позитивний результат ІФА з антигенами ВІЛ. Скарги на стан здоров'я відсутні. Про що може свідчити позитивний результат ІФА?","o":["Про інфікування ВІЛ","Про захворювання на СНІД","Про інфікування HBV","Про перенесене захворювання на СНІД","Про персистенцію HBV"]},{"id":"vkpa2o","t":"М2 · Ретровіруси","q":"Вірус імунодефіциту людини, маючи на своїй поверхні антигени gp 41 i gp 120, взаємодіє з клітинами-мішенями організму. Виберіть серед перерахованих антигени лімфоцитів людини, з якими комплементарно зв’язується gp 120 вірусу CD 4 CD 3 CD 8 CD 19 CD 28 При дослідженні сироватки крові у пацієнта з ознаками імунодефіциту виявлено антитіла до білків gр 120 i gр 41. Яку інфекцію у хворого підтверджує цей результат?","o":["ВІЛ-інфекція","НLTV-1-інфекція","TORCH-інфекція","НВV-інфекція","ЕСНО-інфекція"]},{"id":"17yrtdj","t":"М2 · Ретровіруси","q":"У пацієнтки 20 років встановлено діагноз - СНІД. Які популяції клітин найбільш чутливі до вірусу імунодефіциту людини?","o":["Т-хелпери","Гепатоцити","Ендотеліоцити","Епітеліоцити","В-лімфоцити"]},{"id":"g7f16w","t":"М2 · Ретровіруси","q":"Встановлено ураження ВІЛ Т-лімфоцитів. При цьому фермент вірусу зворотня транскриптаза (РНК-залежнаДНК-полімераза) каталізує синтез:","o":["ДНК на матриці вірусної і-РНК","Вірусної і-РНК на матриці ДНК","ДНК на вірусній р-РНК","Вірусної РНК на матриці ДНК","і- РНК на матриці вірусного білку"]},{"id":"1foaxjy","t":"М2 · Ретровіруси","q":"До приймального відділення інфекційної лікарні надійшов чоловік 25-ти років. Діагноз:","o":["СНІД. Ураження яких клітин зумовлює стан імунодефіциту?","Т-хелпери","Гладкі клітини (тканинні базофіли)","Т-супресори","Т-кіллери"]},{"id":"12f8x66","t":"М2 · Ретровіруси","q":"Плазмоцити Лімфоцит уражений ретровірусом ВІЛ (СНІД). В цьому випадку напрямок потоку інформації в клітині буде:","o":["РНК —> ДНК —>і-РНК—поліпептид","Поліпептид -> РНК -> ДНК і-РНК","ДНК ->і-РНК -> поліпептид -> ДНК","ДНК —» поліпептид —>і-РНК","і-РНК —> поліпептид —> ДНК"]},{"id":"15llo5y","t":"М2 · Ретровіруси","q":"У хворих із синдромом набутого імунодефіциту (СНІД) різко знижується імунологічна реактивність, що проявляється розвитком хронічних запальних процесів, інфекційних захворювань, пухлинного росту. Клітини якого типу ушкоджує ВІЛ-інфекція, внаслідок чого знижується імунний захист?","o":["Т4-хелпери","Природні кілери (NK)","В-лімфоцити","Т8-ефектори","Т-супресори"]},{"id":"ee1js","t":"М2 · Ретровіруси","q":"При аутопсії померлого на шкірі дистальних відділів нижніх кінцівок виявлені буряково- червоні плями, бляшки та вузли (саркома Капоши). Виявлена також гостра пневмонія, викликана пневмоцистами. Для якого захворювання характерні дані зміни?","o":["СНІД","Кір","Сибірка","Дифтерія","Грип"]},{"id":"vf6clf","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"У дитячому дошкільному закладі напередодні новорічних свят був зареєстрований спалах кишкової інфекції. При бактеріологічному дослідженні випорожнень хворих, патогенних бактерій не було виділено. При електронній мікроскопії виявлено утворення округлої форми з чітким обідком і товстою втулкою, які нагадують колесо. Вкажіть найбільш імовірний збудник даної інфекції.","o":["Rotavirus","Adenovirus","Coxsacki-virus","E. coli","P. vulgaris"]},{"id":"10smea5","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"Вагітній жінці, при постановці на облік в жіночу поліклініку, було проведено комплексне дослідження на ряд інфекцій. У сироватці крові були виявлені IgM до вірусу краснухи. Про що свідчить дане обстеження?","o":["Про первинне зараження жінки","Про хронічний процес","Жінка здорова","Загострення хронічного процесу","Повторне інфікування вірусом краснухи"]},{"id":"1oyk1b3","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"У фекаліях трирічної дитини із сильно вираженою діареєю, яка хворіє впродовж 3-х днів, за методом імунної електронної мікроскопії виявлено віруси із двошаровим капсидом і псевдооболонкою, які нагадують дрібні коліщатка із спицями. Які віруси найбільш вірогідно виявлені?","o":["Ротавіруси","Коксакі-віруси","ЕСНО-віруси","Коронавіруси","Реовіруси"]},{"id":"1kpdwj9","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"У дитяче інфекційне відділення міської лікарні госпіталізована група дітей з попередньо поставленим клінічним діагнозом ‘ротавірусний гастроентерит’. Який основний лабораторний діагностичний принцип використовується в цьому випадку?","o":["Виявлення вірусного антигену в досліджуваному матеріалі","Виявлення специфічних включень у клітинах","Зараження курячих ембріонів","Виділення вірусу в клітинних культурах з наступною ідентифікацією","Зараження лабораторних тварин"]},{"id":"1awk57a","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"У новонародженого виявлені такі аномалії: гідроцефалія, катаракта, порок серця. З анамнезу виявлено, що у матері на 2-му місяці вагітності на тлі субфебрильної температури тіла спостерігається дрібноплямистий рожевий висип. Вкажіть найбільш вірогідний етіологічний чинник, що спричинив транцплатцентарне ураження плоду Вірус краснухи Токсоплазми Цитомегаловірус Вірус простого герпесу - 2 Вірус вітряної віспи - оперізуючого герпесу 10. Збудники вірусних гепатитів. Лабораторна діагности вірусних гепатитів А, В, С, Е","o":["і Д.","При проведенні лабораторної діагностики гепатиту В в останні роки визначають наявність","вірусної ДНК в крові хворого. За допомогою якої з перерахованих реакцій це встановлюють?","Ланцюгової полімеразної реакції","Реакції непрямої гемаглютинації"]},{"id":"52pc9l","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"Реакції зв'язування комплементу Імуноферментного аналізу Реакції гальмування гемаглютинації З метою профілактики гепатиту В групі стоматологів ввели вакцину, яка являє собою генно- інженерний НВs-антиген. Від якого ще інфекційного агента захищає таке щеплення?","o":["Вірус дельта","Вірус Коксакі, група В","Вірус гепатиту С","Вірус імунодефіциту людини","Вірус грипу, тип В"]},{"id":"1ee63em","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"У населеному пункті зареєстровано спалах гепатиту, яку пов'язують з водним фактором. Який вірус гепатиту міг викликати спалах захворювань в цьому населеному пункті?","o":["Вірус гепатиту Е","Вірус гепатиту С","Вірус гепатиту Д","Вірус гепатиту G","Вірус гепатиту B"]},{"id":"8l93jc","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"У хворого з жовтяницею одержано такі дані лабораторного обстеження: HВsAg-, НВеАg-, антиНВsІgG+, антиНВsІgМ-, НСАg+. Який діагноз підтверджується на основі цих даних?","o":["Гепатит С, в анамнезі - гепатит В","Гепатит С","Хронічний гепатит В з низькою реплікативною активністю","Рецидив гепатиту В","Повторне зараження гепатитом В"]},{"id":"1qve0hm","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"У зв'язку з важким перебігом гепатиту В, пацієнту призначено обстеження з метою виявлення можливого агента-супутника, що ускладнює перебіг основного захворювання. Вкажіть цей агент.","o":["Дельта-вірус","Вірус гепатиту С","Вірус гепатиту G","Вірус гепатиту Е","НВs- антиген"]},{"id":"p1g88t","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"Збудник гепатиту Д (дельта-агент) є дефектним вірусом, який може реплікуватися лише в клітинах, уже інфікованих одним з перерахованих вірусів:","o":["Вірусом гепатиту В","Вірусом гепатиту А","Вірусом гепатиту Е","Вірусом Епштейна-Барр","Вірусом імунодефіциту людини"]},{"id":"7mbuty","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"У сироватці хворого виявлений імуноферментним методом НВsAg. При якому захворюванні виявлення даного антигену має діагностичне значення?","o":["Вірусний гепатит В","Кір","ВІЛ","Натуральна віспа","Сказ"]},{"id":"1p2p88p","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"З метою перевірки крові донорів на наявність антигенів гепатиту В необхідно застосовувати високочутливі методи. Яку з названих реакцій слід застосувати з вказаною метою?","o":["Твердофазний імуноферментний аналіз","Реакцію зв’язування комплементу","Реакцію непрямої гемаглютинації","Імуноелектрофорез","Реакцію непрямої імунофлуоресценції"]},{"id":"icu8ta","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"Під час хірургічної операції пацієнту проведено переливання крові. На антигени якого збудника необхідно перевірити цю кров?","o":["Віруса гепатиту В","Віруса гепатиту Е","Аденовірусів","Віруса гепатиту А","Ентеровірусів"]},{"id":"1jt1blr","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"Під час обстеження донора, який тривалий час не здавав кров, за допомогою методу ІФА виявлені анти-НВs антитіла. Про що свідчить у цьому випадку позитивний результат ІФА?","o":["Про перенесений гепатит В","Про хронічний гепатит В","Про хронічний гепатит С","Про гострий гепатит С","Про гострий гепатит В"]},{"id":"1s4fs1z","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"У населеному пункті зареєстрований спалах гепатиту, що зв'язують з водним фактором. Який вірус міг бути причиною цього спалаху?","o":["Гепатиту А","Гепатиту С","Гепатиту В","Гепатиту Д","Гепатиту ні А, ні В"]},{"id":"7p0wqg","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"У лікарню доставлений хворий після автомобільної катастрофи. Йому варто зробити переливання крові. За допомогою якої реакції можна перевірити донорську кров на наявність антигену вірусу гепатиту В?","o":["Імуноферментний аналіз","Реакція гальмування гемаглютинації","Реакція гальмування гемадсорбції","Реакція непрямої гемаглютинації","Реакція зв'язування комплементу"]},{"id":"1qhapsf","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"В інфекційне відділення поступила хвора з ознаками ураження печінки, стоматолог за фахом. Які методи лабораторної діагностики необхідно призначити для встановлення діагнозу “вірусний гепатит В”?","o":["Виявлення HВs-антигену у сироватці крові","Вірусологічне дослідження фекалій","Вірусологічне дослідження сечі","Визначення функціональних проб печінки (білірубін і холестерин крові)","Виявлення активності ферментів (альдолази, трансамілази та ін.)"]},{"id":"17boo25","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"В геном вірусу вісповакцини був інтегрований ген вірусу гепатиту В, що відповідає за утворення HВsАg. Рекомбінантний вірус планується використовувати як препарат для щеплення. До якого типу належить отримана вакцина?","o":["Генно-інженерна","Комбінована","Асоційована","Хімічна","Синтетична"]},{"id":"1334nk4","t":"М2 · Інші РНК-геномні віруси ( рео-, рубі-, корона -, філовіруси)","q":"Через місяць після повернення з літнього табору в інфекційне відділення була доставлена дитина зі скаргами, на підставі яких лікарем поставлений діагноз «вірусний гепатит А?». Який найбільш вірогідний механізм зараження вірусним гепатитом А у цієї дитини?","o":["Фекально-оральний","Контактний","Повітряно-пиловий","Трансмісивний","Парентеральний"]},{"id":"1024832","t":"М2 · Герпесвіруси","q":"У хворого по ходу міжреберних нервів з’явилася пухірцева висипка у вигляді обруча, з больовим синдромом. Яке дослідження найбільш ефективне для експрес-діагностики оперізуючого лишаю?","o":["РІФ з моноклональними антитілами","Виділення вірусу в культурі клітин","РН","ІФА","РЗК"]},{"id":"19uvl63","t":"М2 · Герпесвіруси","q":"У 3-річної дитини тривале підвищення температури, збільшені лімфовузли, у крові значне підвищення кількості лімфоцитів. Методом ІФА виявлено антиген віруса Епштейна-Барра. Який діагноз можна поставити на основі вказаного?","o":["Інфекційний мононуклеоз","Цитомегаловірусна інфекція","Генералізована інфекція, викликана herpes-zoster","Герпетична аденопатія","Лімфома Беркета"]},{"id":"136txen","t":"М2 · Герпесвіруси","q":"У трирічної дитини спостерігається підвищення температури тіла, збільшені лімфовузли. За результатами загального аналізу крові виявлено: лімфоцитоз. Методом ІФА виявлено антиген вірусу Епштейна-Барр. Яке захворювання, найімовірніше, розвинулося у дитини?","o":["Інфекційний мононуклеоз","Лімфома Беркета","Герпетична аденопатія","Цитомегаловірусна інфекція","Генералізована інфекція, викликана herpes-zoster"]},{"id":"18k22ry","t":"М2 · Герпесвіруси","q":"У жінки встановлено діагноз рак шийки матки. З яким вірусом може бути асоційована ця патологія?","o":["Вірус простого герпеса тип 2","Аренавірус","Папілома вірус","Varicella-zoster вірус","Цитомегаловірус"]},{"id":"1ec5rf2","t":"М2 · Герпесвіруси","q":"У пацієнтки, яка одержала імуносупресивну терапію з приводу системного захворювання, з'явились ознаки активізації цитомегаловірусної інфекції. Який метод варто обрати для підтвердження діагнозу?","o":["РЗК, РН з парними сироватками","Біологічний метод","Алергічна проба","Дослідження стану клітинного імунітету","Дослідження стану неспецифічної резистентності"]},{"id":"7v20sg","t":"М2 · Герпесвіруси","q":"До пологового будинку поступила жінка 23 років, яка під час вагітності не проходила планові мікробіологічні та вірусологічні обстеження. У її дитини відразу після народження на шкірі та слизових з'явилися невеликі пухирці на фоні обмежених набрякових плям. Пізніше розвинулося ураження центральної нервової системи і врятувати дитину не вдалося. При посіві вмісту пухирців на кров'яний агар росту збудника не виявлено, а при зараженні ним тканинної культури відмічено ЦПД (симпласти, внутрішньоядерні включення, дегенерація клітин). Який мікроорганізм є найбільш ймовірним збудником інфекції немовляти?","o":["Вірус герпеса","Гонокок","Хламідії","Стафілокок","Цитомегаловірус"]},{"id":"1lk0bj1","t":"М2 · Герпесвіруси","q":"У дитячому садку спостерігалося кілька випадків захворювання дітей. Клінічна картина характеризувалася підвищенням температури і появою у зіві, роті та на шкірі везикулярної висипки. Попередній діагноз – вітряна віспа. Які з перерахованих матеріалів варто направити у вірусологічну лабораторію для експрес-діагностики?","o":["Вміст везикул","Мокротиння","Змиви з рук","Сечу","Жовч"]},{"id":"1dadeqr","t":"М2 · Герпесвіруси","q":"У студента медінституту, госпіталізованого в інфекційне відділення на 2-у добу захворювання, підозрюють інфекційний мононуклеоз. Який результат лабораторного дослідження може підтвердити діагноз у цього студента в день госпіталізації?","o":["Виявлення Ig M-антитіл до вірусу Епштейна-Барр","Виявлення Ig M-антитіл до вірусу простого герпесу","Виявлення 4-х кратного наростання антитіл до вірусу Епштейна-Барр","Ізоляція (виділення) вірусу герпесу","Виявлення антитіл до цитомегаловірусу"]},{"id":"twvua2","t":"М2 · Герпесвіруси","q":"До неврологічного відділення поступила немолода жінка з скаргами на висипання оперізувального характеру на шкірі тулуба. Висипання болючі, мають вид пухирців з серозним вмістом. Який вірус викликав це захворювання?","o":["Альфа-герпесвіруси","Бета-герпесвіруси","Гамма-герпесвіруси","ВІЛ","Поксвіруси"]},{"id":"1guildy","t":"М2 · Герпесвіруси","q":"До лікарні поступила дитина з підвищеною температурою тіла, збільшеними лімфовузлами, висипом. В аналізі крові збільшена кількість моноцитів, виявлені атипові лімфоцити. Лікар запідозрив інфекційний мононуклеоз. Який вірус викликає це захворювання?","o":["Вірус Епштейна-Барр","Цитомегаловірус","Вірус вітряної віспи","Поксвірус","ВІЛ"]},{"id":"fmeu0s","t":"М2 · Герпесвіруси","q":"У хворого підвищена температура, слизова оболонка щік гіперемійована, набрякла, з болючими дрібними висипаннями. Діагностовано гострий герпес. Який препарат використати для лікування?","o":["Ацикловір","Герпетичний Ig","Імуноглобулін","Рибавірин","Атенуйовану вакцину"]},{"id":"w506cw","t":"М2 · Герпесвіруси","q":"У хворої з діагнозом “Рак шийки матки” за допомогою ПЛР було виявлено вірус папіломи людини 16 типу, який, як відомо, інтегрує свою ДНК в геном клітини хазяїна. Яку назву має вірус, інтегрований в геном клітини?","o":["Провірус","Віроїд","Вірусоїд","Віріон","Пріон"]},{"id":"1aosp4i","t":"М2 · Герпесвіруси","q":"Досить часто причиною набутих імунодефіцитів є інфекційне ураження організму, при якому збудники безпосередньо розмножуються в клітинах імунної системи і руйнують їх. Виберіть серед перерахованих ті захворювання, при яких має місце вищезгадане:","o":["Інфекційний мононуклеоз, СНІД","Туберкульоз, мікобактеріоз","Поліоміеліт, гепатит А","Дизентерія, холера","Ку-гарячка, висипний тиф"]},{"id":"13ikj3u","t":"М2 · Герпесвіруси","q":"У дитини 1,5 років з ОРЗ лікар запідозрив аденовірусну інфекцію. За допомогою РЗК в сироватці хворого були виявлені антитіла до аденовірусу у титрі 1:20. В період одужання (через 2 тижні) серологічне дослідження повторили. Який результат підтвердить попередній діагноз?","o":["Збільшення титру антитіл","Зниження титру антитіл","Виявлення антитіл у тій же кількості","РЗК стане негативною","Виявлення неповних антитіл"]},{"id":"1nxkhw3","t":"М2 · Герпесвіруси","q":"Вміст везикул із слизової оболонки хворого на натуральну віспу був направлений у вірусологічну лабораторію. Які зміни з наведених нижче будуть виявлені при мікроскопії мазків?","o":["Тільця Пашена","Тільця Бабеша-Негрі","Тільця Гварнієрі","Тільця Бабеша-Ернста","Синцитій"]},{"id":"t5hmx7","t":"М2 · Герпесвіруси","q":"З рогівки кролика зараженої вмістом везикул хворого з підозрою на натуральну віспу, приготували мазок-відбиток. При мікроскопії препарату, забарвленого за Романовським, виявили тільця різної величини і форми, розташовані в цитоплазмі. Назвіть ці тільця Гварнієрі Арагао Пашена Люпшютца Бабеша-Негрі 13. Екологічна група арбовірусів. Флавівіруси, буньявіруси та філовіруси.","o":["Лабораторна діагностика флавівірусних інфекцій.","У дитини 8 років лікар виявив симптоми кліщового енцефаліту. Який можливий шлях","інфікування крім укусу кліщом?","Молоко кіз, інфікованих вірусом","Прямий контакт з хворою людиною"]},{"id":"d04rxd","t":"М2 · Герпесвіруси","q":"Аліментарний Повітряно-крапельний Повітряно-пиловий У клініку надійшов пацієнт з лихоманкою, менінгеальними явищами, сонливістю, яка змінювалась на безсоння. З анамнезу відомо, що 2 тижні тому він споживав некип’ячене козине молоко. Поставлений попередній діагноз: “кліщовий енцефаліт”. Для дослідження взято кров, якою заразили мишей-сосунків. Через 5 днів у тварин відмітили параліч задніх кінцівок, потім порушення дихання і смерть. Які дослідження дозволять поставити остаточний діагноз?","o":["РН вірусів","Виділення вірусу у курячих ембріонах","Кольорова проба","Дослідження парних сироваток в РГА","Достатньо результатів біопроби"]},{"id":"1cwm3vp","t":"М2 · Герпесвіруси","q":"До інфекціоніста звернулася жінка з клінічними симптомами кліщового енцефаліту. З анамнезу відомо, що неділю тому вона витягнула кліща з ноги. Який набір методів доцільно використовувати для виділення і ідентифікації цього вірусу?","o":["Зараження мишей-сосунків, реакція нейтралізації (РН), РЗК, РТГА з курячими еритроцитами","Зараження морських свинок, реакція аглютинації (РА) з вірусним діагностикумом кліщового","енцефаліту, РНГА","Зараження курячих ембріонів, РЗК, РП, РІА","Зараження культури клітин, РЗК, РН, РГА"]},{"id":"2ofdba","t":"М3 · Стафілококи і стрептококи","q":"У пацієнта з гнійничковими ураженнями шкіри виділено збудник, який на кров'яному агарі утворює округлої форми, середніх розмірів, жовті колонії, оточені зоною гемолізу. В мазках з колоній коки, розташовані скупченнями неправильної форми, грампозитивні. Виділена культура оксидазо- і каталазопозитивна, ферментує маніт, синтезує плазмокоагулазу. Якому виду з нижче перерахованих відповідає виділений збудник?","o":["Staphylococcus aureus","Streptococcus agalactiae","Streptococcus pyogenes","Staphylococcus epidermidis","Staphylococcus saprophyticus"]},{"id":"blnkr2","t":"М3 · Стафілококи і стрептококи","q":"Фекалії дитини, що хворіє на ентерит емульгують в фізіологічному розчині і краплю емульсії наносять на елективне середовище: 10% молочно-сольовий, або жовточно-сольовий агар. Які мікроорганізми передбачається виділити?","o":["Стафілококи","Кишкову паличку","Стрептококи","Клебсієли","Ентерококи"]},{"id":"ftm0qw","t":"М3 · Стафілококи і стрептококи","q":"У дитячому садку після вживання в їжу сиру у дітей виникло захворювання, що характеризується гострим початком, нудотою, блювотою, проносом. при мікроскопії мазків, виготовлених з сиру і блювотних мас виявлені грампозитивні мікроорганізми, що розташовуються в мазках у вигляді скупчень, що нагадують грона винограду. Якими будуть Ваші подальші дії по встановленню етіології цього спалаху харчової інтоксикації?","o":["Додатково провести бактеріологічний метод дослідження","Зробити висновок про те, що причиною захворювань став стафілокок","Додатково поставити алергічну пробу","Додатково визначити антитіла в сироватці крові","Додатково визначити фаготип стафілокока"]},{"id":"1fdq141","t":"М3 · Стафілококи і стрептококи","q":"У хлопчика 12 років після перенесеної ангіни розвинулося ревматичне ураження серця. Кожна наступна стрептококова інфекція погіршує стан хворого. Який препарат доцільно використати для профілактики ускладнень?","o":["Пеніцилін","Стрептококовий анатоксин","Стрептококовий бактеріофаг","Донорський гама-глобулін","Аутовакцина"]},{"id":"ewsz4f","t":"М3 · Стафілококи і стрептококи","q":"У дитини 2-х років з катаральними явищами та висипом на шкірі лікар запідозрив скарлатину. Внутрішньошкірно дитині було введено невелику кількість сироватки до еритрогенного токсину стрептокока, на місці ін'єкції висип зник. Що означають результати реакції?","o":["Клінічний діагноз підтвердився","У дитини підвищена чутливість до еритрогенного токсину","Захворювання викликав негемолітичний стрептокок","Всю дозу сироватки можна вводити внутрішньовенно","Імунна система дитини дуже ослаблена"]},{"id":"13v3u4k","t":"М3 · Стафілококи і стрептококи","q":"У дитячому садку через кілька годин після вживання сирної маси майже у всіх дітей раптово з’явилися симптоми гастроентериту. При бактеріологічному дослідженні блювотних мас та залишків сирної маси було виділено золотистий стафілокок. Як доцільно продовжити дослідження для уточнення джерела інфекції?","o":["Провести фаготипування виділених штамів","Визначити здатність штамів до токсиноутворення","Провести дослідження обладнання харчоблоку","Вивчити наявність антитіл у хворих дітей","Поставити алергічну пробу"]},{"id":"1bro0cg","t":"М3 · Стафілококи і стрептококи","q":"Випорожнення дитини, що хворіє на ентерит, емульгують у фізіологічному розчині і краплю емульсії наносять на елективне середовище: 10%-й жовточно-сольовий агар. Який фермент патогенності виявляється на цьому середовищі?","o":["Лецитиназа","Стрептокіназа","Коліцини","Гемолізини","Гіалуронідаза"]},{"id":"1tfizp5","t":"М3 · Стафілококи і стрептококи","q":"З метою профілактики післяопераційного ускладнення в черевну порожнину хворого ввели 50 мл рідкого полівалентного стафілококового бактеріофага. Який механізм дії цього препарату?","o":["Лізис мікробних клітин","Нейтралізація стафілококових токсинів","Активізація імунітету","Затримка росту збудника","Порушує біосинтез ферментів патогенності"]},{"id":"kq785f","t":"М3 · Стафілококи і стрептококи","q":"Для виявлення джерела інфікування хворих у хірургічному відділенні патогенним стафілококом було проведено дослідження з застосуванням стандартних стафілококових бактеріофагів. Яке дослідження чистих культур, виділених із різних джерел, було проведено?","o":["Фаготипування","Фагодіагностика","Фагоідентифікація","Фаготерапія","Фагоіндикація"]},{"id":"gdbqtm","t":"М3 · Стафілококи і стрептококи","q":"У 65-ти річного чоловіка розвинувся гнійний абсцес на шиї. Виділена культура грампозитивних коків, яка володіє плазмокоагулазною активністю. Швидше за все - це:","o":["Staphylococcus aureus","Streptococcus pyogenes","Staphylococcus epidermidis","Staphylococcus saprophyticus","-"]},{"id":"bydn8a","t":"М3 · Стафілококи і стрептококи","q":"У дитини 7-ми років, яка неодноразово хворіла на стрептококову ангіну, лікар запідозрив розвиток ревматизму і призначив серологічне дослідження. Наявність антитіл до якого з стрептококових антигенів найбільш вірогідно підтвердить передбачуваний діагноз?","o":["О-стрептолізін","С-вуглевод","М-білок","Еритрогенний токсин","Капсульний полісахарід"]},{"id":"1cphxtr","t":"М3 · Стафілококи і стрептококи","q":"При обстеженні пацієнта стоматолог виявив на багатьох зубах \"білі плями\" – зони демінералізації емалі. Вкажіть, які мікророганізми беруть участь у розвитку цього процесу?","o":["Streptococcus mutans","Streptococcus salivarius","Streptococcus pyogenes","Veilonella parvula","Staphylococcus epidermidis"]},{"id":"1p1fuib","t":"М3 · Стафілококи і стрептококи","q":"У харкотинні хворого з підозрою на пневмонію виявлено грампозитивні диплококи, трохи подовжені з дещо загостреними протилежними кінцями. Які мікроорганізми виявлені у харкотинні?","o":["Streptococcus pneumoniae","Staphylococcus aureus","Klebsiella pneumoniae","Neisseria meningitidis","Neisseria gonorrhoeae"]},{"id":"fuvyxs","t":"М3 · Стафілококи і стрептококи","q":"При мікроскопії харкотиння хворого на крупозну пневмонію виявлена значна кількість грампозитивних ланцетоподібних диплококів, оточених капсулою. Виявлення якого збудника слід очікувати?","o":["Streptococcus pneumoniae","Klebsiella pneumoniae","Chlamidia pneumoniae","Staphylococcus aureus","Escherichia coli"]},{"id":"1e3maa3","t":"М3 · Стафілококи і стрептококи","q":"Із рото-глотки хлопчика, який хворіє на хронічний тонзиліт виділили культуру кокових бактерій. У мазках вони розташовувалися у вигляді ланцюжків. Які це можуть бути бактерії?","o":["Стрептококи","Стафілококи","Ешерихії","Клостридії","Вібріони"]},{"id":"12rfmkn","t":"М3 · Стафілококи і стрептококи","q":"У хлопчика 8-ми років виник біль у горлі, підвищилась температура тіла. На 2-й день від початку захворювання виявлені висипання червоного кольору у вигляді дрібних, густо розташованих плям, величиною з макове зерно. Вони покривають все тіло, за винятком носогубного трикутника. При огляді порожнини рота в зіві яскраве почервоніння, мигдалики збільшені, язик малиново-червоний. Який найбільш імовірний діагноз?","o":["Скарлатина","Кір","Стрептококова ангіна","Аденовірусна інфекція","Дифтерія зіва"]},{"id":"1wlhsf5","t":"М3 · Стафілококи і стрептококи","q":"У чоловiка 25-ти рокiв дiагностований гострий дифузний гломерулонефрит. З анамнезу: за 18 днiв до прояву хвороби перенiс ангiну. Який механiзм ураження ниркових клубочкiв буде спостерiгатися у цьому випадку?","o":["Iмунний","Медикаментозний","Нефротоксичний","Iшемiчний","-"]},{"id":"zy314s","t":"М3 · Стафілококи і стрептококи","q":"При бактеріологічному дослідженні проб сметани виділені ізольовані культури S.аureus. Як довести етіологічне значення ізольованої культури S.аureus як збудника харчового отруєння, яке виникло серед групи споживачів сметани?","o":["Виявлення ентеротоксину","Визначення гемотоксинів","Визначення цукролітичних властивостей","Визначення плазмокоагулазної активності","Визначення лецитиназної активності"]},{"id":"q9bph6","t":"М3 · Стафілококи і стрептококи","q":"З метою масового обстеження студентів на носійство S.aureus перед виробничою практикою у дитячому відділенні клінічної лікарні було використано елективне середовище з метою отримання чистої культури цього збудника. Яке з перерахованих середовищ було використано?","o":["Жовтково-сольовий агар","М’ясо-пептонний агар","Середовище Ендо","Кров’яний телуритовий агар","Середовище Вільсона-Блера"]},{"id":"1kd2dvi","t":"М3 · Менінгококи і гонококи","q":"У дитячому садку здійснено обстеження дітей і персоналу з метою виявлення менінгококового носійства. Підберіть метод мікробіологічного дослідження:","o":["Бактеріологічний","Алергічний","Бактеріоскопічний","Біологічний","Серологічний"]},{"id":"xt9oan","t":"М3 · Менінгококи і гонококи","q":"У хворої дитини з явищами гнійного керато-кон'юнктивіту лікар-офтальмолог запідозрив бленорею (гонорейний кон'юнктивіт). Якими методами лабораторної діагностики слід скористатися для підтвердження діагнозу?","o":["Мікроскопічним та бактеріологічним","Серологічним та алергічним","Біологічним та методом фагодіагностики","Біологічним та алергічним","Мікроскопічним та серологічним"]},{"id":"66in3j","t":"М3 · Менінгококи і гонококи","q":"Хворій на назофарингіт дитині лікар поставив діагноз \"менінгококовий назофарингіт\". Який метод лабораторної діагностики найбільш раціональний для підтвердження діагнозу?","o":["Бактеріологічний","Біологічний","Серологічний","Мікроскопічний","Алергічний"]},{"id":"1hgrqfd","t":"М3 · Менінгококи і гонококи","q":"Від хворої дитини на церебро-спінальний менінгіт отримано спинномозкову рідину мутного характеру, яка вміщує велику кількість лейкоцитів. Якою із серологічних реакцій слід скористатися для експрес-діагностики захворювання?","o":["Реакцією преципітації","Реакцією аглютинації","Реакцією зв'язування коиплементу","Реакцією гемаглютинації","Реакцією нейтралізації"]},{"id":"10p5f6","t":"М3 · Менінгококи і гонококи","q":"При дослідженні гнійних виділень з шийки матки бактеріоскопічно виявлено присутність грамнегативних бобовидних диплококків, які знаходилися як в середині, так і поза лейкоцитами. Назвіть чинника гнійного запалення шийки матки ?","o":["Neisseria gonorroeae","Chlamidia trachomatis","Haemophilus vaginalis","Trichomonas vaginalis","Calymmatobacterium granulomatis"]},{"id":"a1p6kd","t":"М3 · Менінгококи і гонококи","q":"Бактеріолог при дослідженні слизу з носоглотки, дотримувася певних заходів щодо збереження збудників у матеріалі. Під час бактереоскопічного дослідження встановлено наявність грамнегативних коків, які нагадують кавові зерна та розташовані парами або тетрадами. Назвіть збудника, який був ізольований бактеріологом:","o":["Neisseria meningitidis","Staphylococcus aureus","Neisseria gonorrhoeae","Moraxella lacunata","Acinetobacter calcoaceticus"]},{"id":"lt1b50","t":"М3 · Менінгококи і гонококи","q":"Хворій жінці поставили клінічний діагноз “гонорея”. Яке із перерахованих нижче досліджень можна застосувати для підтверджння діагнозу?","o":["Мікроскопія патологічного матеріалу","Зараження лабораторних тварин","Проба з бактеріофагом","Реакція гемаглютинації","Реакція іммобілізації"]},{"id":"w2svzr","t":"М3 · Менінгококи і гонококи","q":"Офтальмологом у новонародженної дитини виявлено гнійні виділення з кон’юктиви ока. При мікроскопіїї мазка з кон’юктиви ока знайдено велику кількість лейкоцитів та грамнегативні бобоподібні диплококи, що знаходилися у середині лейкоцитів. Який збудник є причиною цього захворювання?","o":["Neisseria gonorrhoeae","Staphylococcus aureus","Staphylococcus epidermitis","Streptococcus pyogenes","Neisseria catarrhalis"]},{"id":"1s5p972","t":"М3 · Менінгококи і гонококи","q":"У кабінет до лікаря-дерматолога звернувся хворий. З гнійних виділень уретри цього пацієнта лікар приготував мазок, пофарбував за Грамом. При мікроскопії в препараті виявлені лейкоцити, в цитоплазмі яких знаходилася велика кількість грамнегативних бобоподібної форми диплококі. Результати якого процесу спостерігаються у препараті?","o":["Фагоцитозу","Метаболізму","Капсулоутворення","Спороутворення","Малігнізації"]},{"id":"ip2dr0","t":"М3 · Менінгококи і гонококи","q":"Хворий 5 років скаржиться на сильний головний біль, блювоту. Об’єктивно: ригідність м’язів потилиці, блювота у якій не передує нудота, герпетичні висипи на обличчі, лихоманка. На підставі бактеріологічних досліджень якого патологічного матеріалу можливе підтвердження попереднього діагнозу – цереброспінальний менінгіт?","o":["Пункція спинно- мозгової рідини, яка витікає під тиском і має неприємний запах","Виділення уринокультур N.meningitidis","Виділення копрокультур N. meningitidis","Дослідження блювоти","Виділення бактерій N. meningitidis з слизової оболонки сечостатевої системи"]},{"id":"8q4tvn","t":"М3 · Менінгококи і гонококи","q":"При бактеріологічному дослідженні матеріалу від хворого з підозрою на хронічну гонорею, росту мікроорганізмів на спеціальних поживних середовищах не виявлено. Які методи діагностики слід застосувати, щоб підтвердити або спростувати діагноз хронічної гонореї?","o":["Поставити РЗК, алергічну шкірну пробу з гонококковим алергеном","Визначити титр антитіл в сироватці крові хворого, використовуючи РПГА","Біологічний метод","Імунну електронну мікроскопію","Повторити посів досліджуваного матеріалу на диференційно-діагностичні середовища"]},{"id":"1ipvjim","t":"М3 · Менінгококи і гонококи","q":"При бактеріоскопічному дослідженні носоглоткового слизу хворої 2, 5 років на назофарингіт, виявлені грамнегативні диплококи, схожі за формою на кавові зерна. Які структури організму дитини найбільш імовірно будуть уражені, якщо ці мікроорганізми проникнуть у кров?","o":["Оболонки мозку","Сечостатеві шляхи","Серцеві клапани","Лімфатичні вузли","Ниркові гломерули"]},{"id":"14rb0iv","t":"М3 · Менінгококи і гонококи","q":"У дитини 5 років температура підвищилася до 40°С, з’явився різкий головний біль, блювання, неспокій, озноб. Через 4 дні з’явилася геморагічна висипка на шкірі, олігоурія та надниркова недостаність, що і стало причиною смерті. При бактеріологічному дослідженні мазків з глотки виявлено менінгокок. Яка форма хвороби виявлена?","o":["Менінгококовий менінгіт","Менінгоенцефаліт","Менінгококцемія","Менінгококовий назофарингіт","Гідроцефалія"]},{"id":"1f3yu4k","t":"М3 · Менінгококи і гонококи","q":"У новонародженної дитини виявлено гнійні виділення з кон’юктиви ока. Під час мікроскопії мазка з кон’юктиви знайдено велику кількість лейкоцитів та грамнегативні бобоподібні диплококи, що знаходяться всередині лейкоцитів. Який збудник є причиною цього захворювання?","o":["Neisseгіа gоnоrrhоеае","Staphylococcus аurеus","Nеіssегіа саtаrrhаІіs","Strерtососсus рyоgеnеs","Staphylососсus еріdеrmіdіs"]},{"id":"2zp2ph","t":"М3 · Менінгококи і гонококи","q":"При дослідженні гнійних виділень з шийки матки бактеріоскопічно виявлено присутність грамнегативних бобоподібних диплококів, які знаходилися як всередині, так і поза лейкоцитами. Назвіть чинника гнійного запалення шийки матки Nеіssеrіа gоnоrrhоеае Тrісhоmоnаs vаgіnаlіs Сhlаmіdіа tгасhоmаtіs НаеmорhiІus vаgіnаlіs Саlymmаtоbасtеrіum grаnulоmаtіs 3.Ешеріхії. Мікробіологічна діагностика захворювань спричинених кишковою паличкою","o":["Пацієнтка віком 26 років скаржиться на високу температуру тіла, болюче і часте","сечовипускання та біль у лівій половині живота. Під час бактеріологічного дослідження","виділено грамнегативну паличку, яка є факультативним анаеробом, індоло-, оксидазо- і","уреазонегативною, ферментує глюкозу і лактозу. Бактерії якого роду є найімовірнішим","збудником інфекції?"]},{"id":"jvah1y","t":"М3 · Менінгококи і гонококи","q":"Escherichia Proteus Vibrio Campylobacter Neisseria У дітей молодшої групи дитбудинку зареєстрований спалах кишкової інфекції з ознаками коліентериту. Які дослідження слід провестии для остаточної ідентифікації виділеного збудника?","o":["Вивчити антигенні властивості збудника","Визначити чутливість до антибіотиків","Вивчити чутливість до бактеріофагів","Вивчити біохімічні властивості збудника","Вивчити вірулентність збудника"]},{"id":"fpwvfi","t":"М3 · Менінгококи і гонококи","q":"У дитини з гострою кишковою інфекцією швидко розвинулись ознаки зневоднення, з’явилась кров у випорожненнях. Педіатром було запідозрено коліентерит. Яким методом необхідно скористатись для діагностики ентерального ешерихіозу?","o":["Бактеріологічним","Серологічним","Біологічним","Алергічним","Мікроскопічним"]},{"id":"b3l9f0","t":"М3 · Менінгококи і гонококи","q":"З випорожнень хворої дитини 6-місячного віку, яка знаходилась на штучному годуванні, виділена культура кишкової палички з антигенною структурою 0-111. Який діагноз можна поставити?","o":["Коліентерит","Гастроентерит","Холероподібне захворювання","Харчове отруєння","Дизентерієподібне захворювання"]},{"id":"1qj0syb","t":"М3 · Менінгококи і гонококи","q":"При бактеріологічному дослідженні випорожнень чотиримісячної дитини з симптомами гострої кишкової інфекції на середовищі Ендо виросли у великій кількості червоні колонії. Які це можуть бути мікроорганізми?","o":["Ешерихії","Сальмонели","Стафілококи","Стрептококи","Шигели"]},{"id":"8vijd0","t":"М3 · Менінгококи і гонококи","q":"У хлопчика 7 років - холероподібне захворювання (блювота, профузна діарея). При посіві фекалій хворого на середовище Ендо виросли однотипні колонії: малинового кольору, з металевим блиском. Який мікроорганізм є найбільш імовірним збудником захворювання?","o":["Ентеротоксигенна Escherichia coli","Salmonella enteritidis","Yersinia enterocolitica","Shigella sonnei","НАГ-вібріон"]},{"id":"1guzx9u","t":"М3 · Менінгококи і гонококи","q":"Хлопчик 12 років знаходиться у лікарні з підозрою на харчову токсикоінфекцію. При посіві фекалій хворого на середовище Ендо виросла велика кількість безбарвних колоній. Який мікроорганізм можна з найбільшою імовірністю ВИКЛЮЧИТИ з числа можливих збудників захворювання?","o":["Escherichia coli","Salmonella enteritidis","Proteus vulgaris","Pseudomonas aeruginosa","Yersinia enterocolitica"]},{"id":"6oqst9","t":"М3 · Менінгококи і гонококи","q":"До iнфекцiйної лiкарнi поступила дитина з пiдозрою на колiентерит. З випорожнень виділено кишкову паличку. Як встановити належнiсть палички до патогенних варіантів?","o":["У реакцiї аглютинацiї з О сироватками","На пiдставi бiохiмiчних властивостей","Шляхом фаготипування","Мікроскопію забарвлених мазків","За характером росту на середовищi Ендо"]},{"id":"180ocxm","t":"М3 · Менінгококи і гонококи","q":"На дослідження в бактеріологічну лабораторію було відправлено випорожнення хворої дитини грудного віку, з яких виділена культура ентеропатогенних кишкових паличок O55К59. На основі яких критеріїв виділена культура віднесена до ЕПКП O55?","o":["Антигенні властивості","Культуральні ознаки","Морфологічні ознаки","Визначення фаговару","Біохімічні властивості"]},{"id":"x8cxc2","t":"М3 · Сальмонели","q":"Хворому 50 років з метою лікування черевного тифу призначений левоміцетин, але на наступний день стан хворого погіршився, температура підвищилася до 39,6o С. Чим пояснити погіршення стану хворого?","o":["Дією ендотоксинів збудника","Алергічною реакцією","Нечутливістю збудника до левоміцетину","Приєднанням вторинної інфекції","Реінфекцією"]},{"id":"1ox56i5","t":"М3 · Сальмонели","q":"Від хворого з підозрою на черевний тиф виділено чисту культуру збудника, яку ідентифіковано за морфологічними, культуральними та біохімічними властивостями як сальмонела тифу. Яке дослідження слід застосувати для остаточної ідентифікації збудника?","o":["Сероідентифікацію","Серодіагностику","Алергодіагностику","Антибіотикограму","Фаготипування"]},{"id":"netncy","t":"М3 · Сальмонели","q":"Від хворого на гастроентерит виділено збудника, який за морфологічними, культуральними і біохімічними властивостями віднесений до роду сальмонел. Які діагностичні препарати необхідно використовувати для ідентифікації збудника за антигенними властивостями?","o":["Монорецепторні О- і Н-сироватки","Полівалентні сироватки","Аглютинуючі діагностичні сироватки","Сальмонельозні О- і Н-діагностикуми","Монорецепторні сироватки О9 і О4"]},{"id":"539an2","t":"М3 · Сальмонели","q":"При ідентифікації збудника харчової токсикоінфекції з еріод черевного тифу Про реконвалесценцію хворого на черевний тиф При повторній постановці реакції аглютинації Відаля виявлено наростання титрів антитіл до О-антигенів S.typhi в сироватці хворого з 1: 100 до 1: 400. Як можна трактувати отримані","o":["результати?","Хворіє черевним тифом","Є гострим носієм черевнотифозних мікробів","Є хронічним носієм черевнотифозних мікробів","Раніше перехворів на черевний тиф"]},{"id":"131wifz","t":"М3 · Сальмонели","q":"Раніше отримав щеплення проти черевного тифу При обстеженні на бактеріоносійство черевного тифу у сироватці крові кухарки С. шкільної їдальні виявлені Vi-антитіла. Яка з перелікованих реакцій була використана у данному випадку?","o":["РНГА","Реакція Відаля","РЗК","ІФА","РІФ"]},{"id":"1f6azn0","t":"М3 · Сальмонели","q":"Хворий надійшов в інфекційну лікарню на 8-й день зі скаргами на головний біль, недомагання, слабкість. Для серологічного дослідження взято кров. При проведенні реакція аглютинації Відаля встановлено, що вона позитивна в розведенні 1:200 з О-діагностикумом черевного тифу. Який діагноз можна встановити на підставі цього дослідження?","o":["Черевний тиф","Дизентерія","Холера","Лептоспіроз","Туберкульоз"]},{"id":"tdco9x","t":"М3 · Сальмонели","q":"Пацієнт звернувся до лікаря на другому тижні хвороби, яка за клініко-епідеміологічними даними нагадувала тифо-паратифозне захворювання. Лікар вирішив підтвердити діагноз шляхом виявлення специфічних антитіл. Які препарати слід використовувати для цієї мети?","o":["Діагностикуми","Діагностичні сироватки","Мічені сироватки","Моноклональні антитіла","Адсорбовані монорецепторні сироватки"]},{"id":"1g17rc7","t":"М3 · Сальмонели","q":"З метою діагностики тифо-паратифозного захворювання проведено реакцію аглютинації Відаля. Вона виявилася позитивною з черевнотифозним О-антигеном у розведенні 1:1600, з черевнотифозним Н-антигеном – у розведенні 1:200. Про що це свідчить?","o":["Про захворювання на черевний тиф","Відсутність тифо-паратифозного захворювання","Черевнотифозне бактеріоносійство","Інкубаційний період черевного тифу","Перенесений черевний тиф в анамнезі"]},{"id":"1va6f1y","t":"М3 · Сальмонели","q":"З огляду на скарги хворого, дані об'єктивного дослідження та епідситуацію, лікар виставив попередній клінічний діагноз \"Черевний тиф\" і направив досліджуваний матеріал в бактеріологічну лабораторію. Хворий хворіє 2 дні.Яким методом мікробіологічної діагностики можна підтвердити діагноз у даного хворого?","o":["Бактеріологічним","Мікроскопічним","Серологічним","Біологічним","Алергологічним"]},{"id":"8ke5lw","t":"М3 · Сальмонели","q":"У хворого з пiдозрою на черевний тиф протягом двох тижнiв захворювання лабораторний дiагноз не був встановлений. Який матерiал треба направити до лабораторiї для бактерiологiчного дослiдження на третьому тижнi?","o":["Фекалiї та сечу","Харкотиння","Слиз з носу","Слиз з зiву","Промивнi води шлунку"]},{"id":"r33ego","t":"М3 · Сальмонели","q":"Для серологiчної дiагностики черевного тифу використовують реакцiю Вiдаля. Який механiзм взаємодiї антигенiв та антитiл лежить в її основi?","o":["Аглютинацiя","Преципiтацiя","Бактерiолiз","Гемолiз","lмобiлiзацiя бактерій"]},{"id":"km7293","t":"М3 · Шигели","q":"У пацієнта, який захворів 3 дні тому і скаржиться на підвищену температуру 38о С, болі в животі, часті рідкі випорожнення, присутність крові в калі, лікар клінічно діагностував бактеріальну дизентерію. який метод мікробіологічної діагностики доцільно застосувати в даному випадку і який матеріал треба взяти від хворого для підтвердження діагнозу?","o":["Бактеріологічний, кал","Бактеріоскопічний, кал","Бактеріоскопічний, кров","Бактеріологічний, сечу","Серологічний, кров"]},{"id":"1l6var4","t":"М3 · Шигели","q":"При розтині померлої дитини, яка страждала на діарею, виявлено ексикоз і поширений фібринозний коліт. В мазку-відбитку слизової оболонки виявлені грам-негативні палички. Який найбільш вірогідний діагноз?","o":["Дизентерія","Сальмонельоз","Холера","Стафілококова кишкова інфекція","Черевний тиф"]},{"id":"963wz6","t":"М3 · Шигели","q":"Від хворого з діагнозом дизентерія було виділено шигелу зі здатністю продукувати екзотоксин. Про який вид шигел йде мова?","o":["Шигела дизентерії","Шигела Зонне","Шигела Флекснера","Шигела Бойда","Шигела Нью-Кастла"]},{"id":"1sbggsw","t":"М3 · Шигели","q":"Хворий був доставлений в лікарню зі скаргами на головний біль, підвищену температуру, часті випорожнення, болі у животі з тенезмами. Лікар поставив клінічний діагноз \"дизентерія?\" і направив досліджуваний матеріал /випорожнення в баклабораторію. Яким методом діагностики лікар-бактеріолог повинен був підтвердити або спростувати клінічний діагноз?","o":["Бактеріологічним","Біологічним","Бактеріоскопічним","Серологічним","Алергічним"]},{"id":"xgkq72","t":"М3 · Шигели","q":"В інфекційне відділення лікарні госпіталізовано хворого зі скаргами на нудоту, рідкі випорожнення зі слизом та прожилками крові, підвищення температури, слабкість. Лікар запідозрив дизентерію. Який метод лабораторної діагностики найдоцільніше призначити для підтвердження діагнозу?","o":["Бактеріологічний","Серологічний","Мікологічний","Мікроскопічний","Протозоологічний"]},{"id":"3wmie9","t":"М3 · Шигели","q":"В інфекційне відділення надійшов хворий з підозрою на дизентерію. Який основний із наведених методів лабораторної діагностики необхідно назначити?","o":["Бактеріологічний","Серологічний","Алергічний","Біологічний","Мікроскопічний"]},{"id":"ko0bie","t":"М3 · Шигели","q":"У хворого з типовою клінічною картиною дизентерії, внаслідок раннього застосування антибіотиків під час бактеріологічного дослідження випорожнення шигели не виявлені. Титр антишигельозних антитіл в РПГА у парних сироватках у даного хворого виріс в 4 рази. Про що це свідчить?","o":["Підтверджує діагноз дизентерії","Виключає діагноз дизентерії","Переніс дизентерію раніше","Неспецифічна реакція","Вакцинальна реакція"]},{"id":"1t9542t","t":"М3 · Шигели","q":"При бактеріологічному дослідженні випорожнень хворого на кишкову інфекцію була виділена Shigella sonnei. Яку з перерахованих серологічних реакцій було застосовано для ідентифікації виділеної чистої культури?","o":["Реакція аглютинації","Реакція преципітації","Реакція зв’язування комплементу","Реакція нейтралізації","Реакція лізису"]},{"id":"m0owud","t":"М3 · Шигели","q":"У пацієнта з ознаками коліту виділена чиста культура бактерій, яка за морфологічними, культуральними та біохімічними властивостями віднесена до роду шигел. Яку з названих реакцій доцільно застосувати для серологічної ідентифікації культури?","o":["Аглютинації з діагностичними сироватками","Зв’язування комплементу","Непрямої гемаглютинації","Преципітації","Затримки гемаглютинації"]},{"id":"1ejuj70","t":"М3 · Шигели","q":"Для вирішення питання ретроспективної діагностики перенесеної бактеріальної дизентерії було призначено провести серологічне дослідження сироватки крові з метою встановлення титру антитіл до шигел. Яку з перерахованих реакцій доцільно використовувати для цього?","o":["Пасивної гемаглютинації","Зв'язування комплементу","Преципітації","Гемоліз","Бактеріоліз"]},{"id":"8t374n","t":"М3 · Шигели","q":"З фекалій хворого виділені шигели Зонне. Які потрібно провести додаткові дослідження для встановлення джерела інфекції?","o":["Провести фаготипування виділеної чистої культури","Зробити антибіотикограму","Поставити реакцію преципітації","За допомогою реакції зв’язування комплементу","Поставити реакцію нейтралізації"]},{"id":"ebx0h2","t":"М3 · Шигели","q":"При розслідуванні спалаху шигельозу було проведено ряд бактеріологічних досліджень з метою виявлення джерела інфекції. Дослідження не дало результату. Було прийнято рішення провести фагодіагностику. Таке дослідження передбачає:","o":["Визначення фаготипу виділених культур збудників","Виявлення бактеріофагів у патматеріалі","Визначення фагоцитарної активності крові обстежуваних","Постановку реакції наростання титру бактеріофага","Виявлення функціональних порушень у роботі системи травлення"]},{"id":"1rxlfqg","t":"М3 · Шигели","q":"За умов спалаху шигельозу групі студентів, які контактували з хворими призначена фагопрофілактика. Який механізм забезпечить їх захист?","o":["Фаголізис","Фагоцитоз","Фаготипування","Піноцитоз","Полегшена дифузія"]},{"id":"1c5mqo5","t":"М3 · Вібріони","q":"Хворий надійшов до інфекційного відділення з підозрою на холеру. Який основний метод дослідження необхідно використати для підтвердження діагнозу?","o":["Бактеріологічний","Біологічний","Серологічний","Імунологічний","Алергічний"]},{"id":"1ppua9k","t":"М3 · Вібріони","q":"В лабораторію особливо небезпечних інфекцій поступили випорожнення хворого з діагнозом “холера”. Який метод мікробіологічної діагностики потрібно використати, щоб підтвердити або відхилити діагноз?","o":["Бактеріологічний","Алергічний","Бактеріоскопічний","Біологічний","Вірусологічний"]},{"id":"1rbsx6m","t":"М3 · Вібріони","q":"З калу і блювотних мас від хворого з підозрою на холеру були виділені культури вібріонів. Проведення якої реакції дозволить визначити вид мікроба, що викликав це захворювання?","o":["Аглютинації з сироватками, що містять О-антитіла","Аглютинації з сироватками, що містять Н-антитіла","Пасивної гемаглютинації з еритроцитарним антигенним діагностикумом","Аглютинації Відаля","Преципітації"]},{"id":"c4hmue","t":"М3 · Вібріони","q":"До інфекційного відділення госпіталізовано хворого зі скаргами на багаторазовий пронос та блювоту, біль у м'язах ніг, слабкість, запаморочення. Після огляду лікар виставив попередній діагноз \"холера\". Як необхідно досліджувати матеріал від хворого для експрес діагнозу?","o":["Пряма і непряма РІФ","РА","Бактеріологічним методом","Серологічним методом","Біологчним методом"]},{"id":"8zfizr","t":"М3 · Вібріони","q":"У хворого на виразкову хворобу шлунка з підвищеною кислотністю після ендоскопічного і бактеріологічного досліджень були виділені бактерії роду Helicobacter. Завдяки якій властивості ці мікроорганізми не гинуть у кислому середовищі шлунка?","o":["Уреазній активності","Каталазній активності","Оксидазній активності","Стійкості до ванкоміцину","Здібності утворювати капсулу"]},{"id":"ocgisa","t":"М3 · Вібріони","q":"Після дослідження біоптату, взятого у хворого при езофагогастродуоденоскопії, був поставлений бактеріологічний діагноз: хелікобактеріоз. Яка з особливостей бактерій, виділених у даного хворого, була обов'язково врахована при культивуванні?","o":["Мікроаерофільність","Наявність ферменту уреази","Колонізація клітин гастрального типу","Відсутність спор і капсул","Наявність шести полярних джгутиків"]},{"id":"ow0o7k","t":"М3 · Вібріони","q":"У хворого виявлена виразка шлунка. При бактеріологічному дослідженні біоптату, взятого із ушкодженої ділянки шлунку, на 5-й день на шоколадному агарі виросли дрібні колонії грамнегативних оксидоредуктазопозитивних звивистих бактерій. Який із перерахованих мікроорганізмів є найбільш вірогідним збудником в даному випадку?","o":["Helicobacter pylori","Campilobacter jejuni","Campilobacter fetus","Mycoplasma hominis","Chlamydia trachomatis"]},{"id":"194os0l","t":"М3 · Вібріони","q":"У хворого на виразкову хворобу шлунка при проведенні фіброгастроскопії взятий біоптат слизової оболонки у ділянці виразки. З біоптату виготовлений мазок-відбиток, пофарбований за методом Грама; з рештою біоптату проведена проба на уреазну активність. Під час мікроскопії мазка-відбитка виявлені грамнегативні спіралеподібні мікроорганізми, тест на уреазну активність - позитивний. Які бактерії були виявлені?","o":["Helycobacter pylori","Spirilla minor","Shigella flexneri","Treponema pallidum","Campylobacter jeuni"]},{"id":"1gfmvfm","t":"М3 · Вібріони","q":"Під час мікроскопічного дослідження випорожнень пацієнта з явищами профузної діареї, багаторазового блювання та наростаючої інтоксикації, було виявлено Грам-негативні палички, що нагадували кому і розташовувалися групами, у вигляді табунців риб. Культура збудника була виділена через середовище накопичення – 1% пептонну воду, де вона утворювала ніжну плівку. Збудник якого захворювання був виділений?","o":["Холери","Кишкового єрсиніозу","Псевдотуберкульозу","Шигельозу","Сальмонельозу"]},{"id":"b2dvoc","t":"М3 · Коринебактерії","q":"Під час обстеження на бактеріоносійство працівників дитячих закладів у виховательки виділена дифтерійна паличка. Було проведено дослідження на токсигенність збудника, яке показало, що цей штам С. dірhtheriae не продукує екзотоксин. Яку реакцію провели при дослідженні на токсигенність дифтерійних бактерій?","o":["Реакція преципітації в агаровому гелі","Реакція кільцепреципітацїї","Реакція імунофлуоресценсїї","Реакція зв’язування комплементу","Реакція аглютинації"]},{"id":"12zvv3z","t":"М3 · Коринебактерії","q":"У дівчинки 5 років спостерігається висока температура та біль в горлі. Об’єктивно: набряк м’якого піднебіння, на мигдаликах сірі плівки, які важко відділяються, залишаючи глибокі кровоточиві дефекти тканини. Яке з нижчеперерахованих захворювань найбільш імовірне?","o":["Дифтерія зіву","Інфекційний мононуклеоз","Ангіна Симановського-Венсана","Некротична ангіна","Лакунарна ангіна"]},{"id":"wg13c8","t":"М3 · Коринебактерії","q":"У лікарню поступила дитина з діагнозом дифтерія. Якими препаратами для специфічної терапії Ви скористаєтеся?","o":["Протидифтерійною антитоксичною сироваткою, антибіотиками","Дифтерійним анатоксином, антибіотиками","Вакциною \"Кодівак\", сульфаніламідами","Дифтерійними вакцинами: АКДС, АДС, АД","Дифтерійним бактеріофагом"]},{"id":"nbwr5q","t":"М3 · Коринебактерії","q":"Від хворої дитини з підозрою на дифтерію виділено коринебактерію дифтерії. Яке дослідження необхідно провести, щоб переконатись, що даний мікроб є збудником дифтерії у цієї дитини?","o":["Перевірити токсигенність мікроба","Провести фарбування за методом Буррі - Гінса","Виконати посів на кров'яний агар","Заразити кролика","Провести реакцію аглютинації"]},{"id":"mwe628","t":"М3 · Коринебактерії","q":"У клініку доставлено хворого з важким загальним станом, високою температурою, затрудненим диханням. Бактеріоскопічне дослідження матеріалу із зіву та дихальних шляхів дозволило попередньо діагностувати дифтерійний круп. Який метод фарбування при цьому був застосований?","o":["Нейссера","Циль-Нільсена","Гінса-Буррі","Пешкова","Ожешки"]},{"id":"x22sxr","t":"М3 · Коринебактерії","q":"При огляді дитини 4 років зі скаргами на загальну слабкість, біль у горлі та утруднене ковтання лікар запідозрив дифтерію та направив матеріал до бактеріологічної лабораторії. На яке диференційно-діагностичне поживне середовище слід засіяти матеріал для виділення збудника дифтерії?","o":["Кров’яно-телуритовий агар","Середовище Ендо","Середовище Плоскірєва","Середовище Сабуро","Середовище Левенштейна-Йенсена"]},{"id":"1cjdjc0","t":"М3 · Коринебактерії","q":"При обстеженні на бактеріоносійство працівников дитячих закладів у виховательки одного з дитсадків виділена С.diphtheriae. Було проведено дослідження на токсигенність збудника, яке показало, що цей штамм С.diphtheriae не продукує екзотоксин. Яка реакція проводиться при дослідженні на токсигенність дифтерійних бактерій?","o":["Реакція преципітації в агаровому гелі","Реакція кільцепреципітації","Реакція аглютинації","Реакція зв’язування комплемента","Реакція імунофлуоресценсії"]},{"id":"13o9qm1","t":"М3 · Коринебактерії","q":"У дитячому відділенні інфекційної клініки хлопчику поставлено діагноз \"дифтерія\". Який препарат потрібно ввести хворому у першу чергу ?","o":["Протидифтерійну антитоксичну сироватку","Дифтерійний анатоксин","АКДП","АДП","ТАВte"]},{"id":"1o7a84x","t":"М3 · Коринебактерії","q":"У дитини з підозрою на дифтерію із зіву виділена чиста культура мікроорганізмів і вивчені їх морфологічні, тинкторіальні, культуральні і біохімічні властивості, які є типовими для збудників дифтерії. Яке дослідження необхідно ще провести для видачі висновку про те, що виділено патогенну дифтерійну паличку?","o":["Визначення токсигенних властивостей","Визначення протеолітичних властивостей","Визначення уреазної активності","Визначення цістіназної активності","Визначення здатності розщеплювати крохмаль"]},{"id":"k9967j","t":"М3 · Коринебактерії","q":"Лікар отоларинголог при огляді хворого відмітив гіперемію, значний набряк мигдаликів з сірим нальотом на них. При мікроскопії нальоту було виявлено грампозитивні палички розташовані під кутом одна до одної. Про яке захворювання слід думати?","o":["Дифтерія","Ангіна","Скарлатина","Менінгоназофарингіт","Епідемічний паротит"]},{"id":"s9iwe8","t":"М3 · Коринебактерії","q":"В інфекційну клініку поступила дівчинка 7 років з високою температурою, скаргами на біль у горлі, загальну слабість. Лікар запідозрив дифтерію і дав вказівку взяти матеріал із зіву і виділити чисту культуру збудника. Виберіть, що із перерахованого є вирішальним для підтвердження діагнозу “дифтерія” після виділення чистої культури збудника?","o":["Проба на токсигенність","Виявлення у збудника волютинових зерен","Проба на цистиназу","Гемолітична здатність збудника","Фаголізабельність"]},{"id":"1gwyuyk","t":"М3 · Коринебактерії","q":"З носоглотки дитини 5 років виділено мікроорганізм, який за морфологічними та біохімічними ознаками ідентичний Corynebacterium diphtheriae, але не утворює екзотоксин. У результаті якого процесу цей мікроорганізм може стати токсигенним?","o":["Фагова конверсія","Культивування на телурітовому середовищі","Пасаж через організм чутливих тварин","Вирощування у присутності антитоксичної сироватки","Хромосомна мутація"]},{"id":"1jpn98q","t":"М3 · Коринебактерії","q":"Оглядаючи дитину 6-ти років лікар помітив на глоткових мигдалинах сірувату плівку, при спробі видалення якої виникла помірна кровотеча. Бактеріоскопія мазків з мигдалин показала наявність грампозитивних бактерій булавоподібної форми. Які симптоми можуть виникнути у дитини у найближчі дні, якщо не буде проведене специфічне лікування?","o":["Токсичні ураження серцевого м‘яза, печінки, нирок","Набряк легенів","Дуже сильний нападоподібний кашель","Папульозні висипи на шкірі","Хвилеподібна лихоманка"]},{"id":"1bs3ly1","t":"М3 · Коринебактерії","q":"В сім'ї з двома дітьми, у дитини до року, на фоні підвищеної температури, виник напад спастичного кашлю. Подібна картина спостерігалася у старшої дитини дошкільного віку місяць тому. Лікар запідозрив кашлюкову інфекцію. Яким методом можна провести ретроспективну діагностику цього захворювання?","o":["Серологічним","Бактеріологічним","Біологічним","Мікроскопічним","Молекулярно-біологічним"]},{"id":"slh6ce","t":"М3 · Коринебактерії","q":"У хворого з підозрою на дифтерію під час бактеріоскопічного дослідження мазка з зіву виявлені паличкоподібні бактерії з зернами волютину. Який етіотропний препарат є препаратом вибору в даному випадку?","o":["Протидифтерійна антитоксична сироватка","Бактеріофаг","Дифтерійний анатоксин","Еубіотик","Інтерферон"]},{"id":"pgecti","t":"М3 · Коринебактерії","q":"У лікарню надійшла дитина з діагнозом дифтерія. Якими препаратами для специфічної терапії Ви скористаєтеся?","o":["Протидифтерійною антитоксичною сироваткою","Дифтерійним анатоксином, антибіотиками","Вакциною \"Кодівак\", сульфаніламідами","Дифтерійними вакцинами: АКДС, АДС, АД","Дифтерійним бактериофагом"]},{"id":"1ong23g","t":"М3 · Коринебактерії","q":"У хворого впродовж 10-ти днів має місце підвищена температура, напади характерного кашлю. Лікар призначив посів слизу з носоглотки на середовище КВА. Який мікроорганізм передбачається виявити?","o":["Паличка коклюшу","Клебсієла","Стафілокок","Лістерія","Палочка інфлуенци"]},{"id":"13bcqxw","t":"М3 · Коринебактерії","q":"У дитини 4 років спостерігаються клінічні ознаки коклюшу. З метою серологічної діагностики була поставлена розгорнута реакція з коклюшним та паракоклюшним діагностикумами. На дні пробірок, до яких було внесено діагностикум з Bordetella parapertussis, утворився зернистий осад. Які антитіла виявила ця реакція?","o":["Аглютиніни","Преципітини","Опсоніни","Бактеріолізини","Антитоксини"]},{"id":"lhtb6b","t":"М3 · Мікобактерії","q":"У чоловіка 36 років з підозрою на туберкульоз нирок було проведене дослідження осаду сечі. При мікроскопії знайдено кислотостійкі бактерії, але за методом Прайса корд-фактор не виявлений. Яке дослідження дозволить найбільш надійно підтвердити або спростувати попередній діагноз?","o":["Зараження лабораторних тварин","Вивчення токсигенності","Фаготипування виділеної культури","Серологічна ідентифікація збудника","Шкірна алергічна проба"]},{"id":"52hq9e","t":"М3 · Мікобактерії","q":"До ПТУ вступив юнак 16 років з сільської місцевості. При плановому проведенні реакції Манту виявилося, що у цього юнака вона негативна. Яка найбільш раціональна тактика лікаря?","o":["Зробити щеплення БЦЖ","Повторити реакцію через 1 місяць","Провести серодіагностику туберкульозу","Терміново ізолювати юнака з навчального колективу","Провести прискорену діагностику туберкульозу методом Прайса"]},{"id":"7kgbbq","t":"М3 · Мікобактерії","q":"В першому класі було проведене медичне обстеження учнів з метою відбору дітей для ревакцинації проти туберкульозу. Яку з наведених нижче проб при цьому використали?","o":["Проба Манту","Проба Шика","Нашкірна проба з тулярином","Проба Бюрне","Проба з антраксином"]},{"id":"1crim89","t":"М3 · Мікобактерії","q":"У дитини 10-ти років поставлено пробу Манту (з туберкуліном). Через 48 годин на місці введення туберкуліну з'явилаcя папула розміром до 8 мм у диаметрі. Який тип реакції гіперчутливості розвинувся після введення туберкуліну?","o":["Реакція гіперчутливості IV типа","Реакція типа феномен Артюса","Реакція типа сироваткової хвороби","Атопічна реакція","Реакція гіперчутливості ІІ типа"]},{"id":"1jwi89z","t":"М3 · Мікобактерії","q":"Чоловік віком 40 років хворіє на хронічну інфекцію нирок. Під час дослідження осаду сечі пацієнта виявлено кислотостійкі бактерії, що мають вигляд тонких, злегка зігнутих паличок, на картопляно-гліцериновому середовищі за кілька тижнів дають сухі зморшкуваті колонії з жовтувато-рожевим пігментом. До якої групи мікроорганізмів, найімовірніше, належить виділений збудник?","o":["Мікобактерій","Хламідій","Мікоплазм","Трихомонад","Гарднерел"]},{"id":"1lyl2zw","t":"М3 · Збудники анаеробних інфекцій","q":"До лабораторії надійшов матеріал із рани хворого. Попередній діагноз – газова гангрена. Яким мікробіологічним методом можна встановити видову належність збудника?","o":["Бактеріологічним","Алергічним","Бактеріоскопічним","Серологічним","РІА"]},{"id":"a6k8qu","t":"М3 · Збудники анаеробних інфекцій","q":"Пацієнта шпиталізовано зі встановленим попереднім діагнозом: анаеробна газова інфекція. На яке середовище необхідно посіяти матеріал для підтвердження діагнозу?","o":["Кітта-Тароцці","Ендо","Мюллера","Левіна","Ресселя"]},{"id":"rypfed","t":"М3 · Збудники анаеробних інфекцій","q":"У хворого після вживання в їжу консервованих грибів з’явилися симптоми бульбарного паралічу: птоз, двоїння в очах, афонія, порушення ковтання. Попередній діагноз: ботулізм. За допомогою якої реакції можна визначити тип токсину?","o":["Реакція нейтралізації","Реакція аглютинації","Реакція преципітації","Реакція зв’язування комплементу","Реакція імунофлюоресценції"]},{"id":"14rsz83","t":"М3 · Збудники анаеробних інфекцій","q":"До хірургічного відділення ЦРЛ надійшов хворий з колотою раною стопи, яку він отримав під час косовиці. Який специфічний препарат необхідно застосувати з метою екстреної пасивної імунопрофілактики правця?","o":["Антитоксична сироватка","Протиправцева вакцина","Вакцина АКДП","Антибіотики","Анатоксин"]},{"id":"m12nkg","t":"М3 · Збудники анаеробних інфекцій","q":"Пацієнт доставлений в інфекційне відділення з попереднім діагнозом ботулізм. У бактеріологічній лабораторії провели одну з імунних реакцій на вміст ботулінічного токсину в досліджуваному матеріалі. Як називається ця реакція?","o":["Нейтралізації","Аглютинації","Подвійної імунної дифузії","Іммобілізації","Зв’язування комплементу"]},{"id":"ioeyrf","t":"М3 · Збудники анаеробних інфекцій","q":"В бактеріологічну лабораторію надійшов досліджуваний матеріал (промивні води, в’ялена риба домашнього приготування), взятий у хворого з підозрою на ботулізм. На яке поживне середовище слід зробити первинний посів матеріалу?","o":["Середовище Кітта-Тароцці","Сироватковий агар","Цукровий м’ясо-пептонний агар","Цукровий м’ясо-пептонний бульйон","Цукрово-кров’яний агар"]},{"id":"1ybisg","t":"М3 · Збудники анаеробних інфекцій","q":"Клінічні ознаки хвороби у пацієнта почалися через 24 години після вживання рибних консервів і включали нудоту, слабкість, сухість у роті. Потім приєдналися двоїння зображення, афагія, проблеми з диханням. Чим обумовлена така симптоматика при ботулізмі?","o":["Вплив нейротоксину","Розмноження збудника у ШКТ","Активація цАМФ","Вплив ентеротоксину","Вплив ендотоксину"]},{"id":"1bn811r","t":"М3 · Збудники анаеробних інфекцій","q":"Хворому після вживання інфікованого продукту необхідно провести екстренну профілактику (ботулізму). Вкажіть, якіий з перелічених препаратів слід використати?","o":["Полівалентна антитоксична сироватк","Інтерферон","Моновалентна антитоксична сироватка","Анатоксин","Плацентарний гама-глобулін"]},{"id":"1431unx","t":"М3 · Збудники анаеробних інфекцій","q":"Після вживання м'ясних консервів у хворого Н. з'явилося двоїння в очах, сильний головний біль, порушення ковтання, утруднене дихання, м'язова слабкість. Поставлено діагноз ботулізм. З яким фактором патогенності пов'язані клінічні прояви цього захворювання?","o":["Екзотоксин","Гемолізин","Ендотоксин","Плазмокоагулаза","Фибринолізин"]},{"id":"zf9rsc","t":"М3 · Збудники анаеробних інфекцій","q":"Хворий Н. надійшов у лікарню зі скаргами на блювоту, запаморочення, двоїння в очах, важкість при ковтанні. Лікар запідозрив ботулізм. Які методи діагностики доцільно використати для підтвердження діагнозу?","o":["Біологічна проба, бактеріологічний","Алергічна проба, серологічний","Бактеріологічний, мікологічний","Протозоологічний, мікроскопічний","-"]},{"id":"1j0xhgi","t":"М3 · Збудники анаеробних інфекцій","q":"У студента після вживання м'яса, консервованного в домашніх умовах, з'явились симптоми харчового отруєння Clostridiu
